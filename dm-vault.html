  // players added before. Click one, or use the Up / Down arrows and Enter (or Tab). 'Goblin x3' works:
  // the ' x3' is kept.
  let initSugg = [],
    initSuggI = -1;
  function initSuggest() {
    const el = $('#ibname'),
      box = $('#ibsugg');
    if (!el || !box) return;
    const base = el.value.replace(/\s*[x\u00D7]\d{0,2}$/i, '').trim().toLowerCase();
    if (!base) return initSuggClose();
    const list =
      INIT.kind === 'monster'
        ? S.notes
            .filter((n) => noteType(n) === 'monster' && !/(^|\/)templates?\//i.test(n.path))
            .map((n) => ({ name: n.title, note: n }))
        : (INIT.known || []).map((name) => ({ name }));
    // Best matches first: starts with the text, then a word starts with it, then contains it, then an alias.
    const score = (it) => {
      const t = it.name.toLowerCase();
      if (t.startsWith(base)) return 0;
      if (t.split(/[\s(-]+/).some((w) => w.startsWith(base))) return 1;
      // Matches in the middle of a word only from 3 letters ('go' should not find 'dragon').
      if (base.length >= 3 && t.includes(base)) return 2;
      if (base.length >= 3 && it.note && it.note.aliases.some((a) => a.toLowerCase().includes(base))) return 3;
      return 9;
    };
    initSugg = list
      .map((it) => [score(it), it])
      .filter((x) => x[0] < 9)
      .sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name))
      .slice(0, 8)
      .map((x) => x[1]);
    // Nothing to suggest, or the name is already typed in full.
    if (!initSugg.length || (initSugg.length === 1 && initSugg[0].name.toLowerCase() === base)) return initSuggClose();
    initSuggI = 0;
    initSuggDraw();
  }
  function initSuggDraw() {
    const box = $('#ibsugg');
    box.innerHTML = initSugg
      .map((it, i) => {
        let info = '';
        if (it.note) {
          const cr = fmGet(it.note, 'cr'),
            hp = monsterHp(it.note);
          info = [cr && 'CR ' + cr, hp != null && 'HP ' + hp, 'init ' + fmtBonus(monsterInit(it.note))].filter(Boolean).join(' \u00B7 ');
        }
        return `<div class="ib-sg${i === initSuggI ? ' on' : ''}" data-i="${i}"><span>${esc(it.name)}</span>${info ? `<small>${esc(info)}</small>` : ''}</div>`;
      })
      .join('');
    box.hidden = false;
  }
  function initSuggClose() {
    initSugg = [];
    initSuggI = -1;
    const box = $('#ibsugg');
    if (box) box.hidden = true;
  }
  // Puts the chosen name in the Name box (keeping a ' x3'), then moves to the initiative box.
  function initSuggPick(i) {
    const it = initSugg[i];
    const el = $('#ibname');
    if (!it || !el) return;
    const m = el.value.match(/\s*[x\u00D7]\d{1,2}$/i);
    el.value = it.name + (m ? ' ' + m[0].trim() : '');
    initSuggClose();
    $('#ibval').focus();
  }

  // The Monster / Player switch of the Add form.
  function initSwitchKind() {
    INIT.kind = INIT.kind === 'player' ? 'monster' : 'player';
    initSave();
    const b = $('.ib-kind');
    b.className = 'btn ib-kind ' + INIT.kind;
    b.textContent = INIT.kind === 'player' ? 'Player' : 'Monster';
    $('#ibval').placeholder = INIT.kind === 'player' ? 'Total' : '15 or +2';
    $('#ibname').focus();
    initSuggest(); // the suggestions follow the new mode
  }

  // =============================================================================
  // SECTION 9E - PLAYER NOTES ( > [!player] callouts )
  // Write what the players should receive (a clue, a rumour, a handout...) in a player callout:
  //     > [!player] The letter in the desk
  //     > "Meet me at the old mill at midnight. - R."
  // Click the title of a player callout to mark it given: the title is struck through and the callout
  // dimmed (click again to undo). The scroll icon in the header, next to the initiative swords, shows how
  // many of the page's player notes were given (2/5); click it for the list: click a line to mark it given,
  // or the arrow at its end to jump to the callout.
  // Ticks are saved in the browser (key: note path + title), so they survive closing the page.
  // Test in the console:  __wiki.player.given
  // =============================================================================

  const PL_KEY = 'dm-player';
  const PL_ICON = wxSvg('<path d="M6 3h10a2 2 0 0 1 2 2v15l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6"/>');
  let plGiven = {};
  try {
    plGiven = JSON.parse(localStorage.getItem(PL_KEY)) || {};
  } catch (e) {}
  let plOpen = false;
  // Counts how many player callouts with the same title were met while drawing one page, so each gets its
  // own key. Emptied by renderBody() before each page.
  let plSeen = {};

  // Key of one player callout: 'folder/note.md::the-title' (plus ::2, ::3 when a title repeats).
  function playerKey(note, title) {
    const base = (note ? note.path : '') + '::' + (slugify(title) || 'player');
    plSeen[base] = (plSeen[base] || 0) + 1;
    return base + (plSeen[base] > 1 ? '::' + plSeen[base] : '');
  }
  const playerIsGiven = (k) => !!plGiven[k];

  // Ticks or unticks one player note, everywhere it is shown on the page.
  function playerSet(k, on) {
    if (on) plGiven[k] = Date.now();
    else delete plGiven[k];
    try {
      localStorage.setItem(PL_KEY, JSON.stringify(plGiven));
    } catch (e) {}
    document
      .querySelectorAll(`.callout[data-pkey="${CSS.escape(k)}"]`)
      .forEach((c) => c.classList.toggle('given', on));
    renderPlayerBtn();
  }

  // The player callouts of the page being shown: [{ key, label, el }].
  function playerNotes() {
    return [...document.querySelectorAll('#content .article .callout.co-player')].map((el) => ({
      key: el.dataset.pkey,
      label: el.dataset.plabel,
      el,
    }));
  }

  // Draws the scroll icon in the header (and its list when open). Called by setContent() for every page:
  // pages that are not a note simply show a grey icon.
  function renderPlayerBtn() {
    const box = $('#plnotes');
    if (!box) return;
    const list = playerNotes();
    const isNote = !!$('#content .article');
    const done = list.filter((p) => playerIsGiven(p.key)).length;
    let pop = '';
    if (plOpen) {
      pop = `<div class="pl-pop" role="dialog" aria-label="Player notes">
  <div class="pl-h"><b>Player notes</b> <span class="hint">${list.length ? `${done} of ${list.length} given` : ''}</span></div>
  ${
    list.length
      ? `<ul class="pl-list">${list.map((p) => `<li class="${playerIsGiven(p.key) ? 'given' : ''}"><button type="button" class="pl-item" data-act="pl-give" data-pkey="${esc(p.key)}" title="Click: given / not given">${esc(p.label)}</button><button type="button" class="pl-go" data-act="pl-go" data-pkey="${esc(p.key)}" title="Go to it" aria-label="Go to ${esc(p.label)}">&darr;</button></li>`).join('')}</ul>
  <p class="pl-foot"><button type="button" class="btn" data-act="pl-reset">Mark all as not given</button></p>`
      : isNote
        ? '<p class="hint">No player notes on this page. Write them as a callout: <code>&gt; [!player] Title</code></p>'
        : '<p class="hint">Open a note to see its player notes.</p>'
  }
</div>`;
    }
    box.innerHTML = `<button type="button" class="pl-btn${list.length ? '' : ' none'}" data-act="pl-menu" aria-expanded="${plOpen}" title="Player notes on this page">${PL_ICON}${list.length ? `<span>${done}/${list.length}</span>` : ''}</button>${pop}`;
  }
  function playerToggle(open) {
    plOpen = open == null ? !plOpen : open;
    renderPlayerBtn();
  }
  // Jumps to a player callout (opens it if it is folded) and makes it blink once.
  function playerGo(k) {
    const el = document.querySelector(`#content .callout[data-pkey="${CSS.escape(k)}"]`);
    if (!el) return;
    playerToggle(false);
    if (el.tagName === 'DETAILS') el.open = true;
    el.scrollIntoView({ block: 'start' });
    el.classList.remove('pl-flash');
    void el.offsetWidth;
    el.classList.add('pl-flash');
  }
  // Marks every player note of this page as not given.
  function playerReset() {
    playerNotes().forEach((p) => playerSet(p.key, false));
  }

  // =============================================================================
  // SECTION 9F - MONSTERS AND THE PIN PANEL
  // MONSTER NOTES: a note with  type: monster  in its properties is drawn as a D&D stat block. The numbers
  // go in the properties (see the template in the cheatsheet), the traits and actions in the text under
  // ## Traits, ## Actions, ## Legendary Actions... Modifiers are calculated (DEX 14 -> +2) and every
  // bonus, '+14 to hit', damage dice and '(Recharge 5-6)' can be clicked to roll.
  // THE PIN PANEL: a column on the right that stays in place while the story scrolls.
  //   - a link to a note whose type is in PIN_TYPES (monster, npc, merchant, rule...) opens there instead
  //     of leaving the page (Ctrl+click still opens it as a page)
  //   - any note: the Pin button next to its Note / Edit / Source tabs
  //   - several pins = tabs; × unpins; drag the left edge to resize; pins are remembered
  //   - initiative: a monster added to the bar gets its HP (and its initiative when the box is left
  //     empty: d20 + DEX). When its turn comes, its stat block is pinned automatically, with the HP of
  //     every copy in combat (type -7 or +3 to change it).
  // Test in the console:  __wiki.pin.state
  // =============================================================================

  // Note types that open in the pin panel when their link is clicked. Add yours here.
  const PIN_TYPES = ['monster', 'npc', 'merchant', 'rule', 'item', 'spell', 'location', 'handout'];
  const PIN_KEY = 'dm-pins';
  const PIN_ICON = wxSvg('<path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/>');
  // PIN = { items: [paths of the pinned notes], active: path of the tab shown, width: in pixels }
  let PIN = { items: [], active: null, width: 420 };
  try {
    const p = JSON.parse(localStorage.getItem(PIN_KEY));
    if (p && Array.isArray(p.items)) PIN = Object.assign(PIN, p);
  } catch (e) {}
  const pinSave = () => {
    try {
      localStorage.setItem(PIN_KEY, JSON.stringify(PIN));
    } catch (e) {}
  };
  const noteType = (n) => String((n && n.fm && n.fm.type) || '').toLowerCase();
  const isPinType = (n) => PIN_TYPES.includes(noteType(n));

  // ---- Monster helpers -------------------------------------------------------
  // The monster note for a name in the initiative bar ('Goblin 2' -> the Goblin note), or null.
  function monsterNote(name) {
    const n = resolve(name) || resolve(String(name).replace(/\s+\d+$/, ''));
    return noteType(n) === 'monster' ? n : null;
  }
  // A property of a note, whatever the case of its name (Dex, dex, DEX).
  function fmGet(note, key) {
    for (const [k, v] of Object.entries(note.fm)) if (k.toLowerCase() === key) return Array.isArray(v) ? v.join(', ') : String(v).trim();
    return '';
  }
  const abilityMod = (score) => Math.floor((score - 10) / 2);
  const fmtBonus = (n) => (n < 0 ? '-' + -n : '+' + n);
  const monsterDexMod = (note) => {
    const d = parseInt(fmGet(note, 'dex'), 10);
    return isNaN(d) ? 0 : abilityMod(d);
  };
  // Initiative bonus: the 'init:' property (2024 stat blocks), or else the DEX modifier.
  const monsterInit = (note) => {
    const i = parseInt(fmGet(note, 'init').replace('\u2212', '-'), 10);
    return isNaN(i) ? monsterDexMod(note) : i;
  };
  // Average hit points: the first number of 'hp: 256 (19d12+133)'.
  const monsterHp = (note) => {
    const h = parseInt(fmGet(note, 'hp'), 10);
    return isNaN(h) ? null : h;
  };
  // The picture of a note: its 'image:' property, or else an image of the campaign folder named like the
  // note ('Adult Red Dragon' -> adult-red-dragon.jpg / .png / .webp..., or 'Adult Red Dragon.png').
  // Returns { url, name } (url is '' when an image: is written but not found), or null.
  function noteImage(note) {
    const f = fmGet(note, 'image');
    if (f) return { url: imgSrc(f, note), name: f };
    for (const b of [slugify(note.name), note.name.toLowerCase()])
      for (const ext of ['jpg', 'jpeg', 'png', 'webp', 'gif']) {
        const u = findAsset(b + '.' + ext, note);
        if (u) return { url: u, name: b + '.' + ext };
      }
    return null;
  }
  // XP by challenge rating.
  const CR_XP = { 0: 10, '1/8': 25, '1/4': 50, '1/2': 100, 1: 200, 2: 450, 3: 700, 4: 1100, 5: 1800, 6: 2300, 7: 2900, 8: 3900,
    9: 5000, 10: 5900, 11: 7200, 12: 8400, 13: 10000, 14: 11500, 15: 13000, 16: 15000, 17: 18000, 18: 20000, 19: 22000,
    20: 25000, 21: 33000, 22: 41000, 23: 50000, 24: 62000, 25: 75000, 26: 90000, 27: 105000, 28: 120000, 29: 135000, 30: 155000 };
  // 'Dex +6, Con +13' -> each bonus becomes a clickable d20 roll (label: 'Dex save').
  function linkBonuses(text, what) {
    return esc(text).replace(/([A-Za-z][A-Za-z' ]*?)\s*([+\-\u2212]\d{1,2})\b/g, (m, name, b) => {
      const n = b.replace('\u2212', '-');
      return `${name} ${diceLink('d20' + n + ' # ' + name.trim() + (what ? ' ' + what : ''), b)}`;
    });
  }

  // The stat block at the top of a monster note (replaces the infobox), laid out like the 2024 books:
  //   AC and Initiative, HP, Speed / the six abilities with their MOD and SAVE / Skills, Vulnerabilities,
  //   Resistances, Immunities (damage; conditions), Gear, Senses, Languages, CR (XP; PB).
  // The name is not repeated: it is the page title (or the title of the pin). Every MOD, SAVE, skill and the
  // Initiative can be clicked to roll a d20 with that bonus.
  function statBlockHtml(note) {
    const v = (k) => fmGet(note, k);
    const inl = (k) => (v(k) ? inline(v(k), { note, tags: null }) : '');
    const line = (label, html) => (html ? `<div class="sb-line"><b>${label}</b> ${html}</div>` : '');
    const roll = (bonus, label) => diceLink('d20' + fmtBonus(bonus) + ' # ' + label, fmtBonus(bonus).replace('-', '\u2212'));
    const sub = [v('size'), v('creature')].filter(Boolean).join(' ') + (v('alignment') ? ', ' + v('alignment') : '');
    const cr = v('cr');
    const crNum = cr.includes('/') ? 0 : parseFloat(cr);
    const pb = isNaN(crNum) ? 2 : crNum < 5 ? 2 : Math.min(9, 2 + Math.ceil((crNum - 4) / 4));
    // Saving throws written as 'Dex +6, Wis +7': proficient saves; the others use the modifier.
    const saves = {};
    v('saves').replace(/([A-Za-z]{3})[a-z]*\s*([+\-\u2212]\d+)/g, (m, a, b) => (saves[a.toLowerCase()] = parseInt(b.replace('\u2212', '-'), 10)));
    const AB = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
    const abRow = (a) => {
      const sc = parseInt(v(a), 10);
      if (isNaN(sc)) return `<tr><th>${a.toUpperCase()}</th><td>&ndash;</td><td></td><td></td></tr>`;
      const md = abilityMod(sc);
      const sv = a in saves ? saves[a] : md;
      return `<tr><th>${a.toUpperCase()}</th><td>${sc}</td><td>${roll(md, a.toUpperCase() + ' check')}</td><td${a in saves ? ' class="sb-prof"' : ''}>${roll(sv, a.toUpperCase() + ' save')}</td></tr>`;
    };
    const abTable = (list) => `<table class="sb-ab"><thead><tr><th></th><th></th><th>MOD</th><th>SAVE</th></tr></thead><tbody>${list.map(abRow).join('')}</tbody></table>`;
    const abil = AB.some((a) => v(a)) ? `<div class="sb-abil">${abTable(AB.slice(0, 3))}${abTable(AB.slice(3))}</div>` : '';
    const init = monsterInit(note);
    const imm = [v('immunities'), v('condition_immunities')].filter(Boolean).join('; ');
    let crHtml = '';
    if (cr) {
      const xp = v('xp') || CR_XP[cr];
      const lair = v('xp_lair');
      crHtml = `<div class="sb-line"><b>CR</b> ${esc(cr)} (${xp ? `XP ${Number(xp).toLocaleString()}` : ''}${lair ? `, or ${Number(lair).toLocaleString()} in lair` : ''}${xp ? '; ' : ''}PB +${pb})</div>`;
    }
    let img = '';
    const pic = noteImage(note);
    if (pic)
      img = pic.url
        ? `<div class="sb-img"><img src="${esc(pic.url)}" alt="${esc(note.title)}"></div>`
        : `<div class="hint">Image ${esc(pic.name)} not found in the campaign folder.</div>`;
    const rule = '<div class="sb-rule"></div>';
    return `<div class="sb">${img}${sub ? `<div class="sb-sub">${esc(sub)}</div>` : ''}${rule}${
      v('ac') ? `<div class="sb-line"><b>AC</b> ${inl('ac')}<span class="sb-sep"></span><b>Initiative</b> ${roll(init, 'Initiative')} (${10 + init})</div>` : ''
    }${line('HP', inl('hp'))}${line('Speed', inl('speed'))}${abil ? rule + abil : ''}${rule}${line('Skills', v('skills') ? linkBonuses(v('skills'), '') : '')}${line('Vulnerabilities', inl('vulnerabilities'))}${line('Resistances', inl('resistances'))}${line('Immunities', imm ? inline(imm, { note, tags: null }) : '')}${line('Gear', inl('gear'))}${line('Senses', inl('senses'))}${line('Languages', inl('languages'))}${crHtml}</div>`;
  }

  // ---- Pin panel -----------------------------------------------------------------
  function pinNote(n) {
    if (!n) return;
    if (!PIN.items.includes(n.path)) PIN.items.push(n.path);
    const changed = PIN.active !== n.path;
    PIN.active = n.path;
    pinSave();
    renderPin(changed);
  }
  function unpin(path) {
    PIN.items = PIN.items.filter((p) => p !== path);
    if (PIN.active === path) PIN.active = PIN.items[PIN.items.length - 1] || null;
    pinSave();
    renderPin(true);
  }
  // The 'In combat' box of a pinned monster: every copy in the initiative bar with its hit points.
  function pinCombatHtml(n) {
    if (noteType(n) !== 'monster') return '';
    const list = initOrder().filter((c) => c.note === n.path);
    if (!list.length) return '';
    return `<div class="pin-hp"><div class="hint">In combat. HP: type a number, or -7 / +3</div>${list
      .map(
        (c) => `<div class="pin-hp-row${c.id === INIT.cur ? ' cur' : ''}${c.hp === 0 ? ' dead' : ''}"><span class="pin-hp-n">${esc(c.name)}</span><span>HP <input class="pin-hp-in" data-id="${esc(c.id)}" type="text" inputmode="numeric" value="${c.hp == null ? '' : c.hp}" aria-label="Hit points of ${esc(c.name)}"> / ${c.maxhp == null ? '?' : c.maxhp}</span></div>`,
      )
      .join('')}</div>`;
  }
  // Hit points changed in the pin: a number sets them, -7 / +3 changes them (never below 0).
  function pinHpEdited(inp) {
    const c = INIT.list.find((x) => x.id === inp.dataset.id);
    if (!c) return;
    const t = inp.value.trim().replace(/\u2212/g, '-');
    let m;
    if ((m = t.match(/^([+-])\s*(\d+)$/))) c.hp = Math.max(0, (+c.hp || 0) + (m[1] === '-' ? -1 : 1) * +m[2]);
    else if (/^\d+$/.test(t)) c.hp = +t;
    initSave();
    initRefresh();
  }
  // Draws the pin panel. The scroll position is kept unless another tab is shown (resetScroll).
  function renderPin(resetScroll) {
    const box = $('#pin');
    if (!box) return;
    const notes = S.notes.length ? PIN.items.map(getNote).filter(Boolean) : [];
    box.hidden = !notes.length;
    document.documentElement.classList.toggle('pin-on', !box.hidden);
    if (box.hidden) return (box.innerHTML = '');
    const active = notes.find((n) => n.path === PIN.active) || notes[notes.length - 1];
    const old = $('.pin-body', box);
    const keep = !resetScroll && old && box.dataset.active === active.path ? old.scrollTop : 0;
    box.dataset.active = active.path;
    box.style.width = PIN.width + 'px';
    box.innerHTML = `<div class="pin-grip" title="Drag to resize"></div>
<div class="pin-tabs">${notes
      .map(
        (n) => `<div class="pin-tab${n === active ? ' on' : ''}"><button type="button" class="pin-t" data-act="pin-show" data-path="${esc(n.path)}" title="${esc(n.title)}">${esc(n.title)}</button><button type="button" class="pin-x" data-act="pin-close" data-path="${esc(n.path)}" title="Unpin" aria-label="Unpin ${esc(n.title)}">&times;</button></div>`,
      )
      .join('')}</div>
<div class="pin-body"><div class="pin-head"><span class="pin-title">${esc(active.title)}</span><a class="pin-open" href="${noteHref(active)}">Open as page</a></div>${pinCombatHtml(active)}<div class="body">${renderBody(active, { toc: false, idPrefix: 'pin-' }).html}</div></div>`;
    $('.pin-body', box).scrollTop = keep;
  }
  // When a monster's turn comes in the initiative bar, its stat block is pinned.
  function initAutoPin(c) {
    const n = c && (c.note ? getNote(c.note) : c.kind === 'monster' ? monsterNote(c.name) : null);
    if (n) pinNote(n);
    else renderPin();
    psMonsterTurn(n); // its image on the player screen (section 9G)
  }
  // Resizing: drag the left edge of the panel (280 to 800 pixels wide).
  function pinResizeStart(e) {
    const box = $('#pin');
    const right = box.getBoundingClientRect().right;
    e.preventDefault();
    document.body.classList.add('pin-resizing');
    const move = (ev) => {
      PIN.width = Math.max(280, Math.min(800, Math.round(right - ev.clientX)));
      box.style.width = PIN.width + 'px';
    };
    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.body.classList.remove('pin-resizing');
      pinSave();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }

  // =============================================================================
  // SECTION 9G - PLAYER SCREEN (a second window for the players' monitor)
  // The monitor button in the header opens a small menu: Open the player screen (a black window: drag it
  // to the players' monitor, then click inside it for full screen), Black screen, Close, and the automatic
  // mode 'monster images on their turn'.
  // What can be shown:
  //   - any image of a note or of the pin panel: point at it, then 'Show to players' (also in the image
  //     viewer)
  //   - a player note ( > [!player] ): point at it, then 'Show to players' (title and text, large)
  //   - automatically: the image of a monster (image: in its note) when its turn comes in the initiative
  // The screen window is controlled from here: nothing goes through the internet. If this page is reloaded,
  // opening the screen again finds the same window.
  // Test in the console:  __wiki.screen.state
  // =============================================================================

  const PS_NAME = 'dm-player-screen'; // name of the window (lets a reloaded page find it again)
  const PS_KEY = 'dm-screen';
  const PS_ICON = wxSvg('<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>');
  // PS = { win: the window or null, auto: monster images on their turn, current: what is shown (text) }
  const PS = { win: null, auto: true, current: '' };
  try {
    const p = JSON.parse(localStorage.getItem(PS_KEY));
    if (p) PS.auto = p.auto !== false;
  } catch (e) {}
  let psOpenMenu = false;
  let psUrl = null; // the object URL of the image shown (freed when another one is shown)

  const psIsOpen = () => !!(PS.win && !PS.win.closed);
  // The page of the player screen: black, centered image or large text, fonts of the wiki.
  function psPage() {
    const fonts = $('#fonts') ? $('#fonts').textContent : '';
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Player screen</title><style>${fonts}
html,body{margin:0;height:100%;background:#000;color:#e9e6dc;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#stage.out{opacity:0}
#stage img{max-width:100vw;max-height:100vh;object-fit:contain}
.text{max-width:min(62rem,90vw);max-height:90vh;overflow:auto;padding:3rem;font:2rem/1.5 Alegreya,Georgia,serif}
.text h1{font:400 3rem/1.2 'IM Fell English',Georgia,serif;margin:0 0 1.2rem;color:#e3bd6b}
.text p{margin:.6em 0}
.text a{color:inherit;text-decoration:none}
#hint{position:fixed;left:0;right:0;bottom:1.5rem;text-align:center;font:1rem Alegreya,Georgia,serif;color:#666;transition:opacity 1s}
</style></head><body><div id="stage"></div><div id="hint">Drag this window to the players' monitor, then click here for full screen.</div></body></html>`;
  }
  // Opens the player screen (or finds it again) and resolves with its window, or null.
  // window.open() is called right away (browsers only allow it during a click); the rest can wait.
  async function psOpen() {
    const FEAT = 'popup,width=1280,height=720';
    let w = psIsOpen() ? PS.win : window.open('', PS_NAME, FEAT);
    if (!w) {
      alert('The browser blocked the player screen. Allow pop-ups for this page, then try again.');
      return null;
    }
    const usable = (x) => {
      try {
        return !!x.document.body;
      } catch (e) {
        return false;
      }
    };
    // After this page was reloaded, the old screen belongs to the previous page and cannot be controlled
    // any more (browser security): it is closed and a new one opens (drag it back to the players' monitor).
    if (!usable(w)) {
      try {
        w.close();
      } catch (e) {}
      w = window.open('', PS_NAME, FEAT);
      PS.reopened = true;
      for (let i = 0; i < 40 && !usable(w); i++) await new Promise((r) => setTimeout(r, 50));
      if (!usable(w)) {
        alert('Close the player screen window, then open it again from here.');
        return null;
      }
    }
    PS.win = w;
    const d = w.document;
    if (!d.getElementById('stage')) {
      d.open();
      d.write(psPage());
      d.close();
      // A click in the screen switches it to full screen (the browser only allows it after a click there).
      d.addEventListener('click', () => {
        if (!d.fullscreenElement && d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => {});
        const h = d.getElementById('hint');
        if (h) h.style.opacity = 0;
      });
    }
    w.focus();
    renderPsBtn();
    return w;
  }
  function psClose() {
    if (psIsOpen()) PS.win.close();
    PS.win = null;
    PS.current = '';
    renderPsBtn();
  }
  // Puts new content on the screen with a short fade.
  async function psStage(html, what) {
    const w = await psOpen();
    if (!w) return;
    const st = w.document.getElementById('stage');
    st.classList.add('out');
    setTimeout(() => {
      st.innerHTML = html;
      st.classList.remove('out');
    }, 180);
    PS.current = what;
    renderPsBtn();
  }
  function psBlack() {
    if (psIsOpen()) psStage('', '');
  }
  // Shows an image. The picture is copied into the screen window, so it works with the images of the
  // campaign folder too.
  async function psShowImage(src, what) {
    if (!src) return;
    let url = src;
    if (/^blob:/.test(src)) {
      const w = await psOpen();
      if (!w) return;
      try {
        const blob = await (await fetch(src)).blob();
        url = w.URL.createObjectURL(blob);
        if (psUrl) w.URL.revokeObjectURL(psUrl);
        psUrl = url;
      } catch (e) {}
    }
    psStage(`<img src="${esc(url)}" alt="">`, what || 'an image');
  }
  // Shows a player note: its title and its text, large. Dice and links become plain text.
  function psShowNote(callout) {
    const t = callout.querySelector('.pl-t');
    const body = callout.querySelector('.cbody');
    const clean = body ? body.cloneNode(true) : null;
    if (clean) clean.querySelectorAll('img').forEach((i) => i.remove());
    const title = callout.dataset.plabel || (t ? t.textContent : '');
    psStage(`<div class="text">${t ? `<h1>${esc(t.textContent)}</h1>` : ''}${clean ? clean.innerHTML : ''}</div>`, title);
    // Images inside the player note: show the first one instead of the text if there is no text.
    if (body && !body.textContent.trim()) {
      const img = body.querySelector('img');
      if (img) psShowImage(img.src, title);
    }
  }
  // Initiative: when a monster's turn comes and its note has an image, show it (screen open + Auto on).
  function psMonsterTurn(note) {
    if (!PS.auto || !psIsOpen() || !note) return;
    const pic = noteImage(note);
    if (pic && pic.url) psShowImage(pic.url, note.title);
  }

  // The monitor button in the header, and its menu.
  function renderPsBtn() {
    const box = $('#pscreen');
    if (!box) return;
    const open = psIsOpen();
    let pop = '';
    if (psOpenMenu)
      pop = `<div class="ps-pop" role="dialog" aria-label="Player screen">
  <div><b>Player screen</b> <span class="hint">${open ? (PS.current ? 'showing ' + esc(PS.current) : 'black') : 'closed'}</span></div>
  ${PS.reopened && open ? '<p class="hint">The page was reloaded, so the screen had to be opened again: drag it back to the players\' monitor.</p>' : ''}
  <p class="ps-btns"><button type="button" class="btn primary" data-act="ps-open">${open ? 'Bring to front' : 'Open'}</button> <button type="button" class="btn" data-act="ps-black"${open ? '' : ' disabled'}>Black screen</button> <button type="button" class="btn" data-act="ps-close"${open ? '' : ' disabled'}>Close</button></p>
  <button type="button" class="ps-auto${PS.auto ? ' on' : ''}" data-act="ps-auto">Monster images on their turn: <b>${PS.auto ? 'On' : 'Off'}</b></button>
  <p class="hint">Drag the screen to the players' monitor and click inside it for full screen. Point at an image or a player note to show it.</p>
</div>`;
    box.innerHTML = `<button type="button" class="ps-btn${open ? ' live' : ''}" data-act="ps-menu" aria-expanded="${psOpenMenu}" title="Player screen${open ? ' (open)' : ''}">${PS_ICON}</button>${pop}`;
  }
  function psToggleMenu(open) {
    psOpenMenu = open == null ? !psOpenMenu : open;
    renderPsBtn();
  }

  // The 'Show to players' button that appears when you point at an image or a player note.
  let psHoverEl = null,
    psHideTimer = null;
  function psHover(el) {
    clearTimeout(psHideTimer);
    let b = $('#psshow');
    if (!b) {
      b = document.createElement('button');
      b.type = 'button';
      b.id = 'psshow';
      b.innerHTML = PS_ICON + ' Show to players';
      b.addEventListener('mouseenter', () => clearTimeout(psHideTimer));
      b.addEventListener('mouseleave', psHoverEnd);
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const t = psHoverEl;
        b.hidden = true;
        if (!t) return;
        if (t.tagName === 'IMG') psShowImage(t.src, t.alt || 'an image');
        else psShowNote(t);
      });
      document.body.appendChild(b);
    }
    psHoverEl = el;
    const r = el.getBoundingClientRect();
    b.hidden = false;
    // Images: inside their top-right corner. Player notes: just above their top-right corner (so the
    // fold arrow of a folded note stays free).
    b.style.top = Math.max(el.tagName === 'IMG' ? r.top + 6 : r.top - b.offsetHeight + 2, 60) + 'px';
    b.style.left = Math.min(r.right - b.offsetWidth - 6, innerWidth - b.offsetWidth - 8) + 'px';
  }
  function psHoverEnd() {
    clearTimeout(psHideTimer);
    psHideTimer = setTimeout(() => {
      const b = $('#psshow');
      if (b) b.hidden = true;
      psHoverEl = null;
    }, 250);
  }

  // =============================================================================
  // SECTION 10 - SIDEBAR AND ROUTER
  // The router is the 'which page do I show?' logic. It reads the part of the address after # (the hash)
  // and calls the matching view. It runs at start-up and every time the hash changes, i.e. every time you
  // click a link like <a href="#/n/...">. Nothing is ever reloaded from a server.
  //
  // Addresses (also listed at the top of the file):
  //   #/  home   #/n/<path>[::heading]  note   #/edit/<path>   #/src/<path>   #/new[/<folder>]
  //   #/f/<folder>  #/t/<tag>  #/all  #/tags  #/s/<text>  #/missing/<name>  #/tool/<id>
  // =============================================================================

  // Draws the sidebar: Navigation links, one line per folder (indented by depth, with the note count),
  // and the Tools section. Links with data-act="..." are actions (open, reload, theme) handled by the
  // click handler in section 12. TO ADD A SIDEBAR LINK: add an <a href="#/..."> inside the template string.
  function renderSide() {
    // Example campaign: a short notice at the top of the sidebar.
    const demo = S.demo
      ? `<div class="demo-note"><b>Example campaign</b> (read-only). <a href="${esc(DOWNLOAD_URL)}" target="_blank" rel="noopener">Download it</a> or <a href="#" data-act="open">open your own folder</a>.</div>`
      : '';
    const folders = [...S.folders.values()]
      .filter((f) => f.path !== '')
      .sort((a, b) => a.path.localeCompare(b.path));
    $('#side').innerHTML =
      `${demo}<h4>Navigation</h4><a href="#/">Main page</a><a href="#/all">All pages</a><a href="#/tags">All tags</a>
  ${folders.length ? '<h4>Folders</h4>' + folders.map((f) => `<a href="#/f/${enc(f.path)}" style="padding-left:${(f.depth - 1) * 12}px">${esc(f.name)} <span class="cnt">${f.notes.length}</span></a>`).join('') : ''}
  <h4>Tools</h4><a href="#/new">New note</a>${TOOLS.map((t) => `<a href="#/tool/${t.id}">${esc(t.name)}</a>`).join('')}<a href="#" data-act="open">Open folder&hellip;</a><a href="#" data-act="reload">Reload</a><a href="#" data-act="theme">Dark / light mode</a>`;
  }

  // Called at start-up and on every hashchange.
  // Step by step: read the hash -> split it into view (first part) and arg (the rest, decoded) ->
  // tools first -> welcome screen if nothing is loaded -> note pages (n / edit / src) -> all other views.
  function route() {
    // A page change always closes the image viewer first.
    closeLightbox();
    $('#side').classList.remove('open');
    const raw = location.hash.slice(1) || '/';
    const seg = raw.split('/');
    const view = seg[1] || '';
    let arg = '';
    try {
      arg = decodeURIComponent(seg.slice(2).join('/'));
    } catch (e) {
      arg = seg.slice(2).join('/');
    }
    // Tools do not need any notes, so they are handled before the 'nothing loaded' check.
    if (view === 'tool') {
      S.view = 'tool';
      S.path = '';
      document.title = 'Tools - ' + SITE_NAME;
      window.scrollTo(0, 0);
      viewTool(arg);
      return;
    }
    // No folder opened yet: always show the welcome screen.
    if (!S.notes.length) {
      viewWelcome();
      return;
    }
    // Note pages. arg looks like 'ise%2Fmy-note.md::heading-id' (path, then optional heading id after ::).
    if (view === 'n' || view === 'src' || view === 'edit') {
      const [p, slug] = arg.split('::');
      const note = getNote(p);
      if (!note) {
        viewMissing(p);
        return;
      }
      // Shortcut: clicking a Contents link on the page already shown only scrolls; it does not redraw the
      // whole page.
      if (view === 'n' && S.view === 'n' && S.path === note.path && slug) {
        const el = document.getElementById(slug);
        if (el) {
          el.scrollIntoView();
          return;
        }
      }
      if (view === 'n') viewNote(note, slug);
      else if (view === 'edit') viewEdit(note);
      else viewSource(note);
      S.view = view;
      S.path = note.path;
      if (slug) {
        const el = document.getElementById(slug);
        if (el) el.scrollIntoView();
        else window.scrollTo(0, 0);
      } else window.scrollTo(0, 0);
      document.title = note.title + ' - ' + SITE_NAME;
      return;
    }
    S.view = view;
    S.path = '';
    document.title = SITE_NAME;
    window.scrollTo(0, 0);
    // All the other views. TO ADD A NEW PAGE: write viewXxx() (see viewMissing for a tiny example) and add
    // a branch here.
    if (view === '') viewHome();
    else if (view === 'new') viewNew(arg);
    else if (view === 'all') viewList('All pages', S.notes.length + ' pages', S.notes);
    else if (view === 'f') {
      const f = S.folders.get(arg);
      viewList(
        'Folder: ' + (arg || '(root)'),
        (f ? f.notes.length : 0) +
          ' pages in this folder &middot; <a href="#/new/' +
          enc(arg) +
          '">New note here</a>',
        f ? f.notes : [],
      );
    } else if (view === 't') {
      const l = S.tags.get(arg) || [];
      viewList('Tag: ' + arg, l.length + ' pages with this tag', l);
    } else if (view === 'tags') {
      const t = [...S.tags.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      setContent(
        `<h1 class="title">All tags</h1><div class="sub">${t.length} tags</div><div class="body tagcloud">${t.map(([k, l]) => `<a class="tag" href="#/t/${enc(k)}">#${esc(k)} ${l.length}</a>`).join('')}</div>`,
      );
    } else if (view === 's') viewSearch(arg);
    else if (view === 'missing') viewMissing(arg);
    else viewHome();
  }

  // =============================================================================
  // SECTION 11 - LOADING FILES FROM YOUR DISK
  // A web page cannot read your disk on its own; you must choose the folder. Two ways:
  //   - Chrome/Edge: showDirectoryPicker()  -> gives a folder handle (can also write and Reload later)
  //   - other browsers: a hidden <input type="file" webkitdirectory>  -> read-only list of files
  // Both paths produce the same list of 'entries' { path, getFile(), handle } handled by loadEntries().
  // =============================================================================
  // File types: images we can show (kept as blob URLs) and Markdown notes.
  const IMG = /\.(png|jpe?g|gif|svg|webp|bmp)$/i,
    MD = /\.(md|markdown)$/i;

  // Reads all entries: .md files become raw notes (text + last modified time + handle), images become
  // blob URLs (stored by full path in S.assets and by file name in S.assetsByName), everything else is ignored. Then
  // buildIndex(), redraw the sidebar and go to the home page.
  // entries come from your disk ({ path, getFile(), handle }) or from the web ({ path, url }: the example
  // campaign). Web images are used from their address; web notes are downloaded 16 at a time.
  async function loadEntries(entries, rootName, demo) {
    S.demo = !!demo;
    // Free the memory of images from a previous load.
    S.assets.forEach((u) => {
      try {
        if (u.startsWith('blob:')) URL.revokeObjectURL(u);
      } catch (e) {}
    });
    S.assets.clear();
    S.assetsByName.clear();
    const raws = [];
    const addImage = (path, url) => {
      const key = path.toLowerCase();
      S.assets.set(key, url);
      const base = key.split('/').pop();
      if (!S.assetsByName.has(base)) S.assetsByName.set(base, []);
      S.assetsByName.get(base).push(key);
    };
    const web = entries.filter((e) => e.url && MD.test(e.path));
    for (const e of entries) {
      if (e.url) {
        if (IMG.test(e.path)) addImage(e.path, e.url);
      } else if (MD.test(e.path)) {
        const f = await e.getFile();
        raws.push({ path: e.path, text: await f.text(), mtime: f.lastModified, handle: e.handle });
      } else if (IMG.test(e.path)) addImage(e.path, URL.createObjectURL(await e.getFile()));
    }
    let done = 0,
      next = 0;
    const worker = async () => {
      while (next < web.length) {
        const e = web[next++];
        try {
          const r = await fetch(e.url);
          if (r.ok) raws.push({ path: e.path, text: await r.text(), mtime: Date.parse(r.headers.get('Last-Modified') || '') || 0, handle: null });
        } catch (x) {}
        const p = $('#dprog');
        if (p) p.textContent = ++done + ' of ' + web.length + ' notes';
      }
    };
    await Promise.all(Array.from({ length: 16 }, worker));
    // Remember the folder name, build all the lookup tables, and show the folder's name in the header.
    S.root = rootName;
    buildIndex(raws);
    $('#siteName').textContent = rootName || SITE_NAME;
    renderSide();
    if (!raws.length)
      setContent(
        '<h1 class="title">No Markdown files found</h1><div class="body"><p>This folder has no <code>.md</code> files. Pick the folder that contains your notes.</p></div>',
      );
    else {
      location.hash = '#/';
      route();
    }
  }

  // Goes through a folder and all its sub-folders (Chrome/Edge). Anything whose name starts with a dot
  // (.obsidian, .git...) and node_modules is skipped. TO SKIP MORE FOLDERS: extend the condition on the 'if' line.
  async function walk(dir, prefix, out) {
    for await (const [name, h] of dir.entries()) {
      if (name[0] === '.' || name === 'node_modules') continue;
      if (h.kind === 'directory') await walk(h, prefix + name + '/', out);
      else out.push({ path: prefix + name, getFile: () => h.getFile(), handle: h });
    }
  }
  // Load from a folder handle (Chrome/Edge).
  async function fromHandle(h) {
    const out = [];
    await walk(h, '', out);
    await loadEntries(out, h.name);
  }
  // Load from the fallback file input (other browsers). webkitRelativePath is like
  // 'MyNotes/ise/note.md'; the first part is the folder name. Same skip rules as walk().
  function fromInput(files) {
    S.handle = null;
    const out = [];
    let root = '';
    for (const f of files) {
      const p = (f.webkitRelativePath || f.name).split('/');
      if (f.webkitRelativePath) {
        root = p.shift();
      }
      if (p.some((s) => s[0] === '.' || s === 'node_modules')) continue;
      out.push({ path: p.join('/'), getFile: () => Promise.resolve(f) });
    }
    return loadEntries(out, root);
  }
  // 'Open folder' action: use showDirectoryPicker when the browser has it (read mode; write permission
  // is requested at the first save); otherwise click the hidden file input.
  async function openFolder() {
    if (window.showDirectoryPicker) {
      try {
        const h = await window.showDirectoryPicker({ mode: 'read' });
        S.handle = h;
        await fromHandle(h);
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    $('#picker').click();
  }
  // 'Try the example campaign': reads manifest.json (the list of files) at DEMO_URL, then loads those files.
  // Safety: only plain relative paths inside DEMO_URL are accepted (no '..', no other site), and only
  // notes and images are read. The example is read-only (see S.demo).
  async function loadDemo() {
    setContent('<h1 class="title">Opening the example campaign</h1><div class="sub" id="dprog">Reading the list of files...</div>');
    let list;
    try {
      const r = await fetch(DEMO_URL + 'manifest.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('error ' + r.status);
      list = (await r.json()).files;
      if (!Array.isArray(list)) throw new Error('manifest.json has no file list');
    } catch (e) {
      return setContent(`<h1 class="title">The example campaign could not be opened</h1><div class="body"><p>${esc(e.message)}. Check your internet connection and try again, or <a href="${esc(DOWNLOAD_URL)}" target="_blank" rel="noopener">download it</a> and open the folder.</p><p><button type="button" class="btn" data-act="demo">Try again</button></p></div>`);
    }
    const entries = [];
    for (const p of list.slice(0, 5000)) {
      if (typeof p !== 'string' || !(MD.test(p) || IMG.test(p))) continue;
      if (/(^|\/)\.{1,2}(\/|$)|^\/|\\|:/.test(p)) continue; // no '..', no absolute path, no scheme
      const url = new URL(p.split('/').map(encodeURIComponent).join('/'), DEMO_URL).href;
      if (url.startsWith(DEMO_URL)) entries.push({ path: p, url });
    }
    S.handle = null;
    await loadEntries(entries, 'Example campaign', true);
  }
  // 'Reload' action: re-read the same folder (to pick up changes made in Obsidian, VS Code...). Falls
  // back to asking for the folder again.
  async function reload() {
    if (S.demo) return loadDemo();
    if (S.handle) {
      try {
        await fromHandle(S.handle);
        return;
      } catch (e) {}
    }
    openFolder();
  }

  // =============================================================================
  // SECTION 12 - EVENTS AND START-UP
  // Everything that reacts to the user (clicks, typing, keys) and the last lines that start the app.
  // =============================================================================

  // IMAGE VIEWER (lightbox): click an image in a note and it opens full screen.
  //   - click the enlarged image: switch between 'fit to screen' and 'real size' (then scroll)
  //   - arrows (left / right keys or the side buttons): previous / next image of the same page
  //   - Esc, the x button, or a click on the dark background: close
  // It works on every image inside a note (also embeds and the editor preview). The overlay (#lb) is created the first
  // time it is needed; its look is in the CSS (search for '#lb').
  // lbImgs = the images of the page, lbIndex = the one being shown.
  let lbImgs = [];
  let lbIndex = 0;

  // 'Fit' size of the enlarged image: scaled to fill 96% of the window width / 90% of its height, keeping the proportions.
  // Small images are also scaled UP (at most 3 times) - that is the 'make it bigger' effect. In 'real size' mode (class
  // full)
  // the sizes are cleared, so the image shows at its own pixel size. Called when the image has loaded, on zoom toggle and
  // on resize.
  function fitLightbox() {
    const lb = $('#lb');
    const img = $('img', lb);
    if (lb.classList.contains('full') || !img.naturalWidth) {
      img.style.width = img.style.height = '';
      return;
    }
    const k = Math.min((innerWidth * 0.96) / img.naturalWidth, (innerHeight * 0.9) / img.naturalHeight, 3);
    img.style.width = Math.round(img.naturalWidth * k) + 'px';
    img.style.height = Math.round(img.naturalHeight * k) + 'px';
  }
  // Shows image number lbIndex: copies its address and alt text, shows a counter like (2/5), resets the
  // zoom.
  function showLightbox() {
    const lb = $('#lb');
    const src = lbImgs[lbIndex];
    const img = $('img', lb);
    lb.classList.remove('full');
    img.style.width = img.style.height = '';
    img.onload = fitLightbox;
    img.src = src.currentSrc || src.src;
    img.alt = src.alt || '';
    if (img.complete && img.naturalWidth) fitLightbox();
    $('.lb-cap', lb).textContent =
      (src.alt || '') + (lbImgs.length > 1 ? '  (' + (lbIndex + 1) + '/' + lbImgs.length + ')' : '');
    lb.scrollTop = 0;
    lb.scrollLeft = 0;
    $('.lb-prev', lb).style.display = $('.lb-next', lb).style.display = lbImgs.length > 1 ? '' : 'none';
  }
  // Opens the viewer for a clicked image. On first use it builds the overlay and its click handler
  // (close / previous / next / zoom).
  function openLightbox(img) {
    let lb = $('#lb');
    if (!lb) {
      lb = document.createElement('div');
      lb.id = 'lb';
      lb.hidden = true;
      lb.innerHTML =
        '<button type="button" class="lb-btn lb-close" aria-label="Close">&times;</button>' +
        '<button type="button" class="lb-btn lb-prev" aria-label="Previous image">&lsaquo;</button>' +
        '<button type="button" class="lb-btn lb-next" aria-label="Next image">&rsaquo;</button>' +
        '<button type="button" class="lb-btn lb-show" title="Show this image on the player screen">Show to players</button>' +
        '<img alt=""><div class="lb-cap"></div>';
      document.body.appendChild(lb);
      lb.addEventListener('click', (e) => {
        const t = e.target;
        if (t.closest('.lb-show')) psShowImage(lbImgs[lbIndex].src, lbImgs[lbIndex].alt || 'an image');
        else if (t === lb || t.closest('.lb-close')) closeLightbox();
        else if (t.closest('.lb-prev')) stepLightbox(-1);
        else if (t.closest('.lb-next')) stepLightbox(1);
        else if (t.tagName === 'IMG') {
          lb.classList.toggle('full');
          fitLightbox();
        }
      });
      window.addEventListener('resize', () => {
        if (!lb.hidden) fitLightbox();
      });
    }
    // The images of the same area (the page or the pin panel).
    lbImgs = [...(img.closest('#pin') || $('#content')).querySelectorAll('.body img, .sb-img img')];
    lbIndex = Math.max(0, lbImgs.indexOf(img));
    showLightbox();
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  // Previous (-1) or next (+1) image; wraps around at the ends.
  function stepLightbox(d) {
    if (lbImgs.length < 2) return;
    lbIndex = (lbIndex + d + lbImgs.length) % lbImgs.length;
    showLightbox();
  }
  // Hides the viewer and gives scrolling back to the page. Also called by route(), so the back button
  // closes it.
  function closeLightbox() {
    // While the image viewer is open it takes the keyboard: Esc closes, left/right arrows change image.
    // Other shortcuts wait.
    const lb = $('#lb');
    if (lb && !lb.hidden) {
      lb.hidden = true;
      document.body.style.overflow = '';
    }
  }
  // Applies 'light' or 'dark' by setting data-theme on <html> (the CSS variables do the rest) and
  // remembers the choice in the browser.
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    try {
      localStorage.setItem('notes-theme', t);
    } catch (e) {}
  }
  // At start-up: the saved theme, or else the light theme (white page, black text). The computer's own
  // dark mode is ignored on purpose: dark is only used when you choose it with 'Dark / light mode'.
  (function () {
    let t = null;
    try {
      t = localStorage.getItem('notes-theme');
    } catch (e) {}
    setTheme(t === 'dark' ? 'dark' : 'light');
  })();

  // ONE click handler for the whole page ('event delegation'): instead of attaching a handler to every button,
  // we listen on the document and look at what was clicked.
  //   - button.copy          copy the text of the code block next to it
  //   - button[data-copy]    copy the text stored in its data-copy attribute (for tools)
  //   - .dice-link           dice written in a note: open the dice terminal and roll
  //   - [data-act]           actions: open, reload, theme, weather (wx-...), dice (dice-...), initiative (init-...)
  //   - anywhere else        closes the search suggestions
  document.addEventListener('click', (e) => {
    // A click outside the weather banner closes its details box.
    if (wxOpen && !e.target.closest('#wx')) wxToggle(false);
    // Same for the dice terminal (a click on a dice link in a note keeps it open).
    if (diceIsOpen && !e.target.closest('#dice, .dice-link')) diceToggle(false);
    // Same for the condition picker of the initiative bar and the player notes list.
    if (!e.target.closest('#ibpick, .ib-plus')) initPickClose();
    if (plOpen && !e.target.closest('#plnotes')) playerToggle(false);
    if (psOpenMenu && !e.target.closest('#pscreen')) psToggleMenu(false);
    // A link to a monster, NPC, merchant, rule... note opens in the pin panel (section 9F).
    // Ctrl / Cmd / Shift + click still opens it as a page.
    const pl = e.target.closest('#content .body a[href^="#/n/"], #pin .body a[href^="#/n/"]');
    if (pl && !e.ctrlKey && !e.metaKey && !e.shiftKey && !pl.closest('.toc')) {
      let p = pl.getAttribute('href').slice(4).split('::')[0];
      try {
        p = decodeURIComponent(p);
      } catch (x) {}
      const n = getNote(p);
      if (n && isPinType(n) && !(S.view === 'n' && n.path === S.path && pl.closest('#content'))) {
        e.preventDefault();
        pinNote(n);
        return;
      }
    }
    // The title of a player callout: given / not given (section 9E). Handled here so a click on the title
    // of a folded callout does not also open or close it (the rest of the title line still does). Links
    // and dice inside the title keep working.
    const pt = e.target.closest('.callout .pl-t');
    if (pt && !e.target.closest('a')) {
      e.preventDefault();
      const k = pt.closest('.callout').dataset.pkey;
      playerSet(k, !playerIsGiven(k));
      return;
    }
    // A dice link in a note: open the dice terminal and roll it.
    const dl = e.target.closest('.dice-link');
    if (dl) {
      e.preventDefault();
      diceToggle(true);
      diceRun(dl.dataset.roll);
      return;
    }
    const b = e.target.closest('button.copy,button[data-copy]');
    if (b) {
      const txt =
        b.dataset.copy != null ? b.dataset.copy : b.closest('.code').querySelector('pre').textContent;
      b.dataset.label = b.dataset.label || b.textContent;
      const done = () => {
        b.textContent = 'Copied';
        setTimeout(() => (b.textContent = b.dataset.label), 1200);
      };
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          done();
        } catch (x) {}
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
      return;
    }
    // Click on an image inside a note: open the image viewer instead of doing nothing.
    const zoom = e.target.closest('#content .body img, #pin .body img, #pin .sb-img img');
    if (zoom) {
      e.preventDefault();
      openLightbox(zoom);
      return;
    }
    // Actions: TO ADD ONE, put data-act="myaction" on a link/button and add a branch below.
    const a = e.target.closest('[data-act]');
    if (a) {
      e.preventDefault();
      const act = a.dataset.act;
      if (act === 'open') openFolder();
      else if (act === 'demo') loadDemo();
      else if (act === 'reload') reload();
      else if (act === 'theme')
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      // Weather banner (section 9B): next day, reroll today, open/close the details.
      else if (act === 'wx-next') {
        wxRoll(true);
        renderWeather();
      } else if (act === 'wx-reroll') {
        wxRoll(false);
        renderWeather();
      } else if (act === 'wx-menu') {
        if (diceIsOpen) diceToggle(false);
        if (plOpen) playerToggle(false);
        wxToggle();
      }
      // Dice roller (section 9C): open/close the terminal, roll a die button.
      else if (act === 'dice-menu') diceToggle();
      else if (act === 'dice-roll') {
        diceRun(a.dataset.roll);
        $('#dicein').focus();
      }
      // Initiative tracker (section 9D).
      else if (act === 'init-toggle') initToggleBar();
      else if (act === 'init-next') initStep(1);
      else if (act === 'init-prev') initStep(-1);
      else if (act === 'init-add') initAdd();
      else if (act === 'init-kind') initSwitchKind();
      else if (act === 'init-del') initDel(a.dataset.id);
      else if (act === 'init-undo') initUndoDel();
      // Player screen (section 9G).
      else if (act === 'ps-menu') {
        if (wxOpen) wxToggle(false);
        if (diceIsOpen) diceToggle(false);
        if (plOpen) playerToggle(false);
        psToggleMenu();
      } else if (act === 'ps-open') psOpen();
      else if (act === 'ps-black') psBlack();
      else if (act === 'ps-close') psClose();
      else if (act === 'ps-auto') {
        PS.auto = !PS.auto;
        try {
          localStorage.setItem(PS_KEY, JSON.stringify({ auto: PS.auto }));
        } catch (x) {}
        renderPsBtn();
      }
      // Pin panel (section 9F).
      else if (act === 'pin-this') pinNote(getNote(S.path));
      else if (act === 'pin-show') pinNote(getNote(a.dataset.path));
      else if (act === 'pin-close') unpin(a.dataset.path);
      // Player notes (section 9E).
      else if (act === 'pl-menu') {
        if (wxOpen) wxToggle(false);
        if (diceIsOpen) diceToggle(false);
        if (psOpenMenu) psToggleMenu(false);
        playerToggle();
      } else if (act === 'pl-give') playerSet(a.dataset.pkey, !playerIsGiven(a.dataset.pkey));
      else if (act === 'pl-go') playerGo(a.dataset.pkey);
      else if (act === 'pl-reset') playerReset();
      else if (act === 'init-end') initEnd();
      else if (act === 'init-cond') initPickOpen(a.dataset.id, a);
      else if (act === 'init-cond-add') initCondAdd(a.dataset.cond ? a : null);
      else if (act === 'init-cond-del') initCondDel(a.dataset.id, +a.dataset.i);
      return;
    }
    if (!e.target.closest('.search')) $('#sugg').style.display = 'none';
  });
  // Pin panel: hit points typed in the 'In combat' box (Enter or leaving the box), the box selects its
  // number when clicked (so typing -7 replaces it), and the left edge resizes the panel.
  $('#pin').addEventListener('change', (e) => {
    if (e.target.classList.contains('pin-hp-in')) pinHpEdited(e.target);
  });
  $('#pin').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.classList.contains('pin-hp-in')) e.target.blur();
  });
  $('#pin').addEventListener('focusin', (e) => {
    if (e.target.classList.contains('pin-hp-in')) e.target.select();
  });
  $('#pin').addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('pin-grip')) pinResizeStart(e);
  });
  // Player screen (section 9G): pointing at an image or a player note shows 'Show to players'.
  const PS_HOVER = '#content .body img, #pin .body img, #pin .sb-img img, #content .callout.co-player, #pin .callout.co-player';
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest(PS_HOVER);
    if (el) psHover(el.tagName === 'IMG' ? el : el.closest('.callout'));
  });
  document.addEventListener('mouseout', (e) => {
    const el = e.target.closest(PS_HOVER);
    if (el && !(e.relatedTarget && (el.contains(e.relatedTarget) || e.relatedTarget.closest('#psshow')))) psHoverEnd();
  });
  window.addEventListener('scroll', () => {
    const b = $('#psshow');
    if (b) b.hidden = true;
  }, true);
  // The monitor button shows whether the screen is still open (the players' window can be closed there).
  setInterval(() => {
    const live = psIsOpen();
    const b = $('.ps-btn');
    if (b && b.classList.contains('live') !== live) renderPsBtn();
  }, 2000);
  // Initiative bar: changing a number in the track, and Enter in the Add form.
  $('#initbar').addEventListener('change', (e) => {
    if (e.target.classList.contains('ib-n')) initEdited(e.target);
  });
  $('#initbar').addEventListener('keydown', (e) => {
    // Name suggestions: arrows to move, Enter or Tab to choose, Escape to close.
    if (e.target.id === 'ibname' && initSugg.length) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        initSuggI = (initSuggI + (e.key === 'ArrowDown' ? 1 : -1) + initSugg.length) % initSugg.length;
        return initSuggDraw();
      }
      // The name typed is already exactly the highlighted one: Enter adds it right away.
      const typed = e.target.value.replace(/\s*[x\u00D7]\d{0,2}$/i, '').trim().toLowerCase();
      if (e.key === 'Enter' && initSuggI >= 0 && initSugg[initSuggI].name.toLowerCase() === typed) initSuggClose();
      else if ((e.key === 'Enter' || e.key === 'Tab') && initSuggI >= 0) {
        e.preventDefault();
        return initSuggPick(initSuggI);
      }
      if (e.key === 'Escape') {
        e.stopPropagation();
        return initSuggClose();
      }
    }
    if (e.key !== 'Enter') return;
    if (e.target.closest('.ib-add input')) initAdd();
    else if (e.target.closest('.ib-pick-row input')) initCondAdd(null);
    else if (e.target.classList.contains('ib-n')) e.target.blur();
  });
  // Name suggestions: typing in the Name box, clicking a suggestion (mousedown keeps the cursor in the
  // box), and leaving the box closes them.
  $('#initbar').addEventListener('input', (e) => {
    if (e.target.id === 'ibname') initSuggest();
  });
  $('#initbar').addEventListener('mousedown', (e) => {
    const sg = e.target.closest('.ib-sg');
    if (sg) {
      e.preventDefault();
      initSuggPick(+sg.dataset.i);
    }
  });
  $('#initbar').addEventListener('focusout', (e) => {
    if (e.target.id === 'ibname') setTimeout(initSuggClose, 150);
  });
  // Weather details box: changing the climate or the season.
  $('#wx').addEventListener('change', (e) => {
    if (e.target.closest('#wxclim,#wxseason')) wxSettingsChanged();
  });
  // The fallback folder picker: when files are chosen, load them.
  $('#picker').addEventListener('change', (e) => {
    if (e.target.files.length) fromInput(e.target.files);
    e.target.value = '';
  });
  // Menu button (small screens): opens/closes the sidebar drawer.
  $('#menuBtn').addEventListener('click', () => $('#side').classList.toggle('open'));
  // THE ROUTER TRIGGER: every time the address after # changes, draw the matching page.
  window.addEventListener('hashchange', route);
  // If there are unsaved drafts, the browser asks for confirmation before closing or reloading the tab.
  window.addEventListener('beforeunload', (e) => {
    if (S.drafts.size) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  // SEARCH BOX in the header. While typing: up to 8 title suggestions. Enter: full search page. Escape:
  // close the suggestions.
  const q = $('#q');
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    const box = $('#sugg');
    if (!v || !S.notes.length) {
      box.style.display = 'none';
      return;
    }
    const m = S.notes
      .filter(
        (n) =>
          n.title.toLowerCase().includes(v) ||
          n.name.toLowerCase().includes(v) ||
          n.aliases.some((a) => a.toLowerCase().includes(v)),
      )
      .sort(
        (a, b) =>
          b.title.toLowerCase().startsWith(v) - a.title.toLowerCase().startsWith(v) ||
          a.title.localeCompare(b.title),
      )
      .slice(0, 8);
    box.innerHTML = m
      .map((n) => `<a href="${noteHref(n)}">${esc(n.title)}<small>${esc(n.folder)}</small></a>`)
      .join('');
    box.style.display = m.length ? 'block' : 'none';
  });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && q.value.trim()) {
      $('#sugg').style.display = 'none';
      location.hash = '#/s/' + enc(q.value.trim());
    }
    if (e.key === 'Escape') $('#sugg').style.display = 'none';
  });
  // Keyboard shortcuts: Ctrl+S saves in the editor; the / key jumps to the search box.
  document.addEventListener('keydown', (e) => {
    const lb = $('#lb');
    if (lb && !lb.hidden) {
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') stepLightbox(-1);
      else if (e.key === 'ArrowRight') stepLightbox(1);
      return;
    }
    if (e.key === 'Escape' && $('#ibpick')) {
      initPickClose();
      return;
    }
    if (e.key === 'Escape' && plOpen) {
      playerToggle(false);
      return;
    }
    if (e.key === 'Escape' && psOpenMenu) {
      psToggleMenu(false);
      return;
    }
    if (e.key === 'Escape' && (wxOpen || diceIsOpen)) {
      if (wxOpen) wxToggle(false);
      if (diceIsOpen) diceToggle(false);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.view === 'edit') {
      e.preventDefault();
      const b = $('#saveBtn');
      if (b) b.click();
      return;
    }
    if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) {
      e.preventDefault();
      q.focus();
    }
  });
  // START-UP: show the site name, load and draw the weather, draw the sidebar, and show the page for the current address.
  $('#siteName').textContent = SITE_NAME;
  wxLoad();
  renderWeather();
  diceInit();
  initLoad();
  renderInit();
  renderPsBtn();
  renderSide();
  route();
  // Debug hook: makes these internals reachable from the browser console (F12), e.g.  __wiki.S.notes  or
  // __wiki.S.byName.get('goblin'). Safe to delete.
  window.__wiki = {
    S,
    blocks,
    inline,
    parseFM,
    route,
    fromInput,
    saveNote,
    createNote,
    makeNote,
    // Dice: __wiki.dice.roll('2d6+3') rolls and logs; __wiki.dice.parse('d20+5 adv') shows how it is read.
    // Player screen: __wiki.screen.state
    screen: {
      get state() {
        return PS;
      },
    },
    // Pin panel: __wiki.pin.state
    pin: {
      get state() {
        return PIN;
      },
    },
    // Player notes: __wiki.player.given (ticked keys)
    player: {
      get given() {
        return plGiven;
      },
    },
    // Initiative: __wiki.initiative.state, __wiki.initiative.next()
    initiative: {
      get state() {
        return INIT;
      },
      next: () => (initStep(1), INIT),
    },
    dice: { roll: (x) => (diceRun(x), $('#dicelog').lastElementChild.textContent), parse: parseCommand },
    // Weather: __wiki.weather.state, __wiki.weather.next(), __wiki.weather.reroll()
    weather: {
      get state() {
        return WX;
      },
      next: () => (wxRoll(true), renderWeather(), WX),
      reroll: () => (wxRoll(false), renderWeather(), WX),
    },
  };
})();
</script>
</body>
</html>
