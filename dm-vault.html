<!-- SECURITY POLICY: this page may only load data from itself and from the example campaign on GitHub
     (DEMO_URL in section 1 of the script). Nothing else can be contacted, even by a modified note.
     IF YOU MOVE THE EXAMPLE CAMPAIGN, change https://sasmotish.github.io below AND DEMO_URL. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src 'self' blob: data: https://sasmotish.github.io; connect-src 'self' blob: https://sasmotish.github.io; base-uri 'none'; form-action 'none'">
<title>DM Vault</title>
<!--
================================================================================
  MY NOTES WIKI
  A single-file, Wikipedia-style reader and editor for your Markdown notes.
================================================================================

1. WHAT THIS FILE IS
   One HTML file. No server, no install, no internet. Open it in a browser, pick the
   folder that holds your .md notes (an Obsidian vault works), and browse them like a
   small Wikipedia: sidebar, search, an infobox built from each note's properties,
   table of contents, colored callouts, backlinks ("What links here"), tags and folders.
   You can also edit notes and create new ones. Nothing is uploaded anywhere.
   Online, 'Try the example campaign' opens a read-only example from GitHub (DEMO_URL in section 1).
   Extras: dark mode, copy buttons on code, click-to-enlarge images (maps, handouts), and a
   Tools section ready for DM tools (dice, weather, loot, NPCs... coming next).

2. WHERE THINGS ARE IN THIS FILE (use Ctrl+F on the banner titles)
   A) <style> ... </style>   all the CSS: colors, fonts, layout.
   B) <body>                 an almost empty page: header, sidebar (#side), content area (#content).
   C) <script> ... </script> all the logic, in 12 numbered sections:
        1  Settings and global state          7  Editing, saving, new notes
        2  Text helpers                       8  Search
        3  Indexing (notes -> lookup tables)  9  Tools (add yours here)
                                              9B Weather banner (seasons, climates)
                                              9C Dice roller (header + dice in notes)
                                              9D Initiative bar (D&D)
                                              9E Player notes ( > [!player] )
                                              9F Monsters and pin panel
                                              9G Player screen (second monitor)
        4  Markdown: inline (bold, links...) 10  Sidebar and router (which page to show)
        5  Markdown: blocks (lists, tables)  11  Loading files from your disk
        6  Views (one function per page)     12  Events and start-up

3. HOW IT WORKS, IN 6 STEPS
   1. You click "Open my notes folder". A web page cannot read your disk by itself, so the
      folder picker is the only way in.                          -> openFolder()
   2. Every .md file is read as text; images are kept as temporary blob: URLs.
                                                                 -> loadEntries()
   3. Each file becomes a "note" object (title, tags, properties, text).
                                                                 -> makeNote()
   4. All notes are indexed: lookup tables for links, backlinks, tags and folders.
                                                                 -> buildIndex()
   5. The address after # in the browser bar (for example #/n/ise%2Fmy-note.md) says which
      page to show. Clicking a link just changes that address.   -> route()
   6. A view function turns the Markdown into HTML with our own small Markdown parser and
      puts it in #content.                                       -> viewNote(), blocks(), inline()

4. THE DATA
   S     the global state object (defined in section 1). Try  __wiki.S  in the console.
   note  one Markdown file, built by makeNote(). Its fields are listed above makeNote()
         (path, name, folder, fm, body, content, raw, title, aliases, tags, mtime, handle, lc).

5. PAGE ADDRESSES (what follows # in the URL) - handled by route()
   #/                         home
   #/n/<path>                 read a note   (<path> is URL-encoded, e.g. ise%2Fmy-note.md)
   #/n/<path>::<heading-id>   read a note and jump to one of its headings
   #/edit/<path>              editor (Markdown on the left, live preview on the right)
   #/src/<path>               raw Markdown of the note
   #/new  or  #/new/<folder>  new note form
   #/f/<folder>               list of the notes in a folder
   #/t/<tag>                  list of the notes with a tag
   #/all   #/tags             all pages / all tags
   #/s/<text>                 search results
   #/missing/<name>           "this note does not exist yet" (target of red links)
   #/tool/<id>                a tool, e.g. #/tool/dice  (#/tool alone lists the tools)

6. HOW TO ... (recipes, easiest first)
   Rename the wiki             SITE_NAME in section 1. Note: after you open a folder the header
                               shows the folder's name; see the comment on SITE_NAME.
   Change the tagline          the <small> text inside the header, in the body below.
   Change colors or fonts      the variables at the top of the CSS (:root for the light theme,
                               [data-theme='dark'] for the dark theme).
   Change the page width       .layout (max-width) and #side (width) in the CSS.
   Add a sidebar link          renderSide() in section 10: add an <a href="#/...">.
   Add a callout type          the CO table in section 5:  name: [color, icon].
   Add a callout color         add a .co-<name> rule in the CSS (copy .co-teal) and use it in CO.
   Hide a property (infobox)   the list ['tags', 'aliases', ...] inside renderBody().
   Skip more folders           the name[0] === '.' tests in walk() and fromInput() (section 11).
   Add a climate / tune odds   CLIMATES in section 9B. Weather names and effects: wxInfo().
   Change the die buttons      DICE_PAD in section 9C. Roll syntax: type  help  in the dice box.
   Player screen               section 9G (look of the players' window: psPage()).
   Monster stat blocks         statBlockHtml() in section 9F. Types that open in the pin: PIN_TYPES (9F).
   Player notes                section 9E ( > [!player] callouts, the scroll icon in the header).
   Initiative bar              section 9D. Turn order: initOrder(). Look: .init-tog and .ib-* in the CSS.
   Change the home page        viewHome(). A note named "Main Page", "Home" or "index" replaces it.
   Change search ranking       the  sc += ...  lines in search() (section 8).
   Add a tool                  read the comment at the top of section 9 (5 small steps).
   Add a new page (route)      write a viewXxx() function (viewMissing() is a tiny example), then add
                               a branch for it in route() (section 10).
   Add Markdown syntax         inline: the .replace(...) chain at the end of inline() (section 4);
                               block level: add an  if (...) { ...; continue; }  inside blocks().

7. DEBUGGING
   - Press F12 and open the Console tab: errors show the function name and the line number.
   - After you edit this file, reload the page with Ctrl+F5 (or Ctrl+Shift+R).
   - The script is wrapped in a function, so its variables are private. Only window.__wiki
     (last lines of the script) is reachable from the console, e.g.
        __wiki.S.notes                        all loaded notes
        __wiki.S.byName.get('goblin')         one note, looked up by its file name
   - A blank page after an edit is almost always a typo: a missing quote, backtick, bracket or
     comma. The Console error tells you where to look.
   - Keep a backup copy of the file before you experiment.

8. THINGS TO REMEMBER WHEN EDITING
   - The HTML of every page is written inside JavaScript template strings: text between
     backticks with ${...} holes, where ${...} inserts a value.
   - Always wrap text that comes from your notes in esc(...) before putting it in HTML.
   - The Markdown parser is our own and small, not a complete CommonMark implementation.
     Not supported: footnotes, underlined (setext) headings, Mermaid diagrams (shown as code),
     Dataview queries, block references.
   - Saving to disk works in Chrome and Edge only. In other browsers Save downloads the file.
   - Images: every image file in the opened folder (png, jpg, gif, svg, webp, bmp) is available to notes.
     They are found through ![](path), ![[name.png]] or <img src="..."> and looked up next to the note
     first, then by file name (see findAsset()). Folders whose name starts with a dot are skipped, and
     formats browsers cannot display (emf, wmf, tiff) will not show.
================================================================================
-->
<style>
/* ============================================================================
   STYLES  -  how this stylesheet is organised (search for the numbered banners)
     1. Theme colors (CSS variables)      <- change the look of the whole wiki here
     2. Base, header, sidebar, layout
     3. Article text (.body)              <- how the content of a note is drawn
     4. Note parts: code blocks, infobox, contents box, callouts, embeds, footer boxes
     5. Home page, lists, search results, tags
     6. Editor and forms
     7. Small screens (media queries)
   Colors are never written inside the rules: they use var(--name). To recolor the
   wiki, edit the variables in :root (light theme) and [data-theme='dark'] (dark).
   ============================================================================ */


/* ==========================================================================
   1. THEME COLORS - light theme (default)
     --bg      page background (the grey area around the white article)
     --paper   background of the article, the header and popups
     --text    main text color          --muted   secondary (grey) text
     --border  lines and borders        --soft    light grey fill (table headers, code labels)
     --faint   very light fill (infobox, boxes, quotes)
     --link    link color               --red     missing-note links and error messages
     --infoh   title bar of the infobox and of the home page boxes (light blue)
     --code    background of code blocks and of the editor
     --hl      color of ==highlighted== text
     --rubric  accent color (black in light, gold in dark): site name, sidebar headings, drop caps, ornaments
     --display / --serif / --mono   the three font stacks
   ========================================================================== */
:root {
  /* Fonts (embedded in the <style id="fonts"> block at the end of <head>, so they work offline) */
  --display: 'IM Fell English', 'Palatino Linotype', Palatino, Georgia, serif; /* titles, headings */
  --serif: Alegreya, 'Palatino Linotype', Palatino, Georgia, serif; /* body text and interface */
  --mono: ui-monospace, Consolas, 'Cascadia Mono', Menlo, monospace; /* code */
  /* Light theme ("paper"): near-white page and banner, neutral greys, black text and accents */
  --bg: #e8e8e8;
  --paper: #fdfdfd;
  --text: #000;
  --muted: #5c5c5c;
  --border: #c6c6c6;
  --soft: #eeeeee;
  --faint: #f5f5f5;
  --link: #2f5575;
  --red: #a0281c;
  --rubric: #000;
  --infoh: #ececec;
  --code: #f4f4f4;
  --hl: #dbe4ee;
}
/* Dark theme ("charcoal"): same variable names, different values. It is switched on by the
   "Dark / light mode" sidebar link, which sets data-theme="dark" on the <html> element. */
[data-theme='dark'] {
  --bg: #111213;
  --paper: #1a1b1d;
  --text: #dcdcd6;
  --muted: #8f908c;
  --border: #35373a;
  --soft: #232427;
  --faint: #1e1f22;
  --link: #a7bccd;
  --red: #d27461;
  --rubric: #c7a258;
  --infoh: #26282b;
  --code: #141517;
  --hl: #4a4322;
}

/* ==========================================================================
   2. BASE - global rules (box-sizing makes width include padding and borders)
   ========================================================================== */
* {
  box-sizing: border-box;
}
/* scroll-padding-top keeps a heading visible under the sticky header when you jump to it */
html {
  scroll-padding-top: 4.2rem;
  scrollbar-color: var(--border) var(--bg);
}
::selection {
  background: var(--hl);
}
/* Full-height numbers everywhere (Alegreya's default ones are small, old-style). The 'font' shorthand
   used on buttons and inputs resets this, hence !important. */
* {
  font-variant-numeric: lining-nums !important;
}
/* Default font, size and colors for the whole page */
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16.5px/1.6 var(--serif);
  /* Full-height numbers (Alegreya's default ones are small, old-style): easier to read stats like AC 15 */
  font-variant-numeric: lining-nums;
}
a {
  color: var(--link);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
a.new {
  color: var(--red);
  text-decoration: underline dotted;
}
/* HEADER (the bar at the top): sticky = stays visible while you scroll.
   Contains the logo/site name, the search box and, on small screens, the menu button. */
#top {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 3.4rem;
  padding: 0 16px;
  background: var(--paper);
  border-bottom: 3px double var(--border);
}
/* Site name in the header (serif font, like Wikipedia). The small tagline sits under it. */
.logo {
  font: 1.5rem/1 var(--display);
  color: var(--rubric);
  white-space: nowrap;
}
.logo small {
  display: block;
  font: italic 12px/1 var(--serif);
  color: var(--muted);
  margin-top: 3px;
}
.logo:hover {
  text-decoration: none;
}
/* Search box wrapper. position: relative lets the suggestion dropdown (#sugg) sit right under the input. */
.search {
  position: relative;
  flex: 1;
  max-width: 560px;
  margin-left: auto;
}
.search input {
  width: 100%;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--faint);
  color: var(--text);
  font: inherit;
}
/* Live search suggestions dropdown. Hidden by default; the script shows it while you type (display: block). */
#sugg {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  background: var(--paper);
  border: 1px solid var(--border);
  border-top: 0;
  display: none;
  z-index: 30;
}
#sugg a {
  display: block;
  padding: 6px 12px;
  color: var(--text);
}
#sugg a:hover {
  background: var(--soft);
  text-decoration: none;
}
#sugg small {
  color: var(--muted);
  margin-left: 8px;
}
/* BUTTONS: every <button> and every .btn link share this look. .btn.primary (further down) is the blue one. */
button,
.btn {
  font: 13.5px/1.5 var(--serif);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--faint);
  color: var(--text);
  border-radius: 2px;
  padding: 3px 8px;
}
button:hover {
  background: var(--soft);
}
/* The hamburger button is hidden on wide screens; the media query at the bottom shows it on phones. */
#menuBtn {
  display: none;
}
/* LAYOUT: sidebar on the left + content on the right.
   Change max-width to make the whole page narrower or wider. */
.layout {
  display: flex;
  align-items: flex-start;
  max-width: 1500px;
  margin: 0 auto;
}
/* SIDEBAR (#side): fixed width 220px, stays in place while the article scrolls. Its content comes from renderSide(). */
#side {
  width: 220px;
  flex: none;
  padding: 18px 12px 30px 16px;
  font-size: 15px;
  position: sticky;
  top: 3.4rem;
  max-height: calc(100vh - 3.4rem);
  overflow: auto;
}
#side h4 {
  margin: 18px 0 4px;
  font: 1.1rem/1.2 var(--display);
  color: var(--rubric);
  border-bottom: 1px solid var(--border);
  padding-bottom: 3px;
}
#side a {
  display: block;
  padding: 2px 0;
  line-height: 1.4;
}
#side .cnt {
  color: var(--muted);
  font-size: 12px;
}
/* Area that holds the current page. Every view writes a .paper block into it (see setContent). */
#content {
  flex: 1;
  min-width: 0;
  padding: 16px 16px 40px 0;
}
/* The white 'sheet' with a border that contains one page. */
.paper {
  background: var(--paper);
  border: 1px solid var(--border);
  padding: 8px 28px 28px;
  min-height: 70vh;
}
/* Note / Edit / Source tabs at the top of a note. The active tab has the class .on. */
.tabs {
  display: flex;
  gap: 2px;
  margin: 0 -28px;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  font-size: 15px;
}
.tabs a {
  padding: 8px 14px;
  color: var(--link);
  border: 1px solid transparent;
  border-bottom: 0;
  margin-bottom: -1px;
}
.tabs a.on {
  background: var(--paper);
  border-color: var(--border);
  color: var(--text);
}

/* ==========================================================================
   3. ARTICLE TEXT
   Page title (the note's # heading), in the old-print display font, with a double rule under it.
   ========================================================================== */
h1.title {
  font: 400 2.2rem/1.2 var(--display);
  margin: 0.6em 0 0.1em;
  border-bottom: 3px double var(--border);
  padding-bottom: 0.15em;
}
/* Small grey line under a title (path, last modified date, counts...). */
.sub {
  color: var(--muted);
  font-size: 14px;
  font-style: italic;
  margin: 0.4em 0 1em;
}
/* Everything inside .body is the rendered Markdown of a note.
   h1 and h2 look alike (display font with a line under), h3 to h6 are bold body font. */
.body h1,
.body h2 {
  font: 400 1.65rem/1.3 var(--display);
  border-bottom: 1px solid var(--border);
  margin: 1.4em 0 0.6em;
  padding-bottom: 0.1em;
  clear: none;
}
.body h3 {
  font-size: 1.25rem;
  margin: 1.2em 0 0.4em;
  font-weight: 600;
}
.body h4,
.body h5,
.body h6 {
  font-size: 1.02rem;
  margin: 1em 0 0.3em;
  font-weight: 600;
}
/* DROP CAP: the first letter of a note's first paragraph, in rubric red like an old manuscript.
   Only on the note page (class .article, set in viewNote), not on monster notes (.sb-page).
   To remove it, delete this rule. */
.article:not(.sb-page) > p:first-of-type::first-letter {
  float: left;
  font: 3.4em/0.82 var(--display);
  color: var(--rubric);
  padding: 0.08em 0.08em 0 0;
}
/* The first paragraph holds its drop cap, so a short paragraph does not push the next block sideways. */
.article > p:first-of-type {
  display: flow-root;
}
/* Paragraph spacing */
.body p {
  margin: 0.6em 0;
}
/* Lists: indentation of bullet and numbered lists */
.body ul,
.body ol {
  margin: 0.4em 0 0.4em 1.4em;
  padding: 0;
}
.body li > p {
  margin: 0;
}
/* Task lists ( - [ ] item ): no bullet, checkbox in front. The checkboxes are display-only (disabled). */
.body li.task {
  list-style: none;
  margin-left: -1.2em;
}
.body li.task input {
  margin-right: 0.5em;
}
.body li.task > p {
  display: inline;
}
/* Normal quote ( > text ). Callouts ( > [!info] ) use the .callout rules further down instead. */
.body blockquote {
  margin: 1em 0;
  padding: 0.4em 1em;
  border-left: 4px solid var(--border);
  background: var(--faint);
  color: var(--muted);
  font-style: italic;
}
/* Horizontal rule ( --- ): a centered fleuron instead of a line, like a section break in a book. */
.body hr {
  border: 0;
  height: 1.4em;
  margin: 1.4em 0;
  text-align: center;
  overflow: visible;
}
.body hr::before {
  content: '\2766';
  color: var(--rubric);
  font-size: 1.5em;
  line-height: 1;
}
/* Inline `code` (monospace with a light background) */
.body code {
  font: 0.84em var(--mono);
  background: var(--soft);
  padding: 1px 5px;
  border-radius: 2px;
}
/* ==highlighted== text */
.body mark {
  background: var(--hl);
  color: inherit;
  padding: 0 2px;
}
/* Images in notes: never wider than the page. The zoom-in cursor tells you a click enlarges them (see the image viewer, section 12). */
.body img {
  max-width: 100%;
  cursor: zoom-in;
}
/* Markdown tables */
.body table.md {
  border-collapse: collapse;
  margin: 1em 0;
  background: var(--paper);
}
.body table.md th,
.body table.md td {
  border: 1px solid var(--border);
  padding: 5px 10px;
  text-align: left;
}
.body table.md th {
  background: var(--soft);
}
/* #tag pills */
.tag {
  background: var(--soft);
  border-radius: 2px;
  padding: 0 7px;
  font-size: 0.9em;
}

/* ==========================================================================
   4. NOTE PARTS
   Code blocks: a small header bar (.code-h) with the language name and the Copy button,
   then the code itself (.code pre). overflow: auto on the pre gives a horizontal scrollbar for long lines.
   ========================================================================== */
.code {
  border: 1px solid var(--border);
  background: var(--code);
  margin: 1em 0;
  border-radius: 2px;
  overflow: hidden;
}
.code-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 10px;
  background: var(--soft);
  font-size: 12px;
  color: var(--muted);
}
.code-h button {
  padding: 1px 10px;
  font-size: 12px;
}
.code pre {
  margin: 0;
  padding: 10px 14px;
  overflow: auto;
  font: 13px/1.55 var(--mono);
}
.code pre code {
  background: none;
  padding: 0;
  font: inherit;
}
/* INFOBOX: the box on the right made from the note's properties (front matter).
   float: right lets the text flow around it, like Wikipedia. On small screens it becomes full width. */
.infobox {
  float: right;
  width: 21em;
  max-width: 45%;
  margin: 0.4em 0 1em 1.4em;
  border: 1px solid var(--border);
  background: var(--faint);
  font-size: 15px;
  border-collapse: collapse;
  line-height: 1.4;
}
.infobox caption {
  background: var(--infoh);
  font: 400 1.2rem/1.3 var(--display);
  color: var(--rubric);
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-bottom: 0;
}
.infobox th {
  background: var(--soft);
  text-align: left;
  vertical-align: top;
  padding: 4px 8px;
  width: 36%;
  font-weight: 600;
}
.infobox td {
  padding: 4px 8px;
  vertical-align: top;
}
/* The picture of a note ('image:' property) at the top of its infobox. */
.infobox td.ibx-img {
  text-align: center;
  padding: 6px;
}
.infobox td.ibx-img img {
  max-width: 100%;
  max-height: 260px;
}
.infobox tr + tr th,
.infobox tr + tr td {
  border-top: 1px solid var(--border);
}
/* CONTENTS box (table of contents), shown before the first heading when a note has 3+ headings */
.toc {
  display: table;
  border: 1px solid var(--border);
  background: var(--faint);
  padding: 8px 14px 10px;
  margin: 1em 0;
  font-size: 15px;
  line-height: 1.45;
}
.toc b {
  display: block;
  text-align: center;
  margin-bottom: 4px;
  font: 400 1.1rem var(--display);
}
.toc span.n {
  color: var(--muted);
  margin-right: 6px;
}
/* CALLOUTS ( > [!type] title ).
   --c is the callout's accent color; the background is 11% of that color mixed with the paper color.
   Each color name below (.co-teal ...) just changes --c. The JS table CO decides which type uses which color. */
.callout {
  --c: #3d6878; /* slate */
  border-left: 4px solid var(--c);
  background: color-mix(in srgb, var(--c) 11%, var(--paper));
  border-radius: 0 2px 2px 0;
  margin: 1em 0;
  padding: 8px 14px;
  overflow: hidden;
}
/* One rule per color name used in the CO table (blue is the default value of --c above). To add a color, copy a line and change the name and hex. */
.co-teal {
  --c: #3b7a66; /* verdigris */
}
.co-green {
  --c: #5b7536; /* moss */
}
.co-yellow {
  --c: #a3843a; /* tarnished gold */
}
.co-orange {
  --c: #9d5f2c; /* rust */
}
.co-red {
  --c: #8e2e28; /* oxblood */
}
.co-purple {
  --c: #5d4a76; /* nightshade */
}
.co-gray {
  --c: #6c756f; /* ash */
}
/* Foldable callouts ( [!type]- ) are <details> elements: the <summary> is the clickable title line, with a triangle added by ::after. */
.ctitle,
.callout > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  color: var(--c);
  cursor: default;
}
.callout > summary {
  cursor: pointer;
  list-style: none;
}
.callout > summary::-webkit-details-marker {
  display: none;
}
.callout > summary::after {
  content: '\25B8';
  margin-left: auto;
  transition: transform 0.15s;
}
.callout[open] > summary::after {
  transform: rotate(90deg);
}
/* Round icon at the left of a callout title */
.ci {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.3em;
  height: 1.3em;
  border-radius: 50%;
  background: var(--c);
  color: #fff;
  font-size: 0.8em;
  line-height: 1;
}
/* Callout content */
.cbody {
  margin-top: 4px;
}
.cbody > :first-child {
  margin-top: 0.3em;
}
.cbody > :last-child {
  margin-bottom: 0.2em;
}
/* EMBEDS ( ![[other note]] ): a framed box that shows another note's content, with a small title bar (.embed-h). */
.embed {
  border: 1px solid var(--border);
  border-radius: 2px;
  margin: 1em 0;
  padding: 2px 14px 6px;
  background: var(--faint);
  border-radius: 2px;
  overflow: hidden;
}
.embed-h {
  font-size: 13px;
  font-style: italic;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  margin: 0 -14px 4px;
  padding: 3px 14px;
}
/* Footer box under a note: Folder and Tags */
.cats {
  clear: both;
  margin-top: 2em;
  border: 1px solid var(--border);
  background: var(--faint);
  padding: 6px 12px;
  font-size: 15px;
}
.cats span.sep {
  color: var(--muted);
  margin: 0 6px;
}
/* 'What links here' list (backlinks) under a note */
.back {
  clear: both;
  margin-top: 1.2em;
  font-size: 15px;
}
.back h2 {
  font: 400 1.3rem var(--display);
  border-bottom: 1px solid var(--border);
  margin: 0 0 0.4em;
}

/* ==========================================================================
   5. HOME, LISTS, SEARCH
   .cols = multi-column list (used for folder lists and alphabetical page lists). columns: 3 200px means
   'up to 3 columns, each at least 200px wide'.
   ========================================================================== */
.cols {
  columns: 3 200px;
  column-gap: 2em;
}
.cols a,
.cols div {
  display: block;
  break-inside: avoid;
  padding: 1px 0;
}
/* Letter headings (A, B, C...) in the alphabetical page lists */
.letter {
  font: 400 1.25rem var(--display);
  color: var(--rubric);
  border-bottom: 1px solid var(--border);
  margin: 0.8em 0 0.2em;
  break-after: avoid;
}
/* Grid used on the home page for the 'Browse by folder' box */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin: 1em 0;
}
/* Home page boxes with a blue title bar */
.box {
  border: 1px solid var(--border);
  background: var(--faint);
  padding: 0 14px 10px;
}
.box h2 {
  font: 400 1.25rem var(--display);
  margin: 0 -14px 8px;
  padding: 5px 14px;
  background: var(--infoh);
  border-bottom: 1px solid var(--border);
}
.box a {
  display: block;
  padding: 1px 0;
}
/* Search result entries: title, snippet with highlighted words, and path */
.res {
  margin: 0 0 1.1em;
}
.res .snip {
  color: var(--muted);
  font-size: 15px;
}
.res .meta {
  font-size: 13.5px;
  font-style: italic;
  color: var(--muted);
}
.res mark {
  background: var(--hl);
  color: inherit;
}
/* Welcome screen shown before a folder is opened */
.hero {
  text-align: center;
  padding: 40px 10px;
}
.hero h1 {
  font: 400 2.6rem var(--display);
  color: var(--rubric);
  margin: 0.2em 0;
}
.hero .btn {
  margin: 6px;
  padding: 9px 20px;
  font-size: 16.5px;
}
.hero p {
  color: var(--muted);
  max-width: 560px;
  margin: 0.6em auto;
}
/* Tag list on the home page and on the All tags page */
.tagcloud a {
  display: inline-block;
  margin: 2px 8px 2px 0;
}

/* ==========================================================================
   6. EDITOR AND FORMS
   Row of buttons above the editor (Save, status, Close)
   ========================================================================== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 10px;
  flex-wrap: wrap;
  font-size: 15px;
}
/* Small grey helper text (also used for editor status messages) */
.toolbar .hint,
.hint {
  color: var(--muted);
  font-size: 14px;
}
/* Blue call-to-action button (Save, Create, Convert) */
.btn.primary {
  background: var(--link);
  border-color: var(--link);
  color: #fff;
}
[data-theme='dark'] .btn.primary {
  color: var(--paper);
}
/* Editor layout: text area on the left, live preview on the right (one column on narrow screens) */
.edit-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
/* The Markdown text area in the editor */
#ed {
  width: 100%;
  min-height: 68vh;
  resize: vertical;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--code);
  color: var(--text);
  font: 13px/1.55 var(--mono);
  tab-size: 2;
}
/* The live preview pane in the editor */
.pv {
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 16px 12px;
  max-height: 74vh;
  overflow: auto;
}
/* Forms (New note, tools): labels and inputs */
.form label {
  display: block;
  margin: 0 0 12px;
  font-weight: 600;
}
.form input[type='text'],
.form select {
  display: block;
  width: 100%;
  max-width: 460px;
  margin-top: 4px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--faint);
  color: var(--text);
  font: inherit;
  font-weight: 400;
}
/* The 'Example campaign (read-only)' notice at the top of the sidebar. */
.demo-note {
  margin: 0 0 6px;
  padding: 6px 8px;
  font-size: 13.5px;
  line-height: 1.4;
  background: var(--faint);
  border: 1px solid var(--border);
  border-radius: 2px;
}
#side .demo-note a {
  display: inline;
  padding: 0;
}
/* Green text (successful save) */
.ok {
  color: #4f7a3a;
}
/* Red text (error messages) */
.err {
  color: var(--red);
}
/* IMAGE VIEWER (lightbox) shown when you click an image: a full-screen dark layer (#lb) with the image centered.
   overflow: auto lets a real-size image be scrolled; .full is added when you switch to real size.
   .lb-btn = the round close / previous / next buttons, .lb-cap = the caption at the bottom. */
#lb {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  overflow: auto;
  background: rgba(0, 0, 0, 0.88);
}
#lb[hidden] {
  display: none;
}
#lb img {
  margin: auto;
  max-width: 96vw;
  max-height: 90vh;
  background: #fff;
  cursor: zoom-in;
}
#lb.full img {
  max-width: none;
  max-height: none;
  cursor: zoom-out;
}
.lb-btn {
  position: fixed;
  z-index: 101;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
  color: #fff;
  font-size: 28px;
  line-height: 44px;
}
.lb-btn:hover {
  background: rgba(255, 255, 255, 0.35);
}
.lb-close {
  top: 14px;
  right: 14px;
}
.lb-prev {
  left: 14px;
  top: 50%;
}
.lb-next {
  right: 14px;
  top: 50%;
}
.lb-cap {
  position: fixed;
  bottom: 8px;
  left: 0;
  right: 0;
  text-align: center;
  color: #ddd;
  font-size: 13px;
  pointer-events: none;
}


/* WEATHER BANNER in the header (#wx, drawn by renderWeather in section 9B of the script).
   .wx-chip = the clickable weather (next day), .wx-more = the small arrow, .wx-pop = the details box. */
#wx {
  position: relative;
  display: flex;
  align-items: stretch;
  flex: none;
}
.wx-ic {
  width: 20px;
  height: 20px;
  flex: none;
  color: var(--rubric);
}
.wx-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  font: 15px/1.3 var(--serif);
  white-space: nowrap;
  border-radius: 2px 0 0 2px;
}
.wx-more {
  border-left: 0;
  border-radius: 0 2px 2px 0;
  padding: 0 8px;
  font-size: 13px;
}
.wx-pop {
  position: absolute;
  left: 0;
  top: calc(100% + 6px);
  z-index: 40;
  width: min(340px, 92vw);
  padding: 12px 14px 6px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  font-size: 15px;
}
.wx-now {
  display: flex;
  gap: 10px;
  align-items: center;
  line-height: 1.35;
}
.wx-now .wx-ic {
  width: 34px;
  height: 34px;
}
.wx-eff {
  margin: 8px 0;
}
.wx-btns {
  margin: 0 0 12px;
}
.wx-pop label {
  margin-bottom: 10px;
}
.wx-hist {
  border-top: 1px solid var(--border);
  padding: 6px 0 4px;
}
.wx-row {
  display: grid;
  grid-template-columns: 20px 6.5em 1fr;
  gap: 8px;
  align-items: center;
  padding: 1px 0;
}

/* DICE ROLLER in the header (#dice, built by diceInit in section 9C of the script).
   .dice-chip = the button with the last result, .dice-term = the terminal box (always dark, like the
   terminal of a computer), .dice-link = dice written in a note that you can click. */
#dice {
  position: relative;
  display: flex;
  flex: none;
}
.dice-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  font: 15px/1.3 var(--serif);
  white-space: nowrap;
}
.dice-term {
  position: absolute;
  left: 0;
  top: calc(100% + 6px);
  z-index: 40;
  width: min(480px, 94vw);
  background: #1c1c1c;
  color: #e6e6e6;
  border: 1px solid #3a3a3a;
  border-radius: 2px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
  font: 13.5px/1.5 var(--mono);
}
.dice-term[hidden] {
  display: none;
}
.dice-pad {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px;
  border-bottom: 1px solid #333;
}
.dice-pad button {
  flex: 1;
  background: #2a2a2a;
  color: #e6e6e6;
  border-color: #444;
  font: 13px/1.6 var(--mono);
  padding: 3px 6px;
}
.dice-pad button:hover {
  background: #3a3a3a;
}
.dice-pad .dice-clr {
  flex: none;
  color: #8a8a8a;
}
.dice-log {
  max-height: min(320px, 50vh);
  overflow: auto;
  padding: 4px 10px;
  scrollbar-color: #444 #1c1c1c;
}
.dl {
  padding: 4px 0;
}
.dl + .dl {
  border-top: 1px dashed #2f2f2f;
}
.dl-cmd {
  color: #9a9a9a;
}
.dl-cmd .pr,
.dice-in span {
  color: #e3bd6b;
}
.dl-cmd .lbl {
  color: #7d7d7d;
  font-style: italic;
  margin-left: 0.6em;
}
.dl-out {
  padding-left: 1.2em;
  overflow-wrap: anywhere;
}
.dl-help {
  margin: 2px 0 0 1.2em;
  color: #bdbdbd;
  font: inherit;
  white-space: pre-wrap;
}
.dl-empty {
  color: #7d7d7d;
  padding: 6px 0;
}
.dice-term .tot {
  color: #e3bd6b;
}
.dice-term .dim {
  color: #8a8a8a;
}
.dice-term .drop {
  color: #666;
  text-decoration: line-through;
}
.dice-term .crit {
  color: #8fd18f;
  font-weight: 700;
}
.dice-term .good {
  color: #e3bd6b;
}
.dice-term .fum {
  color: #ef8a76;
  font-weight: 700;
}
.dice-in {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-top: 1px solid #333;
}
.dice-in:focus-within {
  border-top-color: #e3bd6b;
}
.dice-in input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: 0;
  color: #f2f2f2;
  font: inherit;
}
.dice-in input::placeholder {
  color: #5f5f5f;
}
/* Dice written in a note: dotted underline in the accent color; click to roll. */
.dice-link {
  color: inherit;
  border-bottom: 1px dotted var(--rubric);
}
.dice-link:hover {
  background: var(--hl);
  text-decoration: none;
}

/* INITIATIVE (section 9D of the script).
   .init-tog = the swords button in the header (pressed look while the bar is shown).
   #initbar  = the bar under the header: .ib-track holds one .ib-c per creature (blue left edge for
   players, red for monsters, outlined for the current turn). html.init-on is set while the bar is shown,
   so the sidebar and heading jumps leave room for it. */
.init-tog {
  display: flex;
  align-items: center;
  padding: 5px 9px;
}
.init-tog[aria-pressed='true'] {
  background: var(--soft);
  border-color: var(--text);
}
#initbar {
  position: sticky;
  top: 3.4rem;
  z-index: 19;
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  font-size: 15px;
}
#initbar[hidden] {
  display: none;
}
.ib {
  position: relative;
  display: flex;
  /* Controls stay on the top line (they do not move down when conditions make the bar taller). */
  align-items: flex-start;
  gap: 6px;
  min-height: 2.9rem;
  padding-top: 4px !important;
  padding-bottom: 4px !important;
  max-width: 1500px;
  margin: 0 auto;
  padding: 0 16px;
}
.ib .btn {
  padding: 3px 9px;
}
.ib-round {
  line-height: 30px;
  white-space: nowrap;
  padding-right: 2px;
}
.ib-track {
  position: relative;
  display: flex;
  align-items: flex-start;
  align-self: stretch;
  gap: 6px;
  flex: 1;
  min-width: 0;
  list-style: none;
  margin: 0 6px;
  padding: 3px 2px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.ib-c {
  display: flex;
  flex-direction: column;
  flex: none;
  white-space: nowrap;
  background: var(--faint);
  border: 1px solid var(--border);
  border-left: 3px solid var(--red);
  border-radius: 2px;
  padding: 0 1px 0 2px;
}
.ib-c.player {
  border-left-color: var(--link);
}
.ib-c.cur {
  background: var(--soft);
  outline: 2px solid var(--text);
  outline-offset: -1px;
}
.ib-c.cur .ib-name {
  font-weight: 700;
}
.ib-top {
  display: flex;
  align-items: center;
}
.ib-n {
  width: 2.5em;
  text-align: center;
  font: inherit;
  font-weight: 700;
  color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  padding: 1px 3px;
}
/* No number yet: an empty box with a faint dotted line, so it still looks like something to fill. */
.ib-n:placeholder-shown {
  border-bottom: 1px dotted var(--muted);
}
.ib-n:hover,
.ib-n:focus {
  border-color: var(--border);
  background: var(--paper);
}
/* The name is a button: pointing at it shows it struck through in red, clicking removes the creature. */
.ib-name {
  border: 0;
  background: none;
  color: var(--text);
  font: inherit;
  padding: 0 2px 0 4px;
}
.ib-name:hover,
.ib-name:focus-visible {
  color: var(--red);
  text-decoration: line-through;
}
.ib-cool .ib-name {
  pointer-events: none;
}
.ib-plus {
  display: flex;
  align-items: center;
  border: 0;
  background: none;
  color: var(--muted);
  padding: 2px 4px;
}
.ib-plus:hover {
  color: var(--text);
}
/* Conditions: stacked under the name. Click one to remove it. The small number is rounds left. */
.ib-conds {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 0 4px 4px;
}
.ib-cond {
  font: 12.5px/1.3 var(--serif);
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--paper);
  color: var(--text);
}
.ib-cond:hover {
  border-color: var(--red);
  color: var(--red);
  text-decoration: line-through;
}
.ib-rd {
  font-weight: 700;
  margin-left: 2px;
}
/* The condition picker (opened by the + of a creature). */
.ib-pick {
  position: fixed;
  z-index: 45;
  width: min(420px, 94vw);
  padding: 10px 12px 2px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  font-size: 14.5px;
}
.ib-pick-h {
  margin-bottom: 6px;
}
.ib-pick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
  gap: 4px;
}
.ib-pick-grid .btn {
  text-align: left;
}
.ib-pick-row {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}
.ib-pick-row input {
  min-width: 0;
  padding: 3px 7px;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--faint);
  color: var(--text);
  font: inherit;
}
#ibcust {
  flex: 1;
}
#ibrounds {
  width: 5.5em;
}
.ib-pick .hint {
  margin: 6px 0 8px;
}
.ib-empty {
  color: var(--muted);
  font-style: italic;
  white-space: nowrap;
}
.ib-add {
  display: flex;
  gap: 4px;
  flex: none;
}
.ib-add input {
  width: 8em;
  padding: 3px 7px;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: var(--faint);
  color: var(--text);
  font: inherit;
}
#ibval {
  width: 5.5em;
}
/* Name suggestions under the Name box of the initiative bar. */
.ib-name-wrap {
  position: relative;
  display: flex;
}
.ib-sugg {
  position: absolute;
  left: 0;
  top: calc(100% + 2px);
  z-index: 30;
  min-width: 100%;
  width: max-content;
  max-width: 22em;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
}
.ib-sugg[hidden] {
  display: none;
}
.ib-sg {
  display: flex;
  flex-direction: column;
  padding: 4px 10px;
  cursor: pointer;
  line-height: 1.3;
}
.ib-sg + .ib-sg {
  border-top: 1px solid var(--soft);
}
.ib-sg.on,
.ib-sg:hover {
  background: var(--soft);
}
.ib-sg small {
  color: var(--muted);
  font-size: 12.5px;
}
.ib-kind {
  width: 5.2em;
  border-left: 3px solid var(--red) !important;
}
.ib-kind.player {
  border-left-color: var(--link) !important;
}
/* Error message: a small note that hangs under the bar for a few seconds. */
.ib-err .btn {
  margin-left: 6px;
  padding: 0 8px;
}
.ib-err {
  position: absolute;
  top: calc(100% + 2px);
  right: 16px;
  z-index: 20;
  color: var(--red);
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 8px;
  font-size: 13px;
}
.ib-err:empty {
  display: none;
}
html.init-on {
  scroll-padding-top: calc(4.2rem + var(--ibh, 2.9rem));
}
html.init-on #side {
  top: calc(3.4rem + var(--ibh, 2.9rem));
  max-height: calc(100vh - 3.4rem - var(--ibh, 2.9rem));
}

/* PLAYER NOTES ( > [!player] ), see section 9E of the script.
   The callout: pointing at its title highlights it; a given one has its title struck through and is dimmed.
   #plnotes: the scroll icon in the header (next to the initiative swords) and its list (.pl-pop). */
.co-player {
  --c: #3b5ba9; /* royal blue */
}
.callout .pl-t {
  cursor: pointer;
  border-radius: 2px;
  padding: 0 4px;
  margin-left: -4px;
}
.callout .pl-t:hover {
  background: color-mix(in srgb, var(--c) 18%, transparent);
  text-decoration: line-through;
}
.callout.given .pl-t {
  text-decoration: line-through;
}
.callout.given .pl-t:hover {
  text-decoration: none;
}
.callout.given {
  opacity: 0.55;
}
.callout.given:hover {
  opacity: 0.8;
}
@keyframes pl-flash {
  from {
    box-shadow: 0 0 0 3px var(--c);
  }
  to {
    box-shadow: 0 0 0 3px transparent;
  }
}
.pl-flash {
  animation: pl-flash 1.2s ease-out;
}
#plnotes {
  position: relative;
  display: flex;
  flex: none;
}
.pl-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  font: 15px/1.3 var(--serif);
  white-space: nowrap;
}
.pl-btn.none {
  color: var(--muted);
}
.pl-btn .wx-ic {
  color: inherit;
}
.pl-pop {
  position: absolute;
  left: 0;
  top: calc(100% + 6px);
  z-index: 40;
  width: min(360px, 94vw);
  padding: 10px 12px 4px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  color: var(--text);
  font-size: 15px;
}
.pl-list {
  list-style: none;
  margin: 8px 0;
  padding: 0;
  max-height: 50vh;
  overflow: auto;
}
.pl-list li {
  display: flex;
  align-items: flex-start;
  border-top: 1px solid var(--soft);
}
/* A line of the list: pointing at it highlights it and previews the change (struck / not struck). */
.pl-item {
  flex: 1;
  text-align: left;
  border: 0;
  background: none;
  color: var(--text);
  font: inherit;
  padding: 4px 6px;
}
.pl-item:hover {
  background: var(--soft);
  text-decoration: line-through;
}
.pl-list li.given .pl-item {
  color: var(--muted);
  text-decoration: line-through;
}
.pl-list li.given .pl-item:hover {
  text-decoration: none;
}
.pl-go {
  border: 0;
  background: none;
  color: var(--muted);
  padding: 4px 8px;
}
.pl-go:hover {
  color: var(--link);
  background: var(--soft);
}
.pl-foot {
  margin: 4px 0 8px;
}
.pl-pop code {
  font: 0.9em var(--mono);
}

/* PIN PANEL (#pin, section 9F of the script): a third column on the right, sticky under the header
   (and under the initiative bar when it is shown). .pin-tabs = one tab per pinned note, .pin-body = the
   note, .pin-hp = hit points of the monsters in combat, .pin-grip = the edge you drag to resize. */
html.init-on {
  --ibh-on: var(--ibh, 2.9rem);
}
#pin {
  position: sticky;
  top: calc(3.4rem + var(--ibh-on, 0px) + 16px);
  align-self: flex-start;
  flex: none;
  display: flex;
  flex-direction: column;
  width: 420px;
  max-height: calc(100vh - 3.4rem - var(--ibh-on, 0px) - 32px);
  margin: 16px 16px 16px 0;
  background: var(--paper);
  border: 1px solid var(--border);
  overflow: hidden;
}
#pin[hidden] {
  display: none;
}
.pin-grip {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 6px;
  cursor: col-resize;
  z-index: 2;
}
.pin-grip:hover,
.pin-resizing .pin-grip {
  background: var(--border);
}
.pin-resizing {
  cursor: col-resize;
  user-select: none;
}
.pin-tabs {
  display: flex;
  flex: none;
  overflow-x: auto;
  background: var(--faint);
  border-bottom: 1px solid var(--border);
  scrollbar-width: thin;
}
.pin-tab {
  display: flex;
  align-items: center;
  flex: none;
  max-width: 13em;
  border-right: 1px solid var(--border);
}
.pin-tab.on {
  background: var(--paper);
  margin-bottom: -1px;
}
.pin-t {
  border: 0;
  background: none;
  color: var(--link);
  font: 14px/1.4 var(--serif);
  padding: 6px 4px 6px 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pin-tab.on .pin-t {
  color: var(--text);
  font-weight: 700;
}
.pin-x {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  padding: 0 8px 0 2px;
}
.pin-x:hover {
  color: var(--red);
}
.pin-body {
  flex: 1;
  overflow: auto;
  padding: 10px 16px 16px;
}
.pin-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  border-bottom: 3px double var(--border);
  margin-bottom: 8px;
}
.pin-title {
  font: 1.55rem/1.25 var(--display);
}
.pin-open {
  font-size: 13px;
  white-space: nowrap;
}
.pin-body .body h1,
.pin-body .body h2 {
  font-size: 1.3rem;
  margin: 1em 0 0.4em;
}
.pin-body .infobox {
  float: none;
  width: 100%;
  max-width: 100%;
  margin: 0 0 1em;
}
/* Hit points of the monsters in combat (at the top of a pinned monster). */
.pin-hp {
  border: 1px solid var(--border);
  background: var(--faint);
  padding: 4px 10px 6px;
  margin: 0 0 10px;
}
.pin-hp-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2px 0;
}
.pin-hp-row.cur .pin-hp-n {
  font-weight: 700;
}
.pin-hp-row.cur .pin-hp-n::before {
  content: '\25B8  ';
}
.pin-hp-row.dead .pin-hp-n {
  color: var(--muted);
  text-decoration: line-through;
}
.pin-hp-in {
  width: 3.6em;
  text-align: center;
  font: inherit;
  font-weight: 700;
  color: var(--text);
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 4px;
}
/* The Pin button next to the Note / Edit / Source tabs. */
.pin-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 4px 0 4px auto;
  font-size: 14px;
}
.pin-btn .wx-ic {
  width: 16px;
  height: 16px;
  color: inherit;
}
/* STAT BLOCK (monster notes). */
.sb {
  max-width: 44em;
  margin: 0 0 1em;
  padding: 8px 14px 10px;
  background: var(--faint);
  border: 1px solid var(--border);
  line-height: 1.45;
}
.pin-body .sb {
  padding: 0;
  background: none;
  border: 0;
}
.sb-sub {
  font-style: italic;
  color: var(--muted);
}
.sb-rule {
  border-top: 2px solid var(--rubric);
  opacity: 0.6;
  margin: 7px 0;
}
.sb-line {
  margin: 1px 0;
}
.sb-sep {
  display: inline-block;
  width: 1.2em;
}
.sb-abil {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 14px;
}
/* The two ability tables (STR DEX CON / INT WIS CHA) with their MOD and SAVE columns. */
.sb-ab {
  width: 100%;
  border-collapse: collapse;
  text-align: center;
}
.sb-ab th,
.sb-ab td {
  padding: 1px 4px;
}
.sb-ab thead th {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}
.sb-ab tbody th {
  text-align: left;
  font-size: 13px;
}
.sb-ab tbody tr:nth-child(odd) {
  background: var(--soft);
}
/* A proficient saving throw (listed in 'saves:') is in bold. */
.sb-ab td.sb-prof {
  font-weight: 700;
}
.sb-img img {
  display: block;
  max-width: 100%;
  max-height: 180px;
  margin: 0 auto 8px;
}
/* A monster that is down (0 HP) in the initiative bar. */
.ib-c.dead {
  opacity: 0.5;
}

/* PLAYER SCREEN (section 9G of the script): the monitor button in the header (.ps-btn, underlined in
   the accent color while the screen is open), its menu (.ps-pop) and the floating 'Show to players'
   button (#psshow) that appears over images and player notes. */
#pscreen {
  position: relative;
  display: flex;
  flex: none;
}
.ps-btn {
  display: flex;
  align-items: center;
  padding: 5px 9px;
}
.ps-btn .wx-ic {
  color: var(--muted);
}
.ps-btn.live {
  border-color: var(--text);
  background: var(--soft);
}
.ps-btn.live .wx-ic {
  color: var(--rubric);
}
.ps-pop {
  position: absolute;
  left: 0;
  top: calc(100% + 6px);
  z-index: 40;
  width: min(360px, 94vw);
  padding: 10px 12px 2px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 2px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  font-size: 15px;
}
.ps-btns {
  margin: 8px 0;
}
.ps-auto {
  display: block;
  width: 100%;
  text-align: left;
  font: inherit;
  padding: 5px 8px;
}
.ps-auto.on {
  border-color: var(--text);
}
.ps-pop .hint {
  margin: 8px 0;
}
#psshow {
  position: fixed;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  padding: 3px 8px;
  background: var(--paper);
  border: 1px solid var(--text);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}
#psshow[hidden] {
  display: none;
}
#psshow .wx-ic {
  width: 16px;
  height: 16px;
  color: inherit;
}
.lb-show {
  top: 14px;
  left: 14px;
  width: auto;
  border-radius: 22px;
  padding: 0 16px;
  font-size: 15px;
  line-height: 44px;
}

/* ==========================================================================
   7. SMALL SCREENS - under 1000px wide the editor preview goes below the text area
   ========================================================================== */
@media (max-width: 1000px) {
  .edit-grid {
    grid-template-columns: 1fr;
  }
  .pv {
    max-height: none;
  }
}
/* Under 820px (phones/tablets): the sidebar is hidden and opens as a drawer when the menu button
   is pressed (the script adds the class .open on #side); the infobox becomes full width. */
@media (max-width: 820px) {
  #menuBtn {
    display: inline-block;
  }
  /* Weather: only the icon and temperature on small screens (the arrow opens the details). */
  .wx-l {
    display: none;
  }
  /* Only the icons on small screens (plus the round number). */
  .dice-last {
    display: none;
  }
  /* Initiative bar on two lines: controls first, the track underneath on its own line. */
  .ib {
    flex-wrap: wrap;
    height: auto;
    padding: 6px 8px;
  }
  .ib-track {
    order: 10;
    flex-basis: 100%;
    margin: 2px 0 0;
  }
  .ib-add {
    flex: 1;
    min-width: 0;
  }
  .ib-add input {
    min-width: 0;
  }
  /* Pin panel: a sheet over the bottom half of the screen. */
  #pin {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    width: auto !important;
    height: 55vh;
    max-height: none;
    margin: 0;
    z-index: 25;
    box-shadow: 0 -6px 18px rgba(0, 0, 0, 0.25);
  }
  .pin-grip {
    display: none;
  }
  /* Weather details and dice terminal: full width under the header. */
  .wx-pop,
  .dice-term,
  .pl-pop,
  .ps-pop {
    position: fixed;
    left: 8px;
    right: 8px;
    top: 3.8rem;
    width: auto;
  }
  #top {
    gap: 8px;
    padding: 0 8px;
  }
  /* Smaller site name so the search box keeps some room. */
  .logo {
    font-size: 1.15rem;
  }
  .logo small {
    display: none;
  }
  .search {
    min-width: 0;
  }
  .wx-chip,
  .dice-chip,
  .pl-btn,
  .init-tog,
  .ps-btn {
    padding: 5px 7px;
  }
  #side {
    display: none;
    position: fixed;
    top: 3.4rem;
    left: 0;
    bottom: 0;
    background: var(--paper);
    z-index: 15;
    border-right: 1px solid var(--border);
  }
  #side.open {
    display: block;
  }
  #content {
    padding: 8px;
  }
  .paper {
    padding: 6px 14px 20px;
  }
  .infobox {
    float: none;
    width: 100%;
    max-width: 100%;
    margin: 0.5em 0 1em;
  }
  .tabs {
    margin: 0 -14px;
    padding: 0 14px;
  }
}
/* Under 480px (phones): the site name is hidden to leave room for the tools; the sidebar has Main page. */
@media (max-width: 480px) {
  .logo {
    display: none;
  }
}
</style>
