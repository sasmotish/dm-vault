<body>
<!-- HEADER (sticky bar at the top).
     #siteName is filled by the script (the folder name after a folder is opened).
     The <small> line under it is the tagline: edit it here.
     #q is the search box and #sugg its suggestion dropdown (see the search code in section 12).
     Order: tools on the left (weather, dice, initiative, player notes, player screen) right after the site name; the search box is pushed to the
     right by its margin-left: auto (see .search in the CSS).
     #wx is the weather banner, drawn by renderWeather() (section 9B).
     #dice is the dice roller button and its terminal box, built by diceInit() (section 9C).
     #init holds the swords button that shows / hides the initiative bar (#initbar, below the header),
     both drawn by renderInit() (section 9D).
     #pscreen is the player screen button and its menu (section 9G).
     #plnotes is the player notes icon and its list for the page being shown (section 9E).
     #menuBtn (hamburger) is only visible on small screens; it opens the sidebar. -->
<header id="top">
  <button id="menuBtn" aria-label="Menu">&#9776;</button>
  <a class="logo" href="#/"><span id="siteName">Notes</span><small>...</small></a>
  <div id="wx"></div>
  <div id="dice"></div>
  <div id="init"></div>
  <div id="plnotes"></div>
  <div id="pscreen"></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search the campaign" autocomplete="off" aria-label="Search the campaign">
    <div id="sugg"></div>
  </div>
</header>
<!-- INITIATIVE BAR under the header, hidden until the swords button is clicked (section 9D). -->
<div id="initbar" hidden></div>
<!-- PAGE LAYOUT.
     <nav id="side">     the sidebar, drawn by renderSide() (section 10).
     <aside id="pin">   the pin panel on the right (section 9F), hidden when nothing is pinned.
     <main id="content"> the page area. Every view function writes its HTML here through
                         setContent() (section 6). -->
<div class="layout">
  <nav id="side"></nav>
  <main id="content"></main>
  <aside id="pin" hidden></aside>
</div>
<!-- Hidden folder picker. It is the fallback used when the browser has no showDirectoryPicker
     (Firefox, Safari). openFolder() clicks it; the 'change' handler in section 12 loads the files. -->
<input type="file" id="picker" webkitdirectory multiple hidden>

<!-- THE APPLICATION SCRIPT. See the 12 numbered sections; read the comment just below first. -->
<script>
// =============================================================================
// APPLICATION SCRIPT - everything below runs when the page opens.
//
// The whole program is wrapped in  (function () { ... })();  so its variables stay
// private and cannot clash with anything else on the page. The only thing exposed
// on purpose is window.__wiki (very last lines) so you can test functions from the
// browser console (press F12).
//
// Read it in order: sections 1 to 12 (search for the word SECTION).
//   1  Settings and global state          7  Editing, saving, new notes
//   2  Text helpers                       8  Search
//   3  Indexing (notes -> lookup tables)  9  Tools (add yours here)
//                                         9B Weather banner (seasons, climates)
//                                         9C Dice roller (header + dice in notes)
//                                         9D Initiative bar (D&D)
//                                         9E Player notes ( > [!player] )
//                                         9F Monsters and pin panel
//                                         9G Player screen (second monitor)
//   4  Markdown: inline (bold, links)    10  Sidebar and router (which page to show)
//   5  Markdown: blocks (lists, tables)  11  Loading files from your disk
//   6  Views (one function per page)     12  Events and start-up
// =============================================================================
(function () {
  'use strict';

  // =============================================================================
  // SECTION 1 - SETTINGS AND GLOBAL STATE
  // Constants, tiny helper functions and the object S that holds everything that was loaded.
  // =============================================================================

  // Name of the wiki. It is used for the home page title and the browser tab title.
  // NOTE: once you open a folder, the header at the top shows the folder's name instead
  // (see loadEntries in section 11). To always show SITE_NAME there, change
  //   $('#siteName').textContent = rootName || SITE_NAME;   into   = SITE_NAME;
  const SITE_NAME = 'DM Vault';

  // ONLINE (see the guide 'Publishing on GitHub'):
  //   DEMO_URL      where the example campaign is published (GitHub Pages). Must end with a /.
  //                 It must contain manifest.json (the list of its files). If you change the address, change
  //                 it in the Content-Security-Policy line at the top of the <head> too.
  //   DOWNLOAD_URL  the page where visitors download everything (the latest GitHub Release).
  const DEMO_URL = 'https://sasmotish.github.io/dm-vault/demo/';
  const DOWNLOAD_URL = 'https://github.com/sasmotish/dm-vault/releases/latest';

  // Shortcut: $('#id') or $('.class') returns the first matching HTML element.
  // It is the same as document.querySelector.
  const $ = (s, r) => (r || document).querySelector(s);

  // Makes text safe to put inside HTML: & < > and " become &amp; &lt; &gt; &quot;
  // RULE: anything that comes from your notes (titles, file names, tags, paths) must go
  // through esc() before it is placed in an HTML string. Otherwise a note containing
  // <b> or a quote character could break the page.
  const esc = (s) =>
    String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // GLOBAL STATE - the wiki's memory. Everything loaded from your disk lives here.
  // It is rebuilt by buildIndex() each time notes are loaded, saved or created.
  // You can inspect it in the console with:  __wiki.S
  const S = {
    // Array of every note object (see makeNote in section 3), sorted by path.
    notes: [],
    // Lookup: 'folder/note-name' (lowercase, no .md) -> note. Used by routes and getNote().
    byPath: new Map(),
    // Lookup: 'note-name' (lowercase) -> note. This is what [[wikilinks]] use.
    byName: new Map(),
    // Lookup: each name from a note's aliases: property (lowercase) -> note.
    byAlias: new Map(),
    // Images found in the folder: full relative path in lowercase ('media/image1.png') -> temporary blob:
    // URL.
    assets: new Map(),
    // Same images indexed by file name only: 'image1.png' -> list of full paths (several folders can hold
    // the same file name).
    assetsByName: new Map(),
    // Backlinks: note path -> Set of paths of the notes that link to it.
    back: new Map(),
    // Tag name -> array of the notes that have that tag.
    tags: new Map(),
    // Folder path -> { path, name, depth, notes[] }. The root folder has the path ''.
    folders: new Map(),
    // true while the example campaign from GitHub is open (read-only, see loadDemo in section 11).
    demo: false,
    // Folder handle from showDirectoryPicker (Chrome/Edge). Lets us Reload and save files. null in
    // Firefox.
    handle: null,
    // Name of the folder that was opened.
    root: '',
    // Kind of page currently shown: 'n' (note), 'edit', 'src', 'tool', 'f' ... (see the router, section
    // 10).
    view: '',
    // Path of the note currently shown.
    path: '',
    // Unsaved editor text: note path -> text. Lets you leave the editor and come back without losing
    // edits.
    drafts: new Map(),
  };

  // Turns a front matter value into an array. In YAML you can write  tags: a, b  or a list;
  // both give ['a', 'b']. A missing value gives [].
  const toList = (v) =>
    v == null
      ? []
      : Array.isArray(v)
        ? v.map(String)
        : String(v)
            .split(/[,\s]+/)
            .filter(Boolean);
  // Formats a timestamp (milliseconds) as a readable date such as 'Sep 21, 2026'. Returns '' if unknown.
  const fmtDate = (ms) =>
    ms ? new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
  // Short name for encodeURIComponent: makes text safe inside a URL (spaces, slashes, accents...).
  const enc = encodeURIComponent;

  // =============================================================================
  // SECTION 2 - TEXT HELPERS
  // Small functions used everywhere: clean a title, make an id, ignore code blocks,
  // read the front matter (properties) at the top of a note.
  // =============================================================================

  // Removes Markdown decoration from a short text so it can be used as plain text
  // (page titles, table of contents, heading ids):
  //   [[note|alias]] -> alias      [text](url) -> text      and the characters * ` ~~ == are dropped.
  function plainInline(s) {
    return String(s)
      .replace(/!?\[\[([^\]|#]*)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g, (m, a, b) => b || a)
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[*`]|~~|==/g, '')
      .trim();
  }

  // Makes an id from a heading:  "My Heading!"  ->  "my-heading".
  // Used for the anchors inside a page and for links like [[note#My Heading]].
  // \p{L} and \p{N} mean 'any letter or number in any language', so accents and
  // non-Latin text are kept.
  function slugify(s) {
    return plainInline(s)
      .toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, '-')
      .replace(/^-+|-+$/g, '');
  }

  // Runs fn() only on the parts of a text that are NOT inside ``` code blocks.
  //   text : the whole Markdown text
  //   fn   : function that receives each chunk of normal text and returns its replacement
  //   keep : true  -> the lines of the code blocks are kept in the result
  //          false -> the lines of the code blocks are dropped
  // Why: CLI output often contains # and %% characters, and we do not want them treated
  // as tags or comments. Fences are ``` or ~~~ (also when written inside a > callout).
  function mapOutside(text, fn, keep) {
    const lines = text.split('\n'),
      out = [];
    let buf = [],
      fence = null;
    // flush(): hands the collected normal-text lines to fn() and empties the buffer.
    const flush = () => {
      if (buf.length) {
        out.push(fn(buf.join('\n')));
        buf = [];
      }
    };
    // Walk through the text line by line, remembering whether we are inside a code fence.
    for (const l of lines) {
      if (fence) {
        if (keep) out.push(l);
        if (new RegExp('^[\\s>]*' + fence.ch + '{' + fence.len + ',}\\s*$').test(l)) fence = null;
        continue;
      }
      const m = l.match(/^[\s>]*(`{3,}|~{3,})/);
      if (m) {
        flush();
        fence = { ch: m[1][0], len: m[1].length };
        if (keep) out.push(l);
        continue;
      }
      buf.push(l);
    }
    flush();
    return out.join('\n');
  }
  // Removes Obsidian comments  %% like this %%  (outside code blocks only).
  const stripComments = (t) => mapOutside(t, (c) => c.replace(/%%[\s\S]*?%%/g, ''), true);
  // Text without code blocks and without `inline code`. Used to find real [[links]] and #tags only.
  const nonCode = (t) => mapOutside(t, (c) => c.replace(/`[^`\n]*`/g, ''), false);

  // Reads the front matter (properties) at the very top of a note:
  //     ---
  //     date: 2026-09-21
  //     tags: [a, b]          (or a dashed list on the following lines)
  //     ---
  // Returns { fm: {key: value}, body: the rest of the text }.
  // Supported: simple 'key: value', [a, b] lists and '- item' lists.
  // NOT supported (it is not a full YAML parser): nested objects, multi-line strings.
  // All values stay as text.
  function parseFM(text) {
    text = text.replace(/^\uFEFF/, '');
    const m = text.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/);
    if (!m) return { fm: {}, body: text };
    const fm = {};
    let key = null;
    // unq(): removes the quotes around a value ( "x" or 'x'  ->  x ).
    const unq = (v) => v.replace(/^(["'])(.*)\1$/, '$2');
    for (const line of m[1].split(/\r?\n/)) {
      let mm;
      // A line like  key: value  starts a new property (an empty value means a list follows).
      if ((mm = line.match(/^([A-Za-z0-9_\-]+):\s*(.*)$/))) {
        key = mm[1];
        const v = mm[2].trim();
        if (v === '') fm[key] = [];
        else if (v[0] === '[' && v[v.length - 1] === ']')
          fm[key] = v
            .slice(1, -1)
            .split(',')
            .map((s) => unq(s.trim()))
            .filter(Boolean);
        else fm[key] = unq(v);
      // A line like  - item  adds an item to the list of the last property.
      } else if ((mm = line.match(/^\s*-\s+(.*)$/)) && key) {
        if (!Array.isArray(fm[key])) fm[key] = [];
        fm[key].push(unq(mm[1].trim()));
      }
    }
    return { fm, body: text.slice(m[0].length) };
  }

  // =============================================================================
  // SECTION 3 - INDEXING
  // Turns the raw files into note objects (makeNote), then builds the lookup tables
  // that make links, backlinks, tags and folders work (buildIndex).
  // =============================================================================

  // Builds ONE note object from a raw file { path, text, mtime, handle }.
  // The result has these fields:
  //   path     'ise/my-note.md'  relative path, always with /
  //   name     'my-note'         file name without .md
  //   folder   'ise'             folder part ('' for the root)
  //   fm       { date: '...', tags: [...] }   the properties (front matter)
  //   body     text without the properties and without %%comments%%
  //   content  body without its first '# Title' line (that line becomes the page title)
  //   raw      the exact original file text (used by the Edit and Source tabs)
  //   title    the first '# heading' if the note starts with one, otherwise the file name
  //   aliases  list from the aliases: property
  //   tags     Set of tags (tags: property + #inline tags)
  //   mtime    last modified time in milliseconds
  //   handle   file handle used to save back to disk (Chrome/Edge), otherwise null
  //   lc       lowercase text of everything, used by the search
  function makeNote(r) {
    const { fm, body: b0 } = parseFM(r.text);
    // Normalise Windows line endings (\r\n -> \n) and remove %%comments%%.
    const body = stripComments(b0.replace(/\r\n?/g, '\n'));
    const parts = r.path.split('/');
    const file = parts.pop();
    const name = file.replace(/\.(md|markdown)$/i, '');
    // Is the first non-empty line a  # Title ? If yes it becomes the page title (and is not repeated in
    // the content).
    const tm = body.match(/^\s*#[ \t]+(.+?)[ \t]*#*[ \t]*(?:\n|$)/);
    const title = tm ? plainInline(tm[1]) : name;
    const aliases = toList(fm.aliases);
    const tags = new Set(
      toList(fm.tags)
        .map((t) => t.replace(/^#/, ''))
        .filter(Boolean),
    );
    // Collect the #inline-tags written outside code blocks and add them to the note's tag Set.
    mapOutside(
      body,
      (c) => {
        c.replace(/(^|[\s(])#([A-Za-z][\w\/-]*)/g, (m, p, t) => {
          tags.add(t);
          return m;
        });
        return c;
      },
      false,
    );
    const n = {
      path: r.path,
      name,
      folder: parts.join('/'),
      fm,
      body,
      content: tm ? body.slice(tm[0].length) : body,
      raw: r.text,
      mtime: r.mtime || 0,
      title,
      aliases,
      tags,
      handle: r.handle || null,
    };
    n.lc = (title + '\n' + aliases.join(' ') + '\n' + [...tags].join(' ') + '\n' + body).toLowerCase();
    return n;
  }

  // Rebuilds every lookup table from a list of raw files. It is called after opening a folder,
  // after saving a note and after creating a note. Steps:
  //   1. make a note object for each file
  //   2. sort them (notes closest to the root first)
  //   3. fill byPath / byName / byAlias so links can be resolved
  //   4. find all [[links]] to build the backlinks ('What links here')
  //   5. group notes by tag and by folder
  function buildIndex(raws) {
    // Step 1 - one note object per file. (The next lines empty the old tables first.)
    S.notes = raws.map(makeNote);
    S.byPath.clear();
    S.byName.clear();
    S.byAlias.clear();
    S.back.clear();
    S.tags.clear();
    S.folders.clear();
    // Step 2 - shallow paths first, so when two notes share a name the one closest to the root wins.
    S.notes.sort(
      (a, b) => a.path.split('/').length - b.path.split('/').length || a.path.localeCompare(b.path),
    );
    // Step 3 - lookup tables. The first note found for a given name wins.
    for (const n of S.notes) {
      S.byPath.set(n.path.replace(/\.(md|markdown)$/i, '').toLowerCase(), n);
      if (!S.byName.has(n.name.toLowerCase())) S.byName.set(n.name.toLowerCase(), n);
      for (const a of n.aliases) if (!S.byAlias.has(a.toLowerCase())) S.byAlias.set(a.toLowerCase(), n);
    }
    // Steps 4 and 5 - for each note: backlinks, tags and folders.
    for (const n of S.notes) {
      // Find every [[target]] outside code; keep only the note name (before | and #), and record 'n links to
      // o'.
      nonCode(n.body).replace(/\[\[([^\]\n]+?)\]\]/g, (m, inner) => {
        const t = inner.split('|')[0].split('#')[0].trim();
        const o = t && resolve(t);
        if (o && o !== n) {
          if (!S.back.has(o.path)) S.back.set(o.path, new Set());
          S.back.get(o.path).add(n.path);
        }
        return m;
      });
      for (const t of n.tags) {
        if (!S.tags.has(t)) S.tags.set(t, []);
        S.tags.get(t).push(n);
      }
      // Register the note's folder and all its parent folders (ise/sub -> '', 'ise', 'ise/sub').
      const segs = n.folder ? n.folder.split('/') : [];
      for (let i = 0; i <= segs.length; i++) {
        const p = segs.slice(0, i).join('/');
        if (!S.folders.has(p)) S.folders.set(p, { path: p, name: segs[i - 1] || '', depth: i, notes: [] });
      }
      S.folders.get(n.folder).notes.push(n);
    }
  }

  // Finds the note a link points to. Tries, in this order: the full path, the file name, an alias,
  // and finally the last part of a path. Not case sensitive; '.md' is optional.
  // Returns the note, or null when it does not exist (the link then becomes a red link).
  function resolve(t) {
    t = String(t)
      .trim()
      .replace(/\.(md|markdown)$/i, '')
      .replace(/^\.?\//, '');
    const k = t.toLowerCase();
    return (
      S.byPath.get(k) ||
      S.byName.get(k) ||
      S.byAlias.get(k) ||
      (k.includes('/') ? S.byName.get(k.split('/').pop()) : null) ||
      null
    );
  }
  // Returns the note for a path like 'ise/my-note.md' (or null).
  const getNote = (p) =>
    S.byPath.get(
      String(p)
        .replace(/\.(md|markdown)$/i, '')
        .toLowerCase(),
    );

  // Finds the blob: URL of an image referenced in a note, or returns undefined.
  //   name : what the note says:  media/image1.png   ../media/image1.png   Pasted%20image.png   media\image1.png
  //   note : the note that contains the reference (images are looked up next to it first)
  // Lookup order (first hit wins):
  //   1. relative to the note's own folder   2. relative to the root of the opened folder
  //   3. by file name: the path that ends the same way, else an image in the note's folder, else the first one.
  // Handled: Windows backslashes, %20 and other URL encoding, ./ and ../, ?query and #hash, file:/// prefixes.
  // If images do not show, this is the function to look at (and 'What the note says' is visible in the
  // Source tab).
  function findAsset(name, note) {
    let n = String(name).trim().replace(/\\/g, '/');
    try {
      n = decodeURIComponent(n);
    } catch (e) {}
    n = n.replace(/[?#].*$/, '').replace(/^file:\/+/i, '');
    const clean = (p) => {
      const out = [];
      for (const seg of p.split('/')) {
        if (seg === '' || seg === '.') continue;
        if (seg === '..') out.pop();
        else out.push(seg);
      }
      return out.join('/');
    };
    const tries = [];
    if (note && note.folder) tries.push(clean(note.folder + '/' + n));
    tries.push(clean(n));
    for (const t of tries) if (S.assets.has(t.toLowerCase())) return S.assets.get(t.toLowerCase());
    const list = S.assetsByName.get(n.split('/').pop().toLowerCase());
    if (!list) return undefined;
    const want = '/' + clean(n).toLowerCase();
    let best = list.find((k) => '/' + k === want || ('/' + k).endsWith(want));
    if (!best && note) best = list.find((k) => k.slice(0, k.lastIndexOf('/')) === note.folder.toLowerCase());
    return S.assets.get(best || list[0]);
  }
  // Converts a size such as 6.5in, 15cm, 300 or 300px to pixels (96 px per inch). Returns 0 when it
  // cannot.
  function toPx(v) {
    const m = String(v || '').match(/([\d.]+)\s*(in|cm|mm|pt|px)?/i);
    if (!m) return 0;
    const k = { in: 96, cm: 37.8, mm: 3.78, pt: 1.333, px: 1 }[(m[2] || 'px').toLowerCase()];
    return Math.round(parseFloat(m[1]) * k) || 0;
  }

  // Decides the real address of an image: http(s) and data: addresses are used as they are; anything else is looked up
  // among the images of your folder (findAsset); file:/// addresses are the last resort. Returns '' when nothing works.
  function imgSrc(src, note) {
    if (/^(https?:|data:)/i.test(src)) return src;
    return findAsset(src, note) || (/^file:/i.test(src) ? src : '');
  }

  // THE ONE PLACE that builds an image: an <img> tag, or (when the image cannot be found) a red text
  // 'name (image not found: <what the note says>)'. Used by ![](...), ![[...]] and <img ...> alike.
  function imgHtml(src, alt, width, note) {
    const url = imgSrc(src, note);
    if (!url)
      return `<span class="wl new" title="${esc(src)}">${esc(alt || src)} (image not found: ${esc(src)})</span>`;
    return `<img src="${esc(url)}" alt="${esc(alt)}"${width ? ` width="${width}"` : ''}>`;
  }

  // Builds the address of a note: '#/n/<encoded path>'. With a heading id it adds '::<id>',
  // e.g. #/n/ise%2Fmy-note.md::symptom  (the router jumps to that heading).
  const noteHref = (n, slug) => '#/n/' + enc(n.path) + (slug ? '::' + enc(slug) : '');
  // Complete <a> link to a note, showing the note's title.
  const noteLink = (n) => `<a href="${noteHref(n)}">${esc(n.title)}</a>`;

  // =============================================================================
  // SECTION 4 - MARKDOWN: INLINE
  // 'Inline' means formatting inside a line of text: bold, italic, `code`, links, [[wikilinks]],
  // ![[embeds]], #tags. The entry point is inline(); wikilink(), embedHtml() and mdlink() build the links.
  // =============================================================================

  // Builds the HTML for  [[target]]  [[target|label]]  [[target#Heading]]  [[#Heading]]  and, with embed = true, ![[...]].
  //   - the note exists       -> normal blue link (class wl)
  //   - the note is missing   -> red link (classes wl new) that opens the 'does not exist yet' page
  function wikilink(embed, inner, ctx) {
    const bar = inner.indexOf('|');
    let target = bar >= 0 ? inner.slice(0, bar) : inner;
    const alias = bar >= 0 ? inner.slice(bar + 1) : null;
    let heading = '';
    const hi = target.indexOf('#');
    if (hi >= 0) {
      heading = target.slice(hi + 1);
      target = target.slice(0, hi);
    }
    target = target.trim();
    if (embed) return embedHtml(target, heading, alias, ctx);
    const note = target ? resolve(target) : ctx.note;
    const label = alias != null ? alias : target ? (heading ? target + ' > ' + heading : target) : heading;
    if (note)
      return `<a class="wl" href="${noteHref(note, heading ? slugify(heading) : '')}">${esc(label)}</a>`;
    return `<a class="wl new" href="#/missing/${enc(target)}" title="${esc(target)} (page does not exist)">${esc(label)}</a>`;
  }

  // Handles ![[...]]:
  //   - an image name       -> <img> (an optional |400 sets the width)
  //   - another file type   -> plain text (PDF etc. cannot be shown)
  //   - a note              -> its content inside a framed box; ![[note#Heading]] embeds only that section
  // Safety: at most 3 levels deep, and a note that is already being embedded is not embedded again
  // (prevents endless loops when two notes embed each other).
  function embedHtml(t, heading, alias, ctx) {
    if (/\.(png|jpe?g|gif|svg|webp|bmp)$/i.test(t)) {
      const w = alias && /^\d+/.test(alias) ? alias.match(/^\d+/)[0] : '';
      return imgHtml(t, t, w, ctx.note);
    }
    if (/\.\w{2,4}$/.test(t) && !/\.(md|markdown)$/i.test(t)) return `<span class="wl">${esc(t)}</span>`;
    const note = resolve(t);
    if (!note) return `<a class="wl new" href="#/missing/${enc(t)}">${esc(t)}</a>`;
    if (ctx.depth >= 3 || ctx.chain.includes(note.path))
      return `<a class="wl" href="${noteHref(note)}">${esc(t)}</a>`;
    let lines = note.content.split('\n');
    if (heading) lines = sectionOf(lines, heading);
    const sub = {
      note,
      depth: ctx.depth + 1,
      chain: ctx.chain.concat(note.path),
      headings: [],
      ids: {},
      idPrefix: 'e' + ++embedN + '-',
      tags: null,
    };
    return `<div class="embed"><div class="embed-h">${noteLink(note)}${heading ? ' &rsaquo; ' + esc(heading) : ''}</div>${blocks(lines, sub, false)}</div>`;
  }
  // Counter so each embedded note gets its own heading-id prefix (e1-, e2-...) and ids never clash.
  let embedN = 0;
  // Returns the lines under a given heading, up to the next heading of the same or higher level.
  function sectionOf(lines, heading) {
    const want = slugify(heading);
    let start = -1,
      lvl = 0;
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (!m) continue;
      if (start < 0) {
        if (slugify(m[2]) === want) {
          start = i + 1;
          lvl = m[1].length;
        }
      } else if (m[1].length <= lvl) return lines.slice(start, i);
    }
    return start < 0 ? [] : lines.slice(start);
  }

  // Handles standard Markdown links and images:  [text](url)  and  ![alt](file.png)
  //   - http(s)/mailto links open in a new tab
  //   - a link to another .md note becomes an internal link (red if that note does not exist)
  //   - an image is looked up among the images of the folder (see findAsset); attrs is the optional {width=...} text
  function mdlink(bang, text, url, ctx, attrs) {
    // Only web and e-mail links leave the wiki (no javascript:, data: or other schemes).
    const ext = /^(https?:|mailto:)/i.test(url);
    if (bang) {
      const wm = (attrs || '').match(/width\s*=\s*"?([^"\s}]+)/i);
      return imgHtml(url, text, wm ? toPx(wm[1]) : 0, ctx.note);
    }
    const label = inline(text || url, ctx);
    if (ext) return `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`;
    if (url[0] === '#') {
      return `<a href="${noteHref(ctx.note, slugify(decodeURI(url.slice(1))))}">${label}</a>`;
    }
    let u = url,
      slug = '';
    const hi = u.indexOf('#');
    if (hi >= 0) {
      slug = u.slice(hi + 1);
      u = u.slice(0, hi);
    }
    let note = null;
    try {
      note = resolve(decodeURI(u));
    } catch (e) {}
    if (note) return `<a href="${noteHref(note, slug ? slugify(decodeURI(slug)) : '')}">${label}</a>`;
    return `<a class="new" href="#/missing/${enc(u)}">${label}</a>`;
  }

  // Reads a raw HTML tag  <img src="..." alt="..." width="400" style="width:6.5in">  and builds the image with imgHtml().
  // The width comes from the width attribute or from a width: rule in the style attribute.
  function htmlImg(tag, ctx) {
    const attr = (n) => {
      const m = tag.match(new RegExp('\\b' + n + '\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\'|([^\\s>]+))', 'i'));
      return m ? (m[1] ?? m[2] ?? m[3] ?? '') : '';
    };
    const sm = tag.match(/width\s*:\s*([\d.]+\s*(?:in|cm|mm|pt|px)?)/i);
    const w = toPx(attr('width')) || (sm ? toPx(sm[1]) : 0);
    return imgHtml(attr('src'), attr('alt'), w, ctx.note);
  }

  // Converts ONE piece of Markdown text (a paragraph, a heading, a table cell...) to HTML.
  //
  // THE PLACEHOLDER TRICK - the key idea to understand this function:
  //   Some parts must be protected from the bold/italic rules (code, links, URLs with _ in them).
  //   So we first replace each of them with a small token made of the NUL character (\u0000),
  //   a number and another NUL, and keep the finished HTML in the array ph. At the end the tokens
  //   are swapped back for their HTML. The order of the steps below therefore matters.
  function inline(s, ctx) {
    // ph = the protected HTML pieces. put(html) stores one and returns its token.
    const ph = [];
    const put = (h) => {
      ph.push(h);
      return '\u0000' + (ph.length - 1) + '\u0000';
    };
    // 1. Remove block ids such as  ^my-id  at the end of a line (Obsidian feature we do not use).
    s = s.replace(/\s\^[A-Za-z0-9-]+$/gm, '');
    // 2. `inline code` -> <code>, protected so nothing inside it is formatted.
    //    A dice expression alone in backticks (`2d8+1d10`) becomes a clickable dice link (section 9C).
    s = s.replace(/(`+)(.+?)\1(?!`)/g, (m, a, b) => {
      const code = '<code>' + esc(b.trim()) + '</code>';
      return put(DICE_CODE.test(b.trim()) ? diceLink(b.trim(), code) : code);
    });
    // 3a. Raw HTML image tags  <img src="..." width="400">  (produced by some OneNote/Word converters) ->
    // protected HTML from htmlImg().
    s = s.replace(/<img\b[^>]*>/gi, (tag) => put(htmlImg(tag, ctx)));
    // 3b. [[wikilinks]] and ![[embeds]] -> protected HTML from wikilink().
    s = s.replace(/(!?)\[\[([^\]\n]+?)\]\]/g, (m, bang, inner) => put(wikilink(!!bang, inner, ctx)));

    // 4. [text](url) links and ![alt](image) -> protected HTML from mdlink(). The address may be written plainly,
    //    between < > (needed when the path contains spaces), or with spaces when it ends in an image extension.
    //    An optional {width="5in"} right after an image (Pandoc style) sets its width.
    s = s.replace(
      /(!?)\[([^\]\n]*)\]\((?:<([^>\n]+)>|([^)\s]+)|([^()\n]+?\.(?:png|jpe?g|gif|svg|webp|bmp)))(?:\s+"[^"]*")?\)(?:\{([^}\n]*)\})?/gi,
      (m, bang, text, u1, u2, u3, attrs) => put(mdlink(!!bang, text, u1 || u2 || u3, ctx, attrs)),
    );
    // 5. <https://...> links and, just after, bare https://... addresses -> clickable links (protected).
    s = s.replace(/<(https?:\/\/[^>\s]+)>/g, (m, u) =>
      put(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`),
    );
    s = s.replace(
      /(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g,
      (m, pre, u) => pre + put(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`),
    );
    // 6. Everything that is left is plain text: escape < > & " so it is safe. Tokens are untouched.
    s = esc(s);
    // 7. #tags -> link to the tag page (and the tag is remembered in ctx.tags).
    s = s.replace(/(^|[\s(])#([A-Za-z][\w\/-]*)/g, (m, pre, t) => {
      if (ctx && ctx.tags) ctx.tags.add(t);
      return pre + put(`<a class="tag" href="#/t/${enc(t)}">#${t}</a>`);
    });
    // 7b. Dice written in the text (3d6, d20, 1d8+2) -> clickable dice links (section 9C).
    s = s.replace(DICE_IN_TEXT, (m, pre, d) => pre + put(diceLink(d, d)));
    // 7c. Stat blocks: 'Attack Roll: +14' (2024) and '+14 to hit' (2014) roll d20+14, '(Recharge 5-6)' rolls
    //     a d6 (section 9F).
    s = s.replace(/(Attack Roll:\*?\s+)([+\-\u2212]\d{1,2})(?=[,\s])/g, (m, pre, b) =>
      pre + put(diceLink('d20' + b.replace('\u2212', '-') + ' # attack', b)),
    );
    s = s.replace(/(^|[\s(])([+\-\u2212]\d{1,2})(?= to hit)/g, (m, pre, b) =>
      pre + put(diceLink('d20' + b.replace('\u2212', '-') + ' # to hit', b)),
    );
    s = s.replace(/\(Recharge (\d)(?:[\u2013\-](\d))?\)/g, (m, a, b) =>
      put(diceLink('1d6 # Recharge ' + a + (b ? '\u2013' + b : ''), m)),
    );

    // 8. Bold / italic / strike / highlight. THE ORDER MATTERS: *** (bold+italic) must be tested before ** (bold),
    //    and ** before * (italic). The (?=\S) and (?<=\S) pieces mean 'no space right after the opening mark or
    //    right before the closing mark', which avoids false matches such as '2 * 3 * 4'. Each rule works on a single line.
    //      ***text***  **text**  __text__  *text*  _text_  ~~text~~  ==text==
    //    To add your own inline syntax, add another .replace(...) line to this chain.
    s = s
      .replace(/\*\*\*(?=\S)([^\n]+?)(?<=\S)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(?=\S)([^\n]+?)(?<=\S)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w])__(?=\S)([^\n]+?)(?<=\S)__(?!\w)/g, '$1<strong>$2</strong>')
      .replace(/\*(?=[^\s*])([^*\n]+?)(?<=[^\s*])\*/g, '<em>$1</em>')
      .replace(/(^|[^\w])_(?=[^\s_])([^_\n]+?)(?<=[^\s_])_(?!\w)/g, '$1<em>$2</em>')
      .replace(/~~(?=\S)([^\n]+?)(?<=\S)~~/g, '<del>$1</del>')
      .replace(/==(?=\S)([^\n]+?)(?<=\S)==/g, '<mark>$1</mark>');
    // 9. A single line break in a paragraph becomes <br> (like Obsidian).
    s = s.replace(/\n/g, '<br>');
    // 10. Swap every token back for its protected HTML and return the result.
    return s.replace(/\u0000(\d+)\u0000/g, (m, i) => ph[+i]);
  }

  // =============================================================================
  // SECTION 5 - MARKDOWN: BLOCKS
  // 'Blocks' are the big pieces of a note: headings, paragraphs, lists, tables, quotes, callouts, code.
  // blocks() reads the lines of a note from top to bottom, recognises which kind of block starts on each
  // line, builds its HTML, and calls inline() for the text inside.
  //
  // The 'ctx' (context) object that is passed to blocks() and inline():
  //   note       the note being drawn (needed to resolve [[#heading]] links)
  //   depth      how many embedded notes deep we are (maximum 3)
  //   chain      paths of the notes currently being embedded (stops endless loops)
  //   headings   headings found, for the table of contents
  //   ids        counters that make heading ids unique
  //   idPrefix   prefix for heading ids inside embedded notes
  //   tags       Set that collects the #tags met while drawing (or null)
  //   tocMarked  true once the 'Contents' box position has been marked
  // =============================================================================

  // CALLOUT TYPES:   type name -> [color name, icon character]
  // The type is what you write in the note:  > [!warning] Title.
  // The color name must exist in the CSS as .co-<color> (blue is the default color).
  // TO ADD A TYPE:  add a line such as   idea: ['teal', '\u2605'],   and it works right away.
  // Unknown types fall back to 'note' (blue).
  const CO = {
    note: ['blue', '\u270E'],
    info: ['blue', 'i'],
    todo: ['blue', '\u2713'],
    abstract: ['teal', '\u2261'],
    summary: ['teal', '\u2261'],
    tldr: ['teal', '\u2261'],
    tip: ['teal', '\u2605'],
    hint: ['teal', '\u2605'],
    important: ['teal', '!'],
    success: ['green', '\u2713'],
    check: ['green', '\u2713'],
    done: ['green', '\u2713'],
    question: ['yellow', '?'],
    help: ['yellow', '?'],
    faq: ['yellow', '?'],
    warning: ['orange', '!'],
    caution: ['orange', '!'],
    attention: ['orange', '!'],
    failure: ['red', '\u2715'],
    fail: ['red', '\u2715'],
    missing: ['red', '\u2715'],
    danger: ['red', '!'],
    error: ['red', '!'],
    bug: ['red', '\u25CF'],
    example: ['purple', '\u2261'],
    player: ['player', '\u2709'], // player notes: see section 9E
    quote: ['gray', '\u201C'],
    cite: ['gray', '\u201C'],
  };

  // Regular expression recognising a list item line:  '- text'  '* text'  '+ text'  '1. text'  '1) text'.
  // Groups: 1 = indentation, 2 = the bullet or number, 3 = the text.
  const LI = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
  // True when a line is the separator row of a table:  |---|:---:|---:|
  const isSep = (l) => l != null && l.includes('|') && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);
  // Number of spaces at the start of a line (a tab counts as 4).
  const indentOf = (l) => l.match(/^\s*/)[0].replace(/\t/g, '    ').length;

  // Splits a table row into cells:  | a | b |  ->  ['a', 'b'].
  // An escaped pipe (\|) stays inside its cell, which is how you write [[note\|alias]] in a table.
  function splitRow(l) {
    l = l.trim();
    if (l[0] === '|') l = l.slice(1);
    if (l.endsWith('|') && !l.endsWith('\\|')) l = l.slice(0, -1);
    return l.split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
  }
  // True if this line starts a new block (so the paragraph above must stop before it).
  function blockStart(l, next) {
    return (
      /^\s{0,3}(`{3,}|~{3,})/.test(l) ||
      /^\s{0,3}#{1,6}\s/.test(l) ||
      /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l) ||
      /^\s{0,3}>/.test(l) ||
      /^\s*([-*+]|1[.)])\s+/.test(l) ||
      (l.includes('|') && isSep(next))
    );
  }
  // HTML of a code block: header bar with the language and a Copy button, then the code (escaped).
  function codeBlock(code, lang) {
    return `<div class="code"><div class="code-h"><span>${esc(lang || 'text')}</span><button type="button" class="copy">Copy</button></div><pre><code>${esc(code)}</code></pre></div>`;
  }

  // Builds a callout from a quote block whose first line looks like  [!type]  or  [!type]-  or  [!type]+
  //   cm   = the regex match of that first line (cm[1] type, cm[2] fold sign, cm[3] title text)
  //   rest = the remaining lines (the callout content, drawn with blocks() again)
  // '-' = foldable and collapsed, '+' = foldable and open. Foldable callouts use the <details> element.
  function callout(cm, rest, ctx) {
    const type = cm[1].toLowerCase(),
      fold = cm[2];
    const def = CO[type] || CO.note;
    const title = cm[3].trim() || type.charAt(0).toUpperCase() + type.slice(1);
    // Player notes (section 9E): a key, a clickable title (given / not given), and a label for the list.
    let attrs = '',
      given = '',
      isPlayer = false;
    if (type === 'player') {
      const k = playerKey(ctx.note, cm[3].trim() || rest.join(' ').slice(0, 40));
      const label = cm[3].trim()
        ? plainInline(cm[3])
        : plainInline(rest.join(' ').replace(/\s+/g, ' ')).slice(0, 70) || 'Player note';
      attrs = ` data-pkey="${esc(k)}" data-plabel="${esc(label)}"`;
      if (playerIsGiven(k)) given = ' given';
      isPlayer = true;
    }
    const head = `<span class="ci">${def[1]}</span>${
      isPlayer
        ? `<span class="pl-t" title="Click: given to the players / not given">${inline(title, ctx)}</span>`
        : `<span>${inline(title, ctx)}</span>`
    }`;
    const body = rest.some((l) => l.trim()) ? `<div class="cbody">${blocks(rest, ctx)}</div>` : '';
    if (fold)
      return `<details class="callout co-${def[0]}${given}"${attrs}${fold === '+' ? ' open' : ''}><summary>${head}</summary>${body}</details>`;
    return `<div class="callout co-${def[0]}${given}"${attrs}><div class="ctitle">${head}</div>${body}</div>`;
  }

  // Reads a bullet / numbered / task list that starts at line i. Returns [html, index of the next line].
  // Nested lists work by recursion: the lines of an item that are indented deeper are collected,
  // un-indented, and given back to blocks(), which finds the sub-list.
  function list(lines, i, ctx) {
    const first = lines[i].match(LI);
    const base = indentOf(lines[i]);
    const ordered = /\d/.test(first[2]);
    const start = ordered ? parseInt(first[2], 10) : 1;
    const items = [];
    const n = lines.length;
    while (i < n) {
      const m = lines[i].match(LI);
      if (!m || indentOf(lines[i]) !== base || /\d/.test(m[2]) !== ordered) break;
      // kids = the lines that belong to this item: deeper indented lines, and blank lines followed by deeper
      // lines.
      const kids = [];
      i++;
      while (i < n) {
        const l = lines[i];
        if (/^\s*$/.test(l)) {
          let j = i;
          while (j < n && /^\s*$/.test(lines[j])) j++;
          if (j < n && indentOf(lines[j]) > base) {
            kids.push('');
            i++;
            continue;
          }
          break;
        }
        if (indentOf(l) > base) {
          kids.push(l);
          i++;
          continue;
        }
        break;
      }
      // Remove the common indentation of the kids so the sub-list starts at column 0 when blocks() reads it
      // again.
      let cut = Infinity;
      for (const k of kids) if (k.trim()) cut = Math.min(cut, indentOf(k));
      if (cut === Infinity) cut = 0;
      const body = [m[3]].concat(
        kids.map((k) => {
          let c = 0,
            x = 0;
          while (x < k.length && c < cut && (k[x] === ' ' || k[x] === '\t')) {
            c += k[x] === '\t' ? 4 : 1;
            x++;
          }
          return k.slice(x);
        }),
      );
      items.push(body);
      let j = i;
      while (j < n && /^\s*$/.test(lines[j])) j++;
      if (j > i && j < n) {
        const mm = lines[j].match(LI);
        if (mm && indentOf(lines[j]) === base && /\d/.test(mm[2]) === ordered) i = j;
      }
    }
    // Build <ul> or <ol>. An item that starts with [ ] or [x] becomes a task item with a (display-only)
    // checkbox.
    const tag = ordered ? 'ol' : 'ul';
    const li = items
      .map((b) => {
        const t = b[0].match(/^\[([ xX])\]\s+(.*)$/);
        if (t) {
          b = [t[2]].concat(b.slice(1));
          return `<li class="task"><input type="checkbox" disabled${t[1] !== ' ' ? ' checked' : ''}>${blocks(b, ctx)}</li>`;
        }
        return `<li>${blocks(b, ctx)}</li>`;
      })
      .join('');
    return [`<${tag}${ordered && start !== 1 ? ` start="${start}"` : ''}>${li}</${tag}>`, i];
  }

  // THE MAIN MARKDOWN FUNCTION. Turns an array of lines into HTML.
  //   lines : the Markdown lines
  //   ctx   : see the ctx description at the top of this section
  //   top   : true only for the top level of a real page; it records the headings for the table of contents.
  // Each turn of the loop looks at line i, decides what block starts there, builds it, moves i forward and
  // does 'continue'. The order of the checks matters: code fence, heading, ---, quote/callout, table, list,
  // and finally a plain paragraph.
  // TO ADD A NEW BLOCK TYPE: add another  if (...) { ...; continue; }  above the paragraph code at the end.
  function blocks(lines, ctx, top) {
    const out = [];
    let i = 0;
    const n = lines.length;
    while (i < n) {
      // Blank lines only separate blocks: skip them (next line).
      const line = lines[i];
      if (/^\s*$/.test(line)) {
        i++;
        continue;
      }
      // CODE BLOCK: ``` or ~~~ opens it; everything up to the matching closing fence is code (not parsed as
      // Markdown).
      let m = line.match(/^\s{0,3}(`{3,}|~{3,})\s*([^\s`]*)/);
      if (m) {
        const f = m[1],
          lang = m[2] || '';
        i++;
        const code = [];
        const close = new RegExp('^\\s*' + f[0] + '{' + f.length + ',}\\s*$');
        while (i < n && !close.test(lines[i])) {
          code.push(lines[i]);
          i++;
        }
        i++;
        out.push(codeBlock(code.join('\n'), lang));
        continue;
      }

      // HEADING (# to ######). Makes a unique id (used by the table of contents and #note::heading links).
      // The first heading of the page also drops the marker where the Contents box will go.
      m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (m) {
        const level = m[1].length,
          text = m[2];
        const base = (ctx.idPrefix || '') + (slugify(text) || 'section');
        ctx.ids[base] = (ctx.ids[base] || 0) + 1;
        const id = ctx.ids[base] > 1 ? base + '-' + (ctx.ids[base] - 1) : base;
        if (top && !ctx.tocMarked) {
          out.push('\u0001TOC\u0001');
          ctx.tocMarked = true;
        }
        if (top) ctx.headings.push({ level, text: plainInline(text), id });
        out.push(`<h${level} id="${esc(id)}">${inline(text, ctx)}</h${level}>`);
        i++;
        continue;
      }
      // HORIZONTAL RULE: --- or *** or ___
      if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) {
        out.push('<hr>');
        i++;
        continue;
      }
      // QUOTE or CALLOUT: collect all consecutive lines that start with >, remove the >, then decide which
      // one it is.
      if (/^\s{0,3}>/.test(line)) {
        const q = [];
        while (i < n && /^\s{0,3}>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s{0,3}>[ ]?/, ''));
          i++;
        }
        const cm = q[0].match(/^\[!([\w-]+)\]([+-])?[ \t]*(.*)$/);
        out.push(cm ? callout(cm, q.slice(1), ctx) : '<blockquote>' + blocks(q, ctx) + '</blockquote>');
        continue;
      }
      // TABLE: a line with | followed by a separator row. Then read rows until a blank line. Column
      // alignment comes from the : in the separator row.
      if (line.includes('|') && isSep(lines[i + 1])) {
        const head = splitRow(line);
        const al = splitRow(lines[i + 1]).map((c) => {
          const l = c[0] === ':',
            r = c.endsWith(':');
          return l && r ? 'center' : r ? 'right' : l ? 'left' : '';
        });
        i += 2;
        const rows = [];
        while (i < n && lines[i].includes('|') && !/^\s*$/.test(lines[i])) {
          rows.push(splitRow(lines[i]));
          i++;
        }
        const cell = (t, c, k) =>
          `<${t}${al[c] ? ` style="text-align:${al[c]}"` : ''}>${inline(k || '', ctx)}</${t}>`;
        out.push(
          `<table class="md"><thead><tr>${head.map((h, c) => cell('th', c, h)).join('')}</tr></thead><tbody>${rows.map((r) => '<tr>' + head.map((h, c) => cell('td', c, r[c])).join('') + '</tr>').join('')}</tbody></table>`,
        );
        continue;
      }
      // LIST: hand over to list(), which returns the HTML and the index of the line after the list.
      if (LI.test(line)) {
        const [h, ni] = list(lines, i, ctx);
        out.push(h);
        i = ni;
        continue;
      }

      // PARAGRAPH (default): gather lines until a blank line or the start of another block.
      // A paragraph that contains only an ![[embed]] is not wrapped in <p> (a box inside <p> would be invalid HTML).
      const p = [line];
      i++;
      while (i < n && !/^\s*$/.test(lines[i]) && !blockStart(lines[i], lines[i + 1])) {
        p.push(lines[i]);
        i++;
      }
      const txt = p.join('\n').trim();
      out.push(/^!\[\[[^\]\n]+\]\]$/.test(txt) ? inline(txt, ctx) : '<p>' + inline(txt, ctx) + '</p>');
    }
    return out.join('\n');
  }
  // Builds the 'Contents' box with numbering (1, 1.1, 1.2...). Only shown when the note has at least 3
  // headings; levels deeper than 3 are skipped.
  function tocHtml(hs) {
    if (hs.length < 3) return '';
    const minL = Math.min(...hs.map((h) => h.level));
    const cnt = [0, 0, 0, 0, 0, 0];
    const rows = [];
    for (const h of hs) {
      const d = h.level - minL;
      if (d > 2) continue;
      cnt[d]++;
      for (let k = d + 1; k < 6; k++) cnt[k] = 0;
      rows.push(
        `<div style="padding-left:${d * 1.3}em"><a href="${'#/n/' + enc(S.path) + '::' + enc(h.id)}"><span class="n">${cnt.slice(0, d + 1).join('.')}</span>${esc(h.text)}</a></div>`,
      );
    }
    return `<div class="toc"><b>Contents</b>${rows.join('')}</div>`;
  }

  // =============================================================================
  // SECTION 6 - VIEWS
  // A 'view' is a function that draws one kind of page by building an HTML string and passing it to
  // setContent(). The router (section 10) decides which view to call from the address in the browser bar.
  // =============================================================================
  // Capitalise the first letter ('platform' -> 'Platform'). Used for infobox labels.
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // Puts HTML into the main area (#content), wrapped in the white .paper sheet.
  // Every view ends with a call to this function.
  function setContent(html) {
    $('#content').innerHTML = `<div class="paper">${html}</div>`;
    // The player notes icon in the header follows the page being shown (section 9E).
    plOpen = false;
    renderPlayerBtn();
    // The pin panel stays; it is redrawn in case the notes changed (section 9F).
    renderPin();
  }
  // Alphabetical list of notes grouped by first letter (in columns). With withDate = true it shows one
  // line per note with the modified date instead.
  function listHtml(notes, withDate) {
    if (withDate)
      return (
        '<div>' +
        notes
          .map(
            (n) =>
              `<div>${noteLink(n)} <span class="sub" style="margin:0">&middot; ${esc(fmtDate(n.mtime))}${n.folder ? ' &middot; ' + esc(n.folder) : ''}</span></div>`,
          )
          .join('') +
        '</div>'
      );
    const sorted = [...notes].sort((a, b) => a.title.localeCompare(b.title));
    let cur = '',
      h = '';
    for (const n of sorted) {
      const L = n.title.charAt(0).toUpperCase();
      if (L !== cur) {
        cur = L;
        h += `<div class="letter">${esc(L)}</div>`;
      }
      h += noteLink(n);
    }
    return `<div class="cols">${h}</div>`;
  }
  // Generic list page (All pages, a folder, a tag): title, small subtitle, and the list of notes.
  function viewList(title, sub, notes, withDate) {
    setContent(
      `<h1 class="title">${esc(title)}</h1><div class="sub">${sub}</div><div class="body">${notes.length ? listHtml(notes, withDate) : '<p>No pages here yet.</p>'}</div>`,
    );
  }
  // First screen, shown until a folder has been opened.
  function viewWelcome() {
    setContent(`<div class="hero"><h1>${esc(SITE_NAME)}</h1><p>Your campaign notes, ready at the table. Everything stays on your computer: nothing is uploaded.</p>
  <p><button type="button" class="btn primary" data-act="open">Open my campaign folder</button> <button type="button" class="btn" data-act="demo">Try the example campaign</button></p>
  <p style="font-size:14px">The example campaign (a chapter, 341 monsters of the 2024 SRD) opens read-only from GitHub. <a href="${esc(DOWNLOAD_URL)}" target="_blank" rel="noopener">Download everything</a> to use it offline and make it your own.</p>
  <p style="font-size:13px">Tip: choose the folder that holds your <code>.md</code> files (your Obsidian vault works). Reading works in Chrome, Edge and Firefox; saving edits straight to your files needs Chrome or Edge. Hidden folders such as <code>.obsidian</code> are skipped.</p></div>`);
  }

  // Home page. If a note called 'Main Page', 'Home' or 'index' exists, that note is shown instead
  // (location.replace swaps the address without adding a history entry).
  // Otherwise: folder list and the most used tags.
  function viewHome() {
    const home = S.byName.get('main page') || S.byName.get('home') || S.byName.get('index');
    if (home) {
      location.replace(noteHref(home));
      return;
    }
    const folders = [...S.folders.values()]
      .filter((f) => f.path !== '')
      .sort((a, b) => a.path.localeCompare(b.path));
    const tags = [...S.tags.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 30);
    setContent(`<h1 class="title">Welcome to ${esc(SITE_NAME)}</h1><div class="sub">${S.notes.length} pages &middot; ${folders.length} folders &middot; ${S.tags.size} tags</div>
  <div class="grid"><div class="box"><h2>Browse by folder</h2><div class="cols">${folders.map((f) => `<a href="#/f/${enc(f.path)}" style="padding-left:${(f.depth - 1) * 14}px">${esc(f.name)} <span class="sub" style="margin:0">(${f.notes.length})</span></a>`).join('') || '<p>No folders.</p>'}</div></div></div>
  <div class="box"><h2>Tags</h2><div class="tagcloud">${tags.map(([t, l]) => `<a class="tag" href="#/t/${enc(t)}">#${esc(t)} ${l.length}</a>`).join('') || '<p>No tags yet.</p>'}</div></div>`);
  }
  // The Note / Edit / Source tabs. 'on' says which one is active. A dot after Edit means unsaved draft.
  const tabs = (n, on) =>
    `<div class="tabs"><a class="${on === 'n' ? 'on' : ''}" href="${noteHref(n)}">Note</a><a class="${on === 'edit' ? 'on' : ''}" href="#/edit/${enc(n.path)}">Edit${S.drafts.has(n.path) ? ' &bull;' : ''}</a><a class="${on === 'src' ? 'on' : ''}" href="#/src/${enc(n.path)}">Source</a>${on === 'n' ? `<button type="button" class="pin-btn" data-act="pin-this" title="Pin this note in the side panel">${PIN_ICON} Pin</button>` : ''}</div>`;

  // Renders a note's content to HTML: infobox (from the properties) + the Markdown body.
  // Returns { html, tags }. Used by the Note page and by the live preview in the editor
  // (opts.toc === false removes the Contents box in the preview).
  function renderBody(note, opts) {
    plSeen = {}; // player notes numbering starts again for each page (section 9E)
    const ctx = {
      note,
      depth: 0,
      chain: [note.path],
      headings: [],
      ids: {},
      idPrefix: (opts && opts.idPrefix) || '',
      tags: new Set(note.tags),
      tocMarked: false,
    };
    // Convert the Markdown to HTML (top = true so the headings are recorded).
    let html = blocks(note.content.split('\n'), ctx, true);
    // Put the Contents box where the marker was left (or remove the marker).
    html = html.replace('\u0001TOC\u0001', opts && opts.toc === false ? '' : tocHtml(ctx.headings));
    const rows = [];
    // INFOBOX: one row per property of the note.
    for (const [k, v] of Object.entries(note.fm)) {
      // Properties that are NOT shown in the infobox. Add names to this list to hide more of them.
      // 'image' is shown as a picture at the top of the infobox instead of a row (see below).
      if (['tags', 'aliases', 'cssclasses', 'cssclass', 'publish', 'image'].includes(k.toLowerCase())) continue;
      const val = Array.isArray(v) ? v.join(', ') : String(v);
      if (!val) continue;
      rows.push(
        `<tr><th>${esc(cap(k.replace(/[_-]/g, ' ')))}</th><td>${inline(val, { note, tags: null })}</td></tr>`,
      );
    }
    // Monster notes show a stat block instead of the infobox (section 9F).
    const info =
      noteType(note) === 'monster'
        ? statBlockHtml(note)
        : rows.length
          ? `<table class="infobox"><caption>${esc(note.title)}</caption>${
              noteImage(note)
                ? `<tr><td colspan="2" class="ibx-img">${noteImage(note).url ? `<img src="${esc(noteImage(note).url)}" alt="${esc(note.title)}">` : imgHtml(noteImage(note).name, note.title, 0, note)}</td></tr>`
                : ''
            }${rows.join('')}</table>`
          : '';
    return { html: info + html, tags: [...ctx.tags].sort() };
  }
  // The normal note page: tabs, title, infobox + content, footer (folder and tags), and 'What links
  // here'.
  function viewNote(note, slug) {

    const cats = `<div class="cats"><b>Folder:</b> <a href="#/f/${enc(note.folder)}">${esc(note.folder || '(root)')}</a>${tags.length ? `<span class="sep">|</span><b>Tags:</b> ` + tags.map((t) => `<a href="#/t/${enc(t)}">${esc(t)}</a>`).join('<span class="sep">&middot;</span>') : ''}</div>`;
    const bl = [...(S.back.get(note.path) || [])]
      .map(getNote)
      .filter(Boolean)
      .sort((a, b) => a.title.localeCompare(b.title));
    const back = bl.length
      ? `<div class="back"><h2>What links here</h2>${bl.map((n) => `<div>${noteLink(n)}</div>`).join('')}</div>`
      : '';
    setContent(`${tabs(note, 'n')}<h1 class="title">${esc(note.title)}</h1><div class="sub">From your notes &middot; ${esc(note.path)}${note.mtime ? ' &middot; last modified ' + esc(fmtDate(note.mtime)) : ''}</div>
   <div class="body article${noteType(note) === 'monster' ? ' sb-page' : ''}">${r.html}</div>${cats}${back}`);
  }
  // The Source tab: the raw Markdown of the note in a code block (with a Copy button).
  function viewSource(note) {
    S.path = note.path;
    setContent(
      `${tabs(note, 'src')}<h1 class="title">${esc(note.title)}</h1><div class="sub">Raw Markdown &middot; ${esc(note.path)}</div><div class="body">${codeBlock(note.raw, 'markdown')}</div>`,
    );

  // =============================================================================
  // SECTION 7 - EDITING, SAVING AND NEW NOTES
  // Chrome and Edge can write to your folder (File System Access API). Other browsers cannot, so
  // 'saving' there downloads the file instead. Saving always does this:
  //   writes the file -> replaces the note in memory -> rebuilds the index (buildIndex).
  // =============================================================================

  // Makes sure we may write to a file/folder. The first time, the browser shows a permission popup.
  // Must be called from a click handler (browsers require a user action for that popup).
  // Returns true when allowed.
  async function ensureWrite(h) {
    if (!h.queryPermission) return true;
    let p = await h.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') p = await h.requestPermission({ mode: 'readwrite' });
    return p === 'granted';
  }
  // Fallback for browsers that cannot write files: creates a temporary link to the text and clicks it,
  // so the browser downloads the file.
  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 500);
  }
  // Turns the current notes back into 'raw file' objects, so buildIndex() can be run again after a
  // change.
  const rawsOf = () => S.notes.map((n) => ({ path: n.path, text: n.raw, mtime: n.mtime, handle: n.handle }));

  // Saves the edited text of a note. Returns 'disk' (written into your folder) or 'download' (browser cannot write).
  // Throws an error if permission is refused; the editor shows that message.
  async function saveNote(note, text) {
    // Keep the file's original line endings: if it used Windows (\r\n), write it back the same way.
    const out = note.raw.includes('\r\n') ? text.replace(/\r?\n/g, '\r\n') : text;
    let mode;
    // Chrome/Edge: write straight into the file. createWritable() + write() + close().
    if (note.handle) {
      if (!(await ensureWrite(note.handle))) throw new Error('write permission was denied');
      const w = await note.handle.createWritable();
      await w.write(out);
      await w.close();
      mode = 'disk';
    } else {
      download(note.name + '.md', out);
      mode = 'download';
    }
    // Replace the note's text in memory and rebuild the index, so search, links and backlinks are up to
    // date without reloading.
    const raws = rawsOf().map((r) =>
      r.path === note.path ? { path: r.path, text: out, mtime: Date.now(), handle: r.handle } : r,
    );
    buildIndex(raws);
    renderSide();
    S.drafts.delete(note.path);
    return mode;
  }

  // Fills the variables of a template note when a new note is created:
  //   {{title}}   the new note's name
  //   {{date}}    today, as YYYY-MM-DD        {{date:DD/MM/YYYY}}  any layout using YYYY MM DD HH mm
  //   {{time}}    the current time as HH:mm   {{time:HH:mm}}
  // These are the same variables as Obsidian's core Templates plugin.
  function fillTemplate(t, title) {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (f) =>
      f
        .replace(/YYYY/g, d.getFullYear())
        .replace(/MM/g, pad(d.getMonth() + 1))
        .replace(/DD/g, pad(d.getDate()))
        .replace(/HH/g, pad(d.getHours()))
        .replace(/mm/g, pad(d.getMinutes()));
    return t
      .replace(/\{\{\s*title\s*\}\}/g, title)
      .replace(/\{\{\s*date(?::([^}]+))?\s*\}\}/g, (m, f) => fmt(f || 'YYYY-MM-DD'))
      .replace(/\{\{\s*time(?::([^}]+))?\s*\}\}/g, (m, f) => fmt(f || 'HH:mm'));
  }

  // Creates a new note file. name = title typed by the user, folder = destination folder ('' = root),
  // tplPath = path of the template note (or '' for a blank note). Returns the new note's path.
  // Characters that are not allowed in file names ( \ / : * ? " < > | ) are replaced by '-'.
  // Missing sub-folders are created. Then the index is rebuilt.
  async function createNote(name, folder, tplPath) {
    name = name
      .trim()
      .replace(/\.(md|markdown)$/i, '')
      .replace(/[\\/:*?"<>|]/g, '-');
    if (!name) throw new Error('enter a name for the note');
    const path = (folder ? folder + '/' : '') + name + '.md';
    if (getNote(path)) throw new Error('a note with this name already exists in that folder');
    const tpl = tplPath && getNote(tplPath) ? getNote(tplPath).raw.replace(/\r\n?/g, '\n') : '';
    const text = tpl
      ? fillTemplate(tpl, name)
      : `---\ndate: ${fillTemplate('{{date}}', '')}\ntags: []\n---\n\n# ${name}\n\n`;
    let handle = null;
    if (S.handle) {
      if (!(await ensureWrite(S.handle))) throw new Error('write permission was denied');
      let dir = S.handle;
      for (const seg of folder ? folder.split('/') : [])
        dir = await dir.getDirectoryHandle(seg, { create: true });
      handle = await dir.getFileHandle(name + '.md', { create: true });
      const w = await handle.createWritable();
      await w.write(text);
      await w.close();
    } else download(name + '.md', text);
    buildIndex(rawsOf().concat([{ path, text, mtime: Date.now(), handle }]));
    renderSide();
    return path;
  }

  // THE EDITOR PAGE. Left: a text area with the raw Markdown. Right: a live preview.
  //   - While you type, the text is kept in S.drafts (so it survives if you click another page).
  //   - The preview is redrawn 250 ms after you stop typing (it renders a temporary note with makeNote()).
  //   - Ctrl+S or the Save button call saveNote().
  function viewEdit(note) {
    S.path = note.path;
    const path = note.path;
    const canWrite = !!note.handle;
    // The example campaign (S.demo) is read-only: its Save button opens the GitHub download page instead.
    setContent(`${tabs(note, 'edit')}<h1 class="title">${esc(note.title)}</h1><div class="sub">Editing ${esc(path)}</div>
   <div class="toolbar">${
     S.demo
       ? `<a class="btn primary" id="saveBtn" href="${esc(DOWNLOAD_URL)}" target="_blank" rel="noopener">Download on GitHub</a>`
       : '<button type="button" class="btn primary" id="saveBtn">Save</button><span class="hint">Ctrl+S</span>'
   }<span id="est"></span><a href="${noteHref(note)}">Close editor</a></div>
   ${
     S.demo
       ? '<div class="hint" style="margin-bottom:8px">This is the example campaign: it is read-only. Try any change here (the preview follows), then download the campaign from GitHub to keep your own copy and edit it for real.</div>'
       : canWrite
         ? ''
         : '<div class="hint" style="margin-bottom:8px">This browser cannot write to your folder (use Chrome or Edge for that). Save will download the file so you can replace the original.</div>'
   }
   <div class="edit-grid"><textarea id="ed" spellcheck="false" aria-label="Markdown editor"></textarea><div class="body pv" id="pv"></div></div>`);
    const ta = $('#ed'),
      pv = $('#pv'),
      est = $('#est');
    // orig = the file's text as saved (with \n line endings). draft = unsaved text from an earlier visit,
    // if any.
    const orig = note.raw.replace(/\r\n?/g, '\n');
    const draft = S.drafts.get(path);
    ta.value = draft != null ? draft : orig;
    // status(text, cssClass): writes the small message next to the Save button ('Unsaved changes', 'Saved
    // to disk...').
    const status = (t, cls) => {
      est.className = cls || 'hint';
      est.textContent = t;
    };
    // Redraws the live preview from the current text. Errors are shown in the preview instead of breaking
    // the page.
    const paint = () => {
      try {
        pv.innerHTML = renderBody(makeNote({ path, text: ta.value }), { toc: false }).html;
      } catch (e) {
        pv.textContent = 'Preview error: ' + e.message;
      }
    };
    let timer = null;
    // On every keystroke: compare with the saved text to know if there are unsaved changes, store the
    // draft, and schedule a preview refresh.
    ta.addEventListener('input', () => {
      if (ta.value === (getNote(path) ? getNote(path).raw.replace(/\r\n?/g, '\n') : orig))
        S.drafts.delete(path);
      else S.drafts.set(path, ta.value);
      status(S.drafts.has(path) ? 'Unsaved changes' : '');
      clearTimeout(timer);
      timer = setTimeout(paint, 250);
    });
    // Tab key inserts two spaces instead of moving to the next field (handy for nested lists and code).
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        const s0 = ta.selectionStart,
          s1 = ta.selectionEnd;
        ta.value = ta.value.slice(0, s0) + '  ' + ta.value.slice(s1);
        ta.selectionStart = ta.selectionEnd = s0 + 2;
        ta.dispatchEvent(new Event('input'));
      }
    });
    // Save button: call saveNote() and show the result. Ctrl+S clicks this button (see the keyboard
    // handler in section 12).
    $('#saveBtn').addEventListener('click', async (e) => {
      if (S.demo) return; // the link opens the GitHub download page
      status('Saving...');
      try {
        const mode = await saveNote(getNote(path), ta.value);
        status(
          mode === 'disk'
            ? 'Saved to disk at ' + new Date().toLocaleTimeString()
            : 'Downloaded, replace the original file with it',
          'ok',
        );
        const tab = $('.tabs a:nth-child(2)');
        if (tab) tab.textContent = 'Edit';
      } catch (e) {
        status('Could not save: ' + e.message, 'err');
      }
    });
    status(draft != null ? 'Unsaved draft restored' : '');
    paint();
    ta.focus();
  }

   <label>Template<select id="nt"><option value="">Blank note</option>${tpls.map((t) => `<option value="${esc(t.path)}">${esc(t.path)}</option>`).join('')}</select></label>

   <p><button type="button" class="btn primary" id="nc">Create and edit</button> <span id="nerr" class="err"></span></p></div>`);

  // =============================================================================
  // SECTION 8 - SEARCH
  // Full-text search over titles, aliases, tags and the whole text of every note (code included).
  // =============================================================================

  // Returns [{ n: note, sc: score }] sorted by score. Every word typed must appear somewhere in the note
  // (AND search). Score: word in title +10, in file name +4, exact title/name +20, in an alias +6, in a tag +3,
  // plus 1 per occurrence in the text (capped at 8). TO CHANGE THE RANKING, edit the  sc += ...  lines.
  function search(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const res = [];
    if (!terms.length) return res;
    for (const n of S.notes) {
      if (!terms.every((t) => n.lc.includes(t))) continue;
      let sc = 0;
      const tl = n.title.toLowerCase(),
        nl = n.name.toLowerCase();
      for (const t of terms) {
        if (tl.includes(t)) sc += 10;
        if (nl.includes(t)) sc += 4;
        if (nl === t || tl === t) sc += 20;
        if (n.aliases.some((a) => a.toLowerCase().includes(t))) sc += 6;
        if ([...n.tags].some((x) => x.toLowerCase().includes(t))) sc += 3;
        sc += Math.min(n.lc.split(t).length - 1, 8);
      }
      res.push({ n, sc });
    }
    return res.sort((a, b) => b.sc - a.sc || a.n.title.localeCompare(b.n.title));
  }
  // Short text extract around the first match, with the searched words wrapped in <mark>.
  function snippet(n, terms) {
    const flat = n.content.replace(/[`#>*_|]/g, ' ').replace(/\s+/g, ' ');
    const low = flat.toLowerCase();
    let idx = -1;
    for (const t of terms) {
      idx = low.indexOf(t);
      if (idx >= 0) break;
    }
    const s = Math.max(0, idx - 60);
    let h = esc(flat.slice(s, s + 200));
    for (const t of terms)
      h = h.replace(
        new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
        '<mark>$1</mark>',
      );
    return (s > 0 ? '&hellip;' : '') + h + '&hellip;';
  }
  // Search results page (#/s/<text>).
  function viewSearch(q) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const res = search(q);
    setContent(
      `<h1 class="title">Search results</h1><div class="sub">${res.length} result${res.length === 1 ? '' : 's'} for <b>${esc(q)}</b></div><div class="body">${res.map(({ n }) => `<div class="res">${noteLink(n)}<div class="snip">${snippet(n, terms)}</div><div class="meta">${esc(n.path)} &middot; ${esc(fmtDate(n.mtime))}</div></div>`).join('') || '<p>No note matches your search.</p>'}</div>`,
    );
  }

  //   2. Write a view function  viewVlanTool()  that draws the page:

  //        - unique ids for its elements (e.g. 'vlanin', 'vlango', 'vlanout') so they do not clash

  //   4. Add it to the TOOLS list below:   { id: 'vlan', name: 'VLAN calculator' }

  // TIP: a copy button only needs   <button type="button" class="btn" data-copy="THE TEXT">Copy</button>
  //      (the click handler in section 12 does the rest). THE TEXT must go through esc().
  // Tools also work before a folder is opened (the router handles #/tool/... first).
  // =============================================================================
  // List of tools: id = used in the address (#/tool/<id>), name = label in the sidebar.
  // Empty for now; each new tool adds one line here.
  const TOOLS = [];

  // Tool router: shows the tool with this id. If the id is unknown (#/tool alone) it lists the available
  // tools.
  function viewTool(id) {
    // One line per tool, e.g.:  if (id === 'dice') return viewDiceTool();
    setContent(
      `<h1 class="title">Tools</h1><div class="body">${TOOLS.map((t) => `<div><a href="#/tool/${t.id}">${esc(t.name)}</a></div>`).join('') || '<p>No tools yet.</p>'}</div>`,
    );
