  // =============================================================================
  // SECTION 9B - WEATHER (the banner at the top of the page)
  // Shows today's weather, always visible in the header.
  //   - click the weather       -> next day, with new weather that follows from today's
  //   - click the small arrow   -> details: effects, Reroll today, climate, season, previous days
  // The weather has 'memory': tomorrow is most likely the same or a close state (overcast -> light rain),
  // and the temperature drifts toward the season's average instead of jumping around. Rain turns into
  // snow or sleet on its own when it is cold enough.
  // Everything is saved in the browser (localStorage), so it survives closing the page.
  // Test in the console:  __wiki.weather.next()   __wiki.weather.state
  // =============================================================================

  // The seasons, in order. The season is chosen in the details box and decides temperatures and odds.
  const SEASONS = ['spring', 'summer', 'autumn', 'winter'];

  // The kinds of sky, from calm to violent. The CLIMATES weights below use this same order.
  const SKY = ['clear', 'partly', 'overcast', 'fog', 'wind', 'light', 'heavy', 'storm'];
  // Which kinds of sky follow naturally from each other (used to make tomorrow look like today).
  const NEAR = {
    clear: ['partly', 'fog', 'wind'],
    partly: ['clear', 'overcast', 'fog', 'wind'],
    overcast: ['partly', 'light', 'fog', 'wind'],
    fog: ['clear', 'partly', 'overcast'],
    wind: ['partly', 'overcast', 'storm', 'clear'],
    light: ['overcast', 'heavy'],
    heavy: ['light', 'storm'],
    storm: ['heavy', 'wind'],
  };

  // CLIMATES. For each season:
  //   temp = [average °C, how much it varies]
  //   sky  = how likely each kind of sky is, in the SKY order:
  //          clear, partly, overcast, fog, wind, light (rain/snow), heavy, storm
  // TO ADD A CLIMATE: copy a block, give it a new key and name, change the numbers.
  const CLIMATES = {
    temperate: {
      name: 'Temperate',
      temp: { spring: [10, 5], summer: [22, 5], autumn: [10, 5], winter: [-3, 6] },
      sky: {
        spring: [3, 4, 3, 1, 1, 3, 2, 1],
        summer: [5, 4, 2, 1, 1, 2, 1, 2],
        autumn: [2, 3, 4, 2, 2, 3, 2, 1],
        winter: [2, 3, 4, 2, 2, 3, 2, 1],
      },
    },
    northern: {
      name: 'Northern (cold)',
      temp: { spring: [2, 5], summer: [14, 5], autumn: [3, 5], winter: [-15, 7] },
      sky: {
        spring: [2, 3, 4, 2, 2, 3, 2, 1],
        summer: [4, 4, 3, 2, 1, 2, 1, 1],
        autumn: [1, 2, 4, 2, 3, 3, 2, 2],
        winter: [2, 2, 4, 1, 3, 3, 3, 2],
      },
    },
    desert: {
      name: 'Desert',
      temp: { spring: [25, 6], summer: [38, 5], autumn: [26, 6], winter: [14, 6] },
      sky: {
        spring: [7, 3, 1, 0, 3, 1, 0, 1],
        summer: [9, 2, 1, 0, 3, 0, 0, 1],
        autumn: [7, 3, 1, 0, 3, 1, 0, 1],
        winter: [5, 3, 2, 1, 2, 2, 1, 0],
      },
    },
    tropical: {
      name: 'Tropical',
      temp: { spring: [27, 3], summer: [29, 3], autumn: [27, 3], winter: [25, 3] },
      sky: {
        spring: [3, 4, 2, 1, 1, 3, 3, 2],
        summer: [2, 3, 2, 1, 1, 3, 4, 4],
        autumn: [3, 4, 2, 1, 1, 3, 3, 2],
        winter: [5, 4, 2, 1, 1, 2, 1, 1],
      },
    },
  };

  // Small line icons (drawn with the text color of their parent, so they follow the theme).
  const wxSvg = (inner) =>
    `<svg class="wx-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const CLOUD = 'M7 17a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5a4.25 4.25 0 0 1 .5 8.5z';
  const CLOUD_UP = 'M7 13a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 4.5a4.25 4.25 0 0 1 .5 8.5z';
  const WX_ICONS = {
    sun: wxSvg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>'),
    partly: wxSvg('<circle cx="8" cy="8" r="3"/><path d="M8 2.5v1M2.5 8h1M4.1 4.1l.7.7M11.9 4.1l-.7.7"/><path d="M9 20a3.5 3.5 0 0 1-.4-6.97A4.8 4.8 0 0 1 17.5 12a3.7 3.7 0 0 1 .4 8z"/>'),
    cloud: wxSvg(`<path d="${CLOUD}"/>`),
    fog: wxSvg('<path d="M4 8h13M6 12h14M3 16h12M8 20h9"/>'),
    wind: wxSvg('<path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>'),
    rain: wxSvg(`<path d="${CLOUD_UP}"/><path d="M8 16l-1 3M12 16l-1 3M16 16l-1 3"/>`),
    snow: wxSvg(`<path d="${CLOUD_UP}"/><circle cx="8" cy="17" r=".6"/><circle cx="12" cy="19" r=".6"/><circle cx="16" cy="17" r=".6"/><circle cx="10" cy="21" r=".6"/><circle cx="14" cy="21" r=".6"/>`),
    storm: wxSvg(`<path d="${CLOUD_UP}"/><path d="M12.5 14l-2.5 4h4l-2.5 4"/>`),
  };

  // Turns a kind of sky + a temperature into what the page shows: icon, name and effect at the table.
  // TO CHANGE A NAME OR AN EFFECT: edit the text here.
  function wxInfo(sky, t, climate) {
    const snow = t <= 0,
      sleet = t > 0 && t <= 2;
    const I = (icon, label, effect) => ({ icon, label, effect: effect || '' });
    switch (sky) {
      case 'clear':
        if (t >= 32) return I('sun', 'Scorching sun', 'Heat: travellers need double water; heavy armour is exhausting.');
        if (t <= -15) return I('sun', 'Bitter clear cold', 'Frostbite risk without warm clothing.');
        return I('sun', 'Clear skies');
      case 'partly':
        return I('partly', 'Scattered clouds');
      case 'overcast':
        return I('cloud', 'Overcast', 'Dim, grey light.');
      case 'fog':
        return snow
          ? I('fog', 'Freezing fog', 'Visibility about 30 m; surfaces icy. Easy to ambush, hard to navigate.')
          : I('fog', 'Fog', 'Visibility about 30 m. Easy to ambush, hard to navigate.');
      case 'wind':
        return I('wind', snow ? 'Biting wind' : 'Strong winds', 'Ranged attacks hampered; flames gutter; voices carry poorly.');
      case 'light':
        if (snow) return I('snow', 'Light snow', 'Tracks are easy to follow.');
        if (sleet) return I('rain', 'Sleet', 'Icy, miserable travel.');
        return I('rain', 'Light rain', 'Muddy roads; tracks wash out.');
      case 'heavy':
        if (snow) return I('snow', 'Heavy snow', 'Travel halved; short visibility; tracks vanish.');
        return I('rain', 'Heavy rain', 'Sight and hearing reduced; open flames go out; travel slowed.');
      case 'storm':
        if (climate === 'desert' && t > 5) return I('wind', 'Sandstorm', 'Visibility near zero; cover your face; travel impossible.');
        if (snow) return I('snow', 'Blizzard', 'Visibility near zero; travel dangerous; exposure risk.');
        return I('storm', 'Thunderstorm', 'Lightning, deafening thunder, flooding. Seek shelter.');
    }
    return I('cloud', sky);
  }

  // THE WEATHER STATE, saved in the browser under the key 'dm-weather':
  //   climate  a key of CLIMATES        season  a value of SEASONS
  //   sky      a SKY value              temp    °C
  //   history  the previous days, newest first: [{ sky, temp }]
  const WX_KEY = 'dm-weather';
  const fmtTemp = (t) => (t < 0 ? '\u2212' + -t : t) + '\u00A0°C';
  const cap1 = (w) => w.charAt(0).toUpperCase() + w.slice(1);
  let WX = null;
  let wxOpen = false;

  function wxSave() {
    try {
      localStorage.setItem(WX_KEY, JSON.stringify(WX));
    } catch (e) {}
  }
  // Reads the saved weather, or starts fresh (Temperate, winter) the first time.
  function wxLoad() {
    try {
      WX = JSON.parse(localStorage.getItem(WX_KEY));
    } catch (e) {}
    if (!WX || !CLIMATES[WX.climate] || !SEASONS.includes(WX.season) || !SKY.includes(WX.sky)) {
      WX = { climate: 'temperate', season: 'winter', sky: null, temp: null, history: [] };
      wxRoll(false);
    }
  }

  // Rolls the weather.
  //   advance = true   next day: today goes into the history, the new day follows from today
  //   advance = false  reroll today: follows from yesterday (or from the season average)
  function wxRoll(advance) {
    let from;
    if (advance) {
      from = { sky: WX.sky, temp: WX.temp };
      if (WX.sky) WX.history = [{ sky: WX.sky, temp: WX.temp }].concat(WX.history).slice(0, 6);
    } else from = WX.history[0] || { sky: null, temp: null };
    const c = CLIMATES[WX.climate],
      season = WX.season;
    // Chance of each sky = climate weight x 2.5 if same as before, x 2 if a close state, x 1 otherwise.
    const w = SKY.map(
      (k, i) => c.sky[season][i] * (!from.sky ? 1 : k === from.sky ? 2.5 : NEAR[from.sky].includes(k) ? 2 : 1),
    );
    let r = Math.random() * w.reduce((a, b) => a + b, 0),
      i = 0;
    for (; i < SKY.length - 1; i++) {
      r -= w[i];
      if (r < 0) break;
    }
    WX.sky = SKY[i];
    // Temperature: move a third of the way toward the season average, plus a random swing.
    const [mean, spread] = c.temp[season];
    const t0 = from.temp == null ? mean : from.temp;
    const swing = (Math.random() + Math.random() + Math.random() - 1.5) * 2; // roughly -3..3, mostly near 0
    WX.temp = Math.round(t0 + (mean - t0) * 0.35 + swing * spread * 0.6);
    wxSave();
  }

  // Draws the banner (and the details box when it is open) inside <div id="wx"> in the header.
  function renderWeather() {
    const box = $('#wx');
    if (!box) return;
    const now = wxInfo(WX.sky, WX.temp, WX.climate);
    const tip = now.label + ', ' + fmtTemp(WX.temp) + (now.effect ? '. ' + now.effect : '') + '\nClick for the next day.';
    let pop = '';
    if (wxOpen) {
      const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(label)}</option>`;
      const hist = WX.history
        .map((h, i) => {
          const x = wxInfo(h.sky, h.temp, WX.climate);
          return `<div class="wx-row">${WX_ICONS[x.icon]}<span>${i ? i + 1 + ' days ago' : 'Yesterday'}</span><span>${esc(x.label)}, ${fmtTemp(h.temp)}</span></div>`;
        })
        .join('');
      pop = `<div class="wx-pop form" role="dialog" aria-label="Weather">
  <div class="wx-now">${WX_ICONS[now.icon]}<div><b>${esc(now.label)}</b>, ${fmtTemp(WX.temp)}</div></div>
  <p class="wx-eff">${esc(now.effect || 'No effect on travel.')}</p>
  <p class="wx-btns"><button type="button" class="btn primary" data-act="wx-next">Next day</button> <button type="button" class="btn" data-act="wx-reroll">Reroll today</button></p>
  <label>Climate<select id="wxclim">${Object.entries(CLIMATES).map(([k, c]) => opt(k, c.name, k === WX.climate)).join('')}</select></label>
  <label>Season<select id="wxseason">${SEASONS.map((k) => opt(k, cap1(k), k === WX.season)).join('')}</select></label>
  ${hist ? `<div class="wx-hist"><div class="hint">Previous days</div>${hist}</div>` : ''}
</div>`;
    }
    box.innerHTML = `<button type="button" class="wx-chip" data-act="wx-next" title="${esc(tip)}">${WX_ICONS[now.icon]}<span class="wx-t">${fmtTemp(WX.temp)}</span><span class="wx-l">${esc(now.label)}</span></button><button type="button" class="wx-more" data-act="wx-menu" aria-label="Weather details" aria-expanded="${wxOpen}">&#9662;</button>${pop}`;
  }
  // Opens / closes the details box.
  function wxToggle(open) {
    wxOpen = open == null ? !wxOpen : open;
    renderWeather();
  }
  // Changing the climate or the season in the details box starts a fresh roll for today
  // (the previous days are forgotten, since they belonged to another place or time).
  function wxSettingsChanged() {
    WX.climate = $('#wxclim').value;
    WX.season = $('#wxseason').value;
    WX.history = [];
    wxRoll(false);
    renderWeather();
  }

  // =============================================================================
  // SECTION 9C - DICE ROLLER (the dice button at the top, and dice written in your notes)
  // Click the dice button in the header: a terminal-like box opens with
  //   - one button per die (d4 ... d100): click to roll one
  //   - a log of the rolls (kept in the browser, so it survives closing the page)
  //   - a command line: type a roll and press Enter. Up / Down arrows recall earlier commands.
  // What you can type (type  help  in the box to see this list):
  //   2d8+1d10+3     dice and numbers added together (- works too)
  //   d20+5 adv      advantage: roll the d20 twice, keep the highest  (dis = disadvantage)
  //   4d6kh3         keep the 3 highest (kl3 = keep the 3 lowest)
  //   3d6!           exploding dice: a maximum roll rolls again and adds
  //   3x d20+4       the same roll 3 times (e.g. three goblins attacking)
  //   cc 60          Call of Cthulhu: d100 against skill 60, gives Critical / Extreme / Hard / Regular /
  //   cc 60 b        Failure / Fumble.  b = 1 bonus die, bb = 2, p = 1 penalty die, pp = 2
  //   2d6 # fire     anything after # is a label shown in the log
  //   clear          empties the log
  // Dice written in a note ('the trap deals 3d6', or `2d8+1d10` in backticks) become clickable
  // (see diceLink() and step 7b of inline() in section 4).
  // Test in the console:  __wiki.dice.roll('4d6kh3')
  // =============================================================================

  const DICE_PAD = [4, 6, 8, 10, 12, 20, 100]; // the die buttons. Add or remove sizes here.
  const DICE_KEY = 'dm-dice'; // where the log is saved in the browser
  const DICE_LOG_MAX = 80; // how many rolls the log keeps
  const DICE_ICON = wxSvg(
    '<path d="M12 2.5 20.5 7.3v9.4L12 21.5 3.5 16.7V7.3z"/><path d="M12 7 17 15.5H7z"/><path d="M12 2.5V7M3.5 7.3 7 15.5M20.5 7.3 17 15.5M12 21.5 7 15.5M12 21.5l5-6"/>',
  );
  let diceIsOpen = false;
  let diceHist = []; // commands typed, oldest first (for the Up / Down arrows)
  let diceHistPos = 0;

  // A fair random number from 1 to sides (uses the browser's crypto generator when it exists).
  function rnd(sides) {
    if (!window.crypto || !crypto.getRandomValues) return 1 + Math.floor(Math.random() * sides);
    const a = new Uint32Array(1),
      lim = Math.floor(0x100000000 / sides) * sides;
    do crypto.getRandomValues(a);
    while (a[0] >= lim);
    return 1 + (a[0] % sides);
  }

  // Reads a dice expression such as '2d8+1d10-1' into a list of terms:
  //   { sign, n, sides, explode, keep: { hi, n } | null }   for dice
  //   { sign, value }                                       for plain numbers
  // Throws an Error with a readable message when something cannot be read.
  function parseDice(expr) {
    const src = expr.replace(/\s+/g, '').replace(/[\u2212\u2013]/g, '-').replace(/d%/gi, 'd100').toLowerCase();
    if (!src) throw new Error('nothing to roll');
    const parts = src.match(/[+-]?[^+-]+/g);
    if (!parts || parts.join('') !== src) throw new Error(`could not read "${expr.trim()}"`);
    return parts.map((p) => {
      const sign = p[0] === '-' ? -1 : 1;
      const body = p.replace(/^[+-]/, '');
      let m;
      if ((m = body.match(/^(\d*)d(\d+)(!?)(?:k([hl]?)(\d+))?$/))) {
        const n = m[1] ? +m[1] : 1,
          sides = +m[2];
        if (n < 1 || n > 100) throw new Error('use 1 to 100 dice per group');
        if (sides < 2 || sides > 1000) throw new Error('dice need 2 to 1000 sides');
        const keep = m[5] ? { hi: m[4] !== 'l', n: Math.max(1, Math.min(+m[5], n)) } : null;
        return { sign, n, sides, explode: !!m[3], keep };
      }
      if (/^\d+$/.test(body)) return { sign, value: +body };
      throw new Error(`could not read "${body}"`);
    });
  }

  // Reads a whole command line: label after #, 'Nx' repeat, 'cc' Cthulhu rolls, adv / dis, then the dice.
  function parseCommand(line) {
    const hash = line.indexOf('#');
    const label = hash >= 0 ? line.slice(hash + 1).trim() : '';
    let text = (hash >= 0 ? line.slice(0, hash) : line).trim();
    let repeat = 1,
      m;
    if ((m = text.match(/^(\d+)\s*x\s+(.+)$/i))) {
      repeat = Math.min(Math.max(+m[1], 1), 20);
      text = m[2];
    }
    if ((m = text.match(/^(?:cc|coc)\s*(\d{1,3})\s*([bp]*)$/i))) {
      const b = (m[2].match(/b/gi) || []).length - (m[2].match(/p/gi) || []).length;
      return { label, repeat, cc: { skill: +m[1], bonus: Math.max(-2, Math.min(2, b)) } };
    }
    let adv = 0;
    text = text.replace(/disadvantage|dis|advantage|adv/gi, (w) => {
      adv = /^a/i.test(w) ? 1 : -1;
      return '';
    });
    // 'd20+adv' leaves 'd20+': drop a dangling + or - at the ends.
    text = text.replace(/^[\s+\-]+|[\s+\-]+$/g, '');
    const terms = parseDice(text);
    if (adv) {
      const t = terms.find((x) => x.sides === 20 && x.n === 1 && !x.keep);
      if (!t) throw new Error('adv / dis needs a single d20, e.g. d20+5 adv');
      t.n = 2;
      t.keep = { hi: adv > 0, n: 1 };
    }
    return { label, repeat, terms };
  }

  // Rolls one dice term. Returns { dice: [{ v, ex, drop }], sum }.
  function rollTerm(t) {
    const dice = [];
    for (let i = 0; i < t.n; i++) {
      let v = rnd(t.sides);
      dice.push({ v });
      for (let guard = 0; t.explode && v === t.sides && guard < 50; guard++) {
        v = rnd(t.sides);
        dice.push({ v, ex: true });
      }
    }
    if (t.keep) {
      const order = dice.map((d, i) => i).sort((a, b) => (t.keep.hi ? dice[b].v - dice[a].v : dice[a].v - dice[b].v));
      order.slice(t.keep.n).forEach((i) => (dice[i].drop = true));
    }
    return { dice, sum: dice.reduce((s, d) => s + (d.drop ? 0 : d.v), 0) };
  }

  // Rolls a list of terms once. Returns { html, total } for one log line.
  function rollTerms(terms) {
    let total = 0;
    const parts = terms.map((t, i) => {
      const op = t.sign < 0 ? ' \u2212 ' : i ? ' + ' : '';
      if (t.value != null) {
        total += t.sign * t.value;
        return op + t.value;
      }
      const r = rollTerm(t);
      total += t.sign * r.sum;
      const kept = r.dice.filter((d) => !d.drop);
      const nat = t.sides === 20 && kept.length === 1 ? kept[0].v : 0;
      const name = `${t.n}d${t.sides}${t.explode ? '!' : ''}${t.keep ? 'k' + (t.keep.hi ? 'h' : 'l') + t.keep.n : ''}`;
      const list = r.dice
        .map((d) => {
          const cls = d.drop ? 'drop' : nat === 20 ? 'crit' : nat === 1 ? 'fum' : '';
          return `<span${cls ? ` class="${cls}"` : ''}>${d.v}${d.ex ? '!' : ''}</span>`;
        })
        .join(', ');
      return `${op}<span class="dim">${name}</span> [${list}]`;
    });
    return { html: parts.join('') + ` = <b class="tot">${total}</b>`, total };
  }

  // Call of Cthulhu percentile roll against a skill, with bonus (+) or penalty (-) dice.
  // One units die (0-9) and one or more tens dice (00-90); 00 + 0 counts as 100.
  // Bonus dice keep the lowest result, penalty dice the highest.
  function rollCoc(skill, bonus) {
    const u = rnd(10) - 1;
    const tens = [];
    for (let i = 0; i <= Math.abs(bonus); i++) tens.push(rnd(10) - 1);
    const vals = tens.map((t) => t * 10 + u || 100);
    const r = bonus > 0 ? Math.min(...vals) : bonus < 0 ? Math.max(...vals) : vals[0];
    let level, cls;
    if (r === 1) [level, cls] = ['Critical!', 'crit'];
    else if (r >= (skill < 50 ? 96 : 100)) [level, cls] = ['Fumble', 'fum'];
    else if (r <= Math.floor(skill / 5)) [level, cls] = ['Extreme success', 'crit'];
    else if (r <= Math.floor(skill / 2)) [level, cls] = ['Hard success', 'good'];
    else if (r <= skill) [level, cls] = ['Regular success', 'good'];
    else [level, cls] = ['Failure', 'dim'];
    const extra = bonus ? ` (${Math.abs(bonus)} ${bonus > 0 ? 'bonus' : 'penalty'})` : '';
    const tensTxt = tens.map((t) => String(t * 10).padStart(2, '0')).join(', ');
    return {
      html: `<span class="dim">d100 vs ${skill}${extra}</span> tens [${tensTxt}] units [${u}] = <b class="tot">${r}</b> <span class="${cls}">${level}</span>`,
      total: r,
    };
  }

  const DICE_HELP = `<pre class="dl-help">2d8+1d10+3   add dice and numbers
d20+5 adv    advantage (dis = disadvantage)
4d6kh3       keep the 3 highest (kl3 = lowest)
3d6!         exploding dice
3x d20+4     roll 3 times
cc 60        Call of Cthulhu d100 vs skill 60
cc 60 b      1 bonus die (bb = 2, p / pp = penalty)
2d6 # fire   label after #
clear        empty the log</pre>`;

  // Runs one command (typed, a die button, or a dice link in a note) and adds the result to the log.
  function diceRun(line) {
    line = String(line).trim();
    if (!line) return;
    if (diceHist[diceHist.length - 1] !== line) diceHist.push(line);
    diceHist = diceHist.slice(-50);
    diceHistPos = diceHist.length;
    const log = $('#dicelog');
    if (/^(clear|cls)$/i.test(line)) {
      log.innerHTML = '';
      diceSave();
      return diceEmpty();
    }
    const hash = line.indexOf('#');
    const cmd = `<div class="dl-cmd"><span class="pr">&rsaquo;</span> ${esc(hash >= 0 ? line.slice(0, hash) : line)}${hash >= 0 ? `<span class="lbl">${esc(line.slice(hash))}</span>` : ''}</div>`;
    let out = '',
      last = null;
    if (/^(help|\?)$/i.test(line)) out = DICE_HELP;
    else
      try {
        const c = parseCommand(line);
        for (let i = 0; i < c.repeat; i++) {
          const r = c.cc ? rollCoc(c.cc.skill, c.cc.bonus) : rollTerms(c.terms);
          out += `<div class="dl-out">${r.html}</div>`;
          last = r.total;
        }
        if (c.repeat > 1) last = c.repeat + '\u00D7';
      } catch (e) {
        out = `<div class="dl-out fum">${esc(e.message)}. Type help for examples.</div>`;
      }
    const empty = $('.dl-empty', log);
    if (empty) empty.remove();
    log.insertAdjacentHTML('beforeend', `<div class="dl">${cmd}${out}</div>`);
    while (log.children.length > DICE_LOG_MAX) log.firstElementChild.remove();
    log.scrollTop = log.scrollHeight;
    if (last != null) $('.dice-last').textContent = last;
    diceSave();
  }
  // The grey line shown when the log is empty.
  function diceEmpty() {
    $('#dicelog').innerHTML = '<div class="dl-empty">Click a die or type a roll, then Enter. Type help for examples.</div>';
  }
  // Saves the log, the command history and the last result in the browser.
  function diceSave() {
    try {
      const log = [...$('#dicelog').children].filter((d) => d.classList.contains('dl')).map((d) => d.outerHTML);
      localStorage.setItem(DICE_KEY, JSON.stringify({ log, hist: diceHist, last: $('.dice-last').textContent }));
    } catch (e) {}
  }

  // Builds the dice button and its (hidden) terminal box inside <div id="dice"> in the header, and
  // restores the saved log. Called once at start-up.
  function diceInit() {
    let saved = {};
    try {
      saved = JSON.parse(localStorage.getItem(DICE_KEY)) || {};
    } catch (e) {}
    diceHist = Array.isArray(saved.hist) ? saved.hist : [];
    diceHistPos = diceHist.length;
    $('#dice').innerHTML = `<button type="button" class="dice-chip" data-act="dice-menu" aria-expanded="false" title="Dice roller">${DICE_ICON}<span class="dice-last">${esc(saved.last || 'Roll')}</span></button>
<div class="dice-term" id="diceterm" role="dialog" aria-label="Dice roller" hidden>

  // Pattern for dice written in a note's text: 3d6, d20, 1d8+2, d% ... (common die sizes only, so words

  // =============================================================================
  // SECTION 9D - INITIATIVE TRACKER (D&D)
  // In the header there is only the crossed swords button. Click it to show the initiative bar under the
  // header (click again to hide it; the fight is kept). The bar shows, from left to right:
  //   R2  ‹ Next ›   the round and the buttons that pass the turn (the round goes up after the last one)
  //   the track      everyone in turn order, highest first; the current turn is outlined.
  //                  Each creature: name (click it to remove the creature; Undo appears for a few
  //                  seconds), initiative, tag icon (add a condition).
  //                  Click a number to change it at any moment (Enter or leaving the field re-sorts).
  //                  Conditions stack under the name; point at one for a reminder, click it to remove it.
  //                  A condition with rounds loses one at the end of that creature's turn.
  //   the Add form   a name, the initiative, Monster / Player, Add (or Enter).
  //                  Players: their total (e.g. 17).  Monsters: their total, or +2 / -1 to roll d20+2 / d20-1.
  //                  'Goblin x3' adds Goblin 1, 2 and 3 (each rolls its own with +2; a total is shared).
  //                  Typing a name suggests monster notes (or known players): see initSuggest().
  //   End            ends the fight: monsters leave, players stay with an empty initiative, round 1.
  // Saved in the browser. Test in the console:  __wiki.initiative.state
  // =============================================================================

  const INIT_KEY = 'dm-init';
  const INIT_ICON = wxSvg('<path d="M3 3l11 11M21 3 10 14"/><path d="M12 16l4-4M8 12l4 4"/><path d="M14 14l5 5M10 14l-5 5"/>');
  // INIT = { list: [{ id, name, init, kind: 'player' | 'monster', conds: [{ n: name, r: rounds or null }] }], cur: id of the current turn or null,
  //          round, kind: the kind chosen last in the Add form, show: is the bar visible, seq: id counter }
  let INIT = null;

  function initSave() {
    try {
      localStorage.setItem(INIT_KEY, JSON.stringify(INIT));
    } catch (e) {}
  }
  function initLoad() {
    try {
      INIT = JSON.parse(localStorage.getItem(INIT_KEY));
    } catch (e) {}
    if (!INIT || !Array.isArray(INIT.list)) INIT = { list: [], cur: null, round: 1, kind: 'monster', show: false, seq: 0 };
  }
  // The list in turn order: highest initiative first; creatures without a number go last.
  // Equal numbers keep the order in which they were added (type 15.5 to put someone ahead of a 15).
  function initOrder() {
    const v = (c) => (c.init === '' || c.init == null || isNaN(c.init) ? -Infinity : +c.init);
    return INIT.list.map((c, i) => [c, i]).sort((a, b) => v(b[0]) - v(a[0]) || a[1] - b[1]).map((x) => x[0]);
  }
  // Reads an initiative box. Everyone: a total such as 17 (or 15.5). Monsters also: +2 / -1 = roll d20+2 / d20-1.
  // Returns the number, '' for an empty box, or throws an Error with a short message.
  function initValue(txt, kind) {
    txt = String(txt).trim().replace(/\u2212/g, '-');
    if (!txt) return '';
    if (/^\d+(\.\d+)?$/.test(txt)) return +txt;
    if (kind === 'monster' && /^[+-]\d+$/.test(txt)) return rollTerms(parseDice('1d20' + txt)).total;
    throw new Error(kind === 'player' ? 'players: type their total, e.g. 17' : 'type a total (15) or a bonus (+2)');
  }
  // Shows a short note under the bar for a few seconds (an error, or 'removed' with an Undo button).
  let initErrTimer = null;
  function initNote(html, ms) {
    const el = $('#iberr');

    clearTimeout(initErrTimer);
    initErrTimer = setTimeout(() => (el.innerHTML = ''), ms || 4000);
  }
  const initError = (msg) => initNote(esc(msg));
  // Moves the turn forward (+1) or back (-1). The round goes up after the last creature.
  function initStep(d) {
    const order = initOrder();
    if (!order.length) return;
    let i = order.findIndex((c) => c.id === INIT.cur);
    // Going forward ends the current creature's turn: its timed conditions lose a round.
    if (d > 0 && i >= 0) initTickConds(order[i]);
    if (i < 0) i = d > 0 ? -1 : 0;
    i += d;
    if (i >= order.length) {
      i = 0;
      INIT.round++;
    } else if (i < 0) {
      if (INIT.round > 1) {
        i = order.length - 1;
        INIT.round--;
      } else i = 0;
    }

    initSave();
    initRefresh();
    initAutoPin(order[i]); // a monster's turn pins its stat block (section 9F)
  }
  // Adds one creature (or several with 'Name x3') from the Add form.
  function initAdd() {
    const nameEl = $('#ibname'),
      valEl = $('#ibval'),
      kind = INIT.kind;
    let name = nameEl.value.trim(),
      count = 1;
    const xm = name.match(/^(.*?)\s*[x\u00D7](\d{1,2})$/i);
    if (xm && xm[1]) {
      name = xm[1].trim();
      count = Math.max(1, Math.min(+xm[2], 20));
    }
    if (!name) {
      initError('Type a name.');
      return nameEl.focus();
    }
    // A monster with a note (section 9F): its HP comes from the note, and an empty box rolls d20 + DEX.
    const mnote = kind === 'monster' ? monsterNote(name) : null;
    let raw = valEl.value.trim();
    if (!raw && mnote) raw = fmtBonus(monsterInit(mnote));
    const roll = /^[+\-\u2212]/.test(raw);
    let values;
    try {
      values = [];
      for (let k = 0; k < count; k++) values.push(k === 0 || roll ? initValue(raw, kind) : values[0]);
    } catch (e) {
      initError(cap(e.message) + '.');
      return valEl.focus();
    }

    let start = 1;

    for (const c of INIT.list) {
      const m = c.name.match(re);
      if (m) start = Math.max(start, +m[1] + 1);
      else if (c.name.toLowerCase() === name.toLowerCase()) start = Math.max(start, 2);
    }
    const numbered = count > 1 || start > 1;
    const hp = mnote ? monsterHp(mnote) : null;
    // Players' names are remembered for the name suggestions of the next fights.
    if (kind === 'player') INIT.known = [...new Set([name].concat(INIT.known || []))].slice(0, 30);
    values.forEach((v, k) =>
      INIT.list.push({
        id: 'c' + ++INIT.seq,

    initRefresh();

    valEl.value = '';

  // Removes one creature. If it was its turn, the turn passes to the next one (first of the next round

      const i = order.findIndex((c) => c.id === id);

      INIT.cur = next ? next.id : null;

    INIT.list = INIT.list.filter((c) => c.id !== id);

  // NAME SUGGESTIONS in the Add form: typing 'go' lists the matching monster notes (Goblin, Goblin
